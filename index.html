<title>Ap40k — Compagnon Space Marines</title>

<style id="app-styles">:root {
  color-scheme: dark;
  --bg: #0b0f14;
  --bg-2: #121922;
  --card: #18212c;
  --card-2: #202b38;
  --line: #2e3b4b;
  --text: #e9eef5;
  --muted: #9dabbb;
  --accent: #f0b429;
  --accent-2: #55b8e8;
  --good: #6fd08c;
  --danger: #f0736b;
  --radius: 14px;
  --tap: 44px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button, select, input[type="search"] {
  min-height: var(--tap);
}

button {
  border: 1px solid var(--line);
  background: var(--card-2);
  border-radius: 10px;
  padding: 8px 14px;
  cursor: pointer;
  touch-action: manipulation;
}
button:hover { border-color: var(--accent); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #1a1305;
  font-weight: 700;
}
button.ghost { background: transparent; }
button.danger { border-color: var(--danger); color: var(--danger); }

input[type="search"], input[type="text"], select, textarea {
  width: 100%;
  min-height: var(--tap);
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
}
textarea { min-height: 130px; font-family: ui-monospace, monospace; font-size: 13px; }

:focus-visible {
  outline: 3px solid var(--accent-2);
  outline-offset: 2px;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background: rgba(11, 15, 20, .96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
}
.brand { font-weight: 800; letter-spacing: .5px; color: var(--accent); font-size: 18px; }
.brand small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.header-spacer { flex: 1; }
.icon-btn { min-width: var(--tap); padding: 8px 10px; font-size: 13px; }

main {
  padding: 14px 14px calc(96px + env(safe-area-inset-bottom));
  max-width: 780px;
  margin: 0 auto;
}

.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  background: rgba(11, 15, 20, .97);
  border-top: 1px solid var(--line);
}
.tabbar button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 56px;
  background: transparent;
  border-color: transparent;
  color: var(--muted);
  font-size: 12px;
}
.tabbar button .tab-icon { font-size: 18px; line-height: 1; }
.tabbar button[aria-selected="true"] {
  color: var(--accent);
  background: var(--card);
  border-color: var(--line);
}

h1 { font-size: 22px; margin: 4px 0 12px; }
h2 { font-size: 17px; margin: 22px 0 10px; color: var(--accent); }
h3 { font-size: 15px; margin: 16px 0 8px; }
p { margin: 8px 0; }

.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11px; }
.center { text-align: center; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stack { display: grid; gap: 10px; }
.grow { flex: 1; }

.search-wrap { position: relative; margin: 4px 0 14px; }
.search-wrap input { padding-left: 38px; }
.search-wrap .mag { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 10px;
}
.card.tappable { cursor: pointer; }
.card.tappable:hover { border-color: var(--accent); }
.card-title { font-weight: 700; font-size: 16px; }
.card-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-2);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .4px;
  white-space: nowrap;
}
.badge.sm { background: var(--accent); border-color: var(--accent); color: #1a1305; }
.badge.da { background: #25415e; border-color: #3f6d99; color: #d9ecff; }
.badge.ki { background: #4a3220; border-color: #7a5330; color: #ffe4c2; }
.badge.support { background: #2c4638; border-color: #42775a; color: #d6f5e2; }

.points {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.points b { color: var(--accent); font-size: 18px; }

.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 20px 0 8px;
  font-weight: 700;
  color: var(--accent);
}
.section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.statgrid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.statgrid .cell { text-align: center; padding: 8px 2px; }
.statgrid .head { background: var(--card-2); color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .5px; }
.statgrid .val { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }

.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table th { color: var(--muted); font-size: 11px; letter-spacing: .3px; }
.table tr:last-child td { border-bottom: 0; }
.table .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

.weapon-name { font-weight: 700; }
.weapon-props { color: var(--muted); font-size: 11px; }
.granted { color: var(--good); }
.removed { color: var(--danger); text-decoration: line-through; opacity: .75; }

.option-group { margin-bottom: 12px; }
.choice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-height: var(--tap);
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg-2);
  margin-bottom: 6px;
  cursor: pointer;
}
.choice input { margin-top: 4px; accent-color: var(--accent); width: 20px; height: 20px; flex: none; }
.choice.disabled { opacity: .45; cursor: not-allowed; }
.choice .label { flex: 1; }
.choice .cost { color: var(--accent); font-weight: 700; white-space: nowrap; }

.bonus {
  border-left: 3px solid var(--good);
  padding: 6px 10px;
  margin: 6px 0;
  background: var(--bg-2);
  border-radius: 0 8px 8px 0;
}
.bonus .bonus-name { font-weight: 700; color: var(--good); }
.bonus .bonus-cond { color: var(--muted); font-size: 12px; }

.prose { white-space: pre-wrap; font-size: 14px; }
.prose ul, .prose ol { margin: 6px 0; padding-left: 20px; }

.empty {
  text-align: center;
  color: var(--muted);
  padding: 30px 12px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}

.back-btn { margin-bottom: 12px; }

.total-bar {
  position: sticky;
  bottom: calc(70px + env(safe-area-inset-bottom));
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  background: var(--card);
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  margin-top: 12px;
}

.export-actions { margin: 8px 0; }

.qty-btn { min-width: var(--tap); padding: 6px 10px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(90px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 50;
  max-width: min(90vw, 460px);
  padding: 10px 16px;
  border-radius: 10px;
  background: var(--accent);
  color: #1a1305;
  font-weight: 700;
  box-shadow: 0 8px 24px rgba(0,0,0,.45);
}

.footnote { color: var(--muted); font-size: 11px; text-align: center; padding: 18px 6px 4px; }

@media (min-width: 600px) {
  main { padding-left: 20px; padding-right: 20px; }
  .statgrid { grid-template-columns: repeat(7, 1fr); }
}
</style>
</head>

Quality, you can either select one Quality or you can randomly select one Quality by rolling a D6 and consulting the relevant table below. Until the end of the battle, the ability described in the Quality selected applies to all models in your army with this ability.\n\nThe first time your selected Deed is completed your Oath is fulfilled and, until the end of the battle, your army becomes Honoured and you gain 2CP, or 3CP if you randomly selected your Deed and/or Quality (CP gained in this way are an exemption to the Core Rules that limit the maximum number of CP you can gain per battle round to 1).\n\nDeed\nD6We vow to lay low the tyrant...\nAt the start of the battle, select one CHARACTER model in your opponent’s army. This Deed is completed at the end of a turn if that CHARACTER is destroyed. We swear to reclaim the realm...\nThis deed is completed at the end of your opponent’s turn if you control more objective markers than your opponent. We pledge to reap a great tally...\nThis deed is completed at the end of the battle round if the number of enemy units destroyed this battle round is greater than the battle round number even if those units are subsequently returned to the battlefield (for example, two destroyed enemy units in the first battle round). \nQuality\nD6...with our martial valour risen over all.\nEach time this model is selected to shoot or fight, you can re-roll one Hit roll and you can re-roll one Wound roll. ...and we are eager for the challenge.\nAdd 2\" to this model’s Move characteristic and add 1 to Advance and Charge rolls made for this model. ...yet shall our legacy be unsullied.\nImprove this model’s Objective Control characteristic by 2 and its Leadership characteristic by 1.","type":"Faction","model":"","shared":true},{"name":"Super-heavy Walker","description":"Each time a model with this ability makes a Normal, Advance or Fall Back move, it can move through models (excluding TITANIC models) and sections of terrain features that are 4\" ":"knight-stubber","label":"Meltagun → Questoris heavy stubber","scope":"perUnit","mode":"multi","min":0,"max":1,"maxTakes":1,"choices":[{"id":"stubber","label":"Questoris heavy stubber","cost":0,"costMode":"flat","grants":["Questoris heavy stubber"],"removes":["meltagun"],"note":""}]},{"id":"knight-gauntlet","label":"Reaper chainsword → Thunderstrike gauntlet","scope":"perUnit","mode":"multi","min":0,"max":1,"maxTakes":1,"choices":[{"id":"gauntlet","label":"thunderstrike gauntlet","cost":0,"costMode":"flat","grants":["thunderstrike gauntlet"],"removes":["reaper chainsword"],"note":""}]},{"id":"knight-heavy","label":"Arme lourde","scope":"perUnit","mode":"single","min":0,"max":1,"choices":[{"id":"none","label":"Aucune","cost":0,"costMode":"flat","grants":[],"removes":[],"note":"Armement de départ"},{"id":"ironstorm","label":"ironstorm missile pod","cost":0,"costMode":"flat","grants":["ironstorm missile pod"],"removes":[],"note":""},{"id":"stormspear","label":"stormspear rocket pod","cost":0,"costMode":"flat","grants":["stormspear rocket pod"],"removes":[],"note":""},{"id":"twin-icarus","label":"twin Icarus autocannon","cost":0,"costMode":"flat","grants":["twin Icarus autocannon"],"removes":[],"note":""}]}]}},"translations":{"schemaVersion":1,"locale":"fr","strings":{"* against ranged attacks only":"* uniquement contre les attaques à distance","• Attacks that target this unit have -1 D.\n• This unit cannot be targeted with the Tactical Dreadnought Fortitude stratagem.":"• Les attaques qui ciblent cette unité ont -1 D.\n• Cette unité ne peut pas être ciblée par le stratagème Fortitude des Dreadnoughts tactiques.","• If your unit is unengaged, your unit can make a normal move of up to 5\", and must end that move within range of an objective.\n• Your unit is not eligible to declare a charge or embark within a Transport until the end of the turn.":"• Si votre unité n’est pas engagée, elle peut effectuer un mouvement normal d’au maximum 5\" et doit terminer ce mouvement à portée d’un objectif.\n• Votre unité ne peut pas déclarer de charge ni embarquer dans un Transport jusqu’à la fin du tour.","• If your unit is unengaged, your unit can make a normal move.\n• Or: If your unit is engaged, your unit can make a fall-back move.":"• Si votre unité n’est pas engagée, elle peut effectuer un mouvement normal.\n• Ou : si votre unité est engagée, elle peut effectuer un mouvement de repli.","• This unit has Stealth.\n• Melee attacks that target this unit have -1 to hit rolls.":"• Cette unité a la Discrétion.\n• Les attaques au corps à corps qui ciblent cette unité ont -1 aux jets pour toucher.","• Your unit can be set up more than 6\" horizontally from all enemy units (instead of more than 8\").\n• Your unit is not eligible to declare a charge until the end of this turn.":"• Votre unité peut être mise en place à plus de 6\" horizontalement de toutes les unités ennemies (au lieu de plus de 8\").\n• Votre unité ne peut pas déclarer de charge jusqu’à la fin de ce tour.","+10 pts (WARGEAR OPTIONS)":"+10 pts (OPTIONS D’ÉQUIPEMENT)","1 Apothecary Biologis model":"1 figurine d’Apothecary Biologis","1 Apothecary model":"1 figurine d’Apothecary","1 Asmodai model":"1 figurine d’Asmodai","1 Assault Intercessor Sergeant model":"1 figurine de Assault Intercessor Sergeant","1 Azrael model":"1 figurine d’Azrael","1 Bladeguard Ancient model":"1 figurine d’Bladeguard Ancient","1 Bladeguard Veteran Sergeant model":"1 figurine de Bladeguard Veteran Sergeant","1 Captain in Gravis Armour model":"1 figurine de Captain In Gravis Armour","1 Chaplain model":"1 figurine d’Chaplain","1 Eradicator Sergeant model":"1 figurine de Eradicator Sergeant","1 Judiciar model":"1 figurine de Judiciar","1 Knight Errant":"1 Knight Errant","1 Knight Master model":"1 figurine de Knight Master","1 Lion El'Jonson model":"1 figurine de Lion El'Jonson","1 model":"1 figurine","1 modèle par tranche de 3 dans l'unité":"1 figurine par tranche de 3 dans l’unité","1 Multi-melta":"1 Multi-melta","1 Redemptor Dreadnought model":"1 figurine de Redemptor Dreadnought","10 models":"10 figurines","170 x 109mm":"170 x 109 mm","2 Multi-meltas":"2 Multi-meltas","2-5 Bladeguard Veteran models":"2 à 5 figurines de Bladeguard Veterans","2-5 Eradicator models":"2 à 5 figurines d’Eradicators","3 models":"3 figurines","3-6 Inner Circle Companions models":"3 à 6 figurines de Inner Circle Companions","32mm":"32 mm","4 Deathwing Knights models":"4 figurines de Deathwing Knights","4-9 Assault Intercessor models":"4 à 9 figurines d’Assault Intercessors","40mm":"40 mm","5 models":"5 figurines","50mm":"50 mm","6 models":"6 figurines","60mm":"60 mm","90mm":"90 mm","A CORE OF TACTICALLY VERSATILE WARRIORS STRENGTHENS THE SPACE MARINE BATTLE LINE":"UN NOYAU DE GUERRIERS TACTIQUEMENT POLYVALENTS RENFORCE LA LIGNE DE BATAILLE DES SPACE MARINES","A WORTHY DEATH":"UNE MORT DIGNE","Absolvor Bolt Pistol":"Absolvor Bolt Pistol","ADAMANTINE TERROR":"TERREUR ADAMANTINE","ADAPTIVE STRATEGY":"STRATÉGIE ADAPTATIVE","Adept of the Codex":"Adept of the Codex","Adeptus Astartes":"Adeptus Astartes","Adeptus Astartes Infantry model only. If this unit disembarked this turn:\n• This unit can re-roll charge rolls.\n• Enemy units cannot target this unit with snap shooting attacks.":"Figurine d’infanterie Adeptus Astartes uniquement. Si cette unité a débarqué ce tour :\n• Cette unité peut relancer les jets de charge.\n• Les unités ennemies ne peuvent pas cibler cette unité avec des tirs instantanés.","Adeptus Astartes Infantry unit only. This unit’s melee attacks have [Sustained Hits 1: non-Monster/Vehicle].":"Unité d’infanterie Adeptus Astartes uniquement. Les attaques au corps à corps de cette unité ont [COUPS SOUTENUS 1 : non-MONSTRE/VÉHICULE].","Adeptus Astartes Infantry/Mounted model only. This model’s ranged attacks (excluding [Psychic] attacks) have +1 A, S, AP and D.":"Figurine d’infanterie/montée Adeptus Astartes uniquement. Les attaques à distance de cette figurine (à l’exclusion des attaques [PSYCHIQUE]) ont +1 A, S, AP et D.","ADEPTUS ASTARTES model only.\n• This unit’s ranged attacks have [Lethal Hits].\n• If the devastator doctrine is active for this unit, this unit can re-roll advance rolls.":"Figurine ADEPTUS ASTARTES uniquement.\n• Les attaques à distance de cette unité ont [TOUCHES FATALES].\n• Si la doctrine de dévastation est active pour cette unité, celle-ci peut relancer les jets d’avance.","ADEPTUS ASTARTES model only. Friendly ADEPTUS ASTARTES units within 6\" of this model can re-roll leadership rolls.":"Figurine ADEPTUS ASTARTES uniquement. Les unités ADEPTUS ASTARTES alliées à 6\" ou moins de cette figurine peuvent relancer les jets de commandement.","ADEPTUS ASTARTES model only. This model has the following weapon:":"Figurine ADEPTUS ASTARTES uniquement. Cette figurine possède l’arme suivante :","ADEPTUS ASTARTES model only. This model has:\n• 2+ Sv.\n• Feel No Pain 5+.":"Figurine ADEPTUS ASTARTES uniquement. Cette figurine a :\n• 2+ Sv.\n• Insensible à la douleur 5+ (FNP).","ADEPTUS ASTARTES model only. This model’s melee attacks have:\n• +1 S and AP. \n• Or: If the assault doctrine is active for this unit, +2 S and AP.":"Figurine ADEPTUS ASTARTES uniquement. Les attaques au corps à corps de cette figurine ont :\n• +1 S et AP. \n• Ou : si la doctrine d’assaut est active pour cette unité, +2 S et AP.","ADEPTUS ASTARTES model only. This model’s melee attacks:\n• Have +2 S.\n• Have +1 AP.":"Figurine ADEPTUS ASTARTES uniquement. Les attaques au corps à corps de cette figurine :\n• Ont +2 S.\n• Ont +1 AP.","ADEPTUS ASTARTES model only.(Once per battle round, per army) When you use the Fire Overwatch/Heroic Intervention stratagem, if you target a friendly Adeptus Astartes Battleline unit within 12\" of this model with that stratagem, that use is -1 CP.":"Figurine ADEPTUS ASTARTES uniquement. (Une fois par tour de bataille, par armée) Lorsque vous utilisez le stratagème « Sentinelle / Intervention héroïque », si vous ciblez une unité de ligne de bataille ADEPTUS ASTARTES alliée à 12\" ou moins de cette figurine avec ce stratagème, cette utilisation coûte 1 CP de moins.","Adeptus Astartes Mounted unit only. This unit can re-roll advance rolls.":"Unité montée Adeptus Astartes uniquement. Cette unité peut relancer les jets d’avance.","Adeptus Astartes speeder unit only. At the start of your Shooting phase, select one visible enemy unit within 12\" of this unit. That enemy unit is spotted:\n• While a unit is spotted, that unit has +3\" detection range.":"Unité de speeder Adeptus Astartes uniquement. Au début de votre phase de tir, sélectionnez une unité ennemie visible à 12\" ou moins de cette unité. Cette unité ennemie est repérée :\n• Tant qu’une unité est repérée, cette unité a une portée de détection de +3\".","Adeptus Astartes Terminator model only. In your first Movement phase, this unit can make an ingress move.":"Figurine Terminator Adeptus Astartes uniquement. Lors de votre première phase de mouvement, cette unité peut effectuer un mouvement d’entrée.","Adeptus Astartes Terminator model only. This unit’s melee attacks have [Lethal Hits].":"Figurine Terminator Adeptus Astartes uniquement. Les attaques au corps à corps de cette unité ont [TOUCHES FATALES].","Adeptus Astartes Vehicle unit only (excluding Dedicated Transport/Fly/Walker units). This unit:\n• Has 5+ InSv.\n• At the end of your Command phase, heals 1 wound.":"Unité de véhicule Adeptus Astartes uniquement (à l’exclusion des unités de Transport dédié/volantes/marcheuses). Cette unité :\n• A une InvSv 5+.\n• À la fin de votre phase de commandement, soigne 1 blessure.","Adeptus Astartes Vehicle unit only (excluding Dedicated Transport/Fly/Walker units). This unit’s ranged attacks have [Heavy].":"Unité de véhicule Adeptus Astartes uniquement (à l’exclusion des unités de Transport dédié/volantes/marcheuses). Les attaques à distance de cette unité ont [LOURD].","Adrax Agatone":"Adrax Agatone","Against melee attacks only":"Uniquement contre les attaques au corps à corps","Aggressive Assault":"Assaut agressif","AGGRESSIVE DISEMBARKATION":"DÉBARQUEMENT AGGRESSIF","Aggressor Squad":"Aggressor Squad","ais-melee":"ais-melee","ais-pistol":"ais-pistol","All Deathwing Knight models in this unit can each have their Mace of Absolution replaced with 1 Power Weapon.":"Toutes les figurines de Deathwing Knight de cette unité peuvent chacune remplacer leur Mace of Absolution par 1 Power Weapon.","Ancient":"Ancient","Ancient In Terminator Armour":"Ancient In Terminator Armour","Ancient model only. This model has:\n• +1 OC and Ld.\n• Feel No Pain 5+.\n• The following ability:\n\nAncient Exhortation (Once per battle, per army): When this unit is selected to fight, you can use this ability. If you do, this unit’s melee attacks have +1 A until the end of the phase.":"Figurine Ancient uniquement. Cette figurine a :\n• +1 OC et Ld.\n• Insensible à la douleur 5+ (FNP).\n• L’aptitude suivante :\n\nExhortation de l’Ancient (Une fois par bataille, par armée) : lorsque cette unité est sélectionnée pour combattre, vous pouvez utiliser cette aptitude. Si vous le faites, les attaques au corps à corps de cette unité ont +1 A jusqu’à la fin de la phase.","Ancient Weapons":"Ancient Weapons","ANNIHILATING FORCE":"FORCE ANÉANTISSANTE","Anti-Fly 2+":"Anti-vol 2+","anti-fly 2+, twin-linked":"anti-vol 2+, jumelé","ANTI-MONSTER/VEHICLE 4+":"ANTI-MONSTRE/VÉHICULE 4+","Any phase":"N’importe quelle phase","Any phase, when a friendly ADEPTUS ASTARTES unit embarked within a Transport is selected to move.":"N’importe quelle phase, lorsqu’une unité ADEPTUS ASTARTES alliée embarquée dans un Transport est sélectionnée pour se déplacer.","Any phase, when a friendly Adeptus Astartes Vehicle unit suffers a mortal wound.":"N’importe quelle phase, lorsqu’une unité de véhicule Adeptus Astartes alliée subit une blessure mortelle.","Any phase, when a friendly Deathwing/Ravenwing unit within range of an objective is destroyed.":"N’importe quelle phase, lorsqu’une unité Deathwing/Ravenwing alliée à portée d’un objectif est détruite.","Apothecary":"Apothecary","Apothecary Biologis":"Apothecary Biologis","Apothecary Biologis model only. in your Command phase, this unit heals D3+1 wounds.":"Figurine Apothecary Biologis uniquement. Dans votre phase de commandement, cette unité soigne D3+1 blessures.","App":"Appli","Arma Luminis - Bolt":"Arma Luminis - Bolt","Arma Luminis - Plasma":"Arma Luminis - Plasma","Arme de corps du sergent":"Arme de corps à corps du sergent","Arme du Knight Master":"Arme du Knight Master","Arme lourde":"Arme lourde","Armement de départ":"Armement de départ","Armement du capitaine":"Armement du capitaine","ARMOUR OF CONTEMPT":"ARMURE DE MÉPRIS","ARMOURED IMPACT":"IMPACT BLINDÉ","Artificer Armour":"Artificer Armour","Artificer Sarcophagus":"Artificer Sarcophagus","Asmodai":"Asmodai","Asmodai is the Dark Angels’ most successful Interrogator-Chaplain. Relentless and humourless, in battle he incites his battle-brothers’ fighting spirit to reach new heights, rendering them unstoppable killing machines by chanting his litanies of hate with unshakeable belief.":"Asmodai est l’Interrogateur-Chaplain le plus accompli des Dark Angels. Implacable et sans humour, il incite ses frères de bataille à porter leur esprit combatif à de nouveaux sommets, les rendant impitoyables machines à tuer en psalmodiant ses liturgies de haine avec une foi inébranlable.","Assault Brethren":"Assault Brethren","Assault Brethren Stratagem":"Stratagème Assault Brethren","Assault Intercessor":"Assault Intercessor","Assault Intercessor Sergeant":"Assault Intercessor Sergeant","Assault Intercessor Squad":"Assault Intercessor Squad","Assault Intercessors are amongst the most widespread close support units in a Chapter’s arsenal. Firing their heavy bolt pistols as they close upon the foe, they charge into the fray, where they make short work of their enemies with brutal swings of their chainswords.":"Les Assault Intercessors figurent parmi les unités de soutien rapproché les plus répandues dans l’arsenal d’un chapitre. Tout en tirant avec leurs pistolets bolters lourds alors qu’ils approchent de l’ennemi, ils se ruent dans la mêlée, où ils achèvent leurs adversaires à coups sauvages de leurs épées tronçonneuses.","Assault Mastery":"Maîtrise de l’assaut","At the end of your Movement phase, if a friendly Phobos unit is hidden, that unit’s attacks can re-roll wound rolls of 1 until the end of the turn.":"À la fin de votre phase de mouvement, si une unité Phobos alliée est cachée, les attaques de cette unité peuvent relancer les jets pour blesser de 1 jusqu’à la fin du tour.","At the end of your Movement phase, if this unit is controlling an objective, that objective is secured.":"À la fin de votre phase de mouvement, si cette unité contrôle un objectif, cet objectif est sécurisé.","At the start of any phase, you can select one friendly battle-shocked ADEPTUS ASTARTES unit within 6\" of this model. That unit is no longer battle-shocked.":"Au début de n’importe quelle phase, vous pouvez sélectionner une unité ADEPTUS ASTARTES amie ébranlée à 6\" ou moins de cette figurine. Cette unité n’est plus ébranlée.","At the start of the battle round, if a model with this ability is your WARLORD, gain 1CP.":"Au début du tour de bataille, si une figurine avec cette aptitude est votre SEIGNEUR DE GUERRE, gagnez 1CP.","At the start of the battle, you can set up one Teleport Homer token for this unit on the battlefield. If you do:\n• When you target this unit with the Rapid Ingress stratagem, you can use that Teleport Homer token. If you do, that use is -1 CP, but when resolving that stratagem, this unit must be set up within 3\" of that Teleport Homer token and not within 8\" of an enemy unit. That Teleport Homer token is then removed from the battlefield. \n• If an enemy unit ends a move within 1\" of that Teleport Homer token, that Teleport Homer token is removed from the battlefield.":"Au début de la bataille, vous pouvez placer un jeton de balise de téléportation pour cette unité sur le champ de bataille. Si vous le faites :\n• Lorsque vous ciblez cette unité avec le stratagème Rapid Ingress, vous pouvez utiliser ce jeton de balise de téléportation. Si vous le faites, son utilisation coûte -1 CP, mais lors de la résolution de ce stratagème, cette unité doit être placée à 3\" ou moins de ce jeton de balise de téléportation et à plus de 8\" de toute unité ennemie. Ce jeton de balise de téléportation est alors retiré du champ de bataille.\n• Si une unité ennemie termine un mouvement à 1\" ou moins de ce jeton de balise de téléportation, ce jeton est retiré du champ de bataille.","At the start of the Fight phase, each enemy CHARACTER unit within 6\" of this model makes a battle-shock roll, with -1 to that battle-shock roll.":"Au début de la phase de combat, chaque unité PERSONNAGE ennemie à 6\" ou moins de cette figurine effectue un jet d’ébranlement, avec -1 à ce jet.","At the start of your Command phase, you can select one combat doctrine listed below. If you do, that combat doctrine is active for friendly ADEPTUS ASTARTES units with this ability until the start of your next Command phase.\n\nASSAULT DOCTRINE\nWhen this unit is selected to make an advance move, that advance move does not prevent this unit from being eligible to declare a charge.\n\nDEVASTATOR DOCTRINE\nThis unit’s ranged attacks have [ASSAULT].\n\nTACTICAL DOCTRINE\nWhen this unit is selected to make a fall-back move, that fall-back move does not prevent this unit from being eligible to shoot and eligible to declare a charge.\nUnless otherwise stated:\n• You can only select each combat doctrine once per battle.\n• Only one combat doctrine can be active for each unit. If a rule makes a combat doctrine active for a unit, any combat doctrine previously active for that unit is no longer active for that unit.":"Au début de votre phase de commandement, vous pouvez choisir une doctrine de combat parmi celles ci-dessous. Si vous le faites, cette doctrine de combat est active pour les unités ADEPTUS ASTARTES amies ayant cette aptitude jusqu’au début de votre prochaine phase de commandement.\n\nDOCTRINE D’ASSAUT\nLorsque cette unité est choisie pour effectuer un mouvement d’avance, ce mouvement d’avance n’empêche pas cette unité de pouvoir déclarer une charge.\n\nDOCTRINE DEVASTATRICE\nLes attaques à distance de cette unité ont [ASSAUT].\n\nDOCTRINE TACTIQUE\nLorsque cette unité est choisie pour effectuer un repli, ce repli n’empêche pas cette unité de pouvoir tirer ni de pouvoir déclarer une charge.\nSauf indication contraire :\n• Vous ne pouvez choisir chaque doctrine de combat qu’une fois par bataille.\n• Une seule doctrine de combat peut être active pour chaque unité. Si une règle rend une doctrine de combat active pour une unité, toute doctrine de combat précédemment active pour cette unité cesse de l’être.","At the start of your Command phase, you can select up to two of the abilities in the Primarch of the First Legion section. Until the start of your next Command phase, this model has those abilities.":"Au début de votre phase de commandement, vous pouvez choisir jusqu’à deux des aptitudes de la section Primarque de la Première Légion. Jusqu’au début de votre prochaine phase de commandement, cette figurine possède ces aptitudes.","Attacks allocated to this model have -1 D.":"Les attaques assignées à cette figurine ont -1 D.","Attacks that target friendly Adeptus Astartes Infantry/Mounted units with a S greater than that unit’s T have -1 to wound rolls.\n\nRestrictions: Your army can include Dark Angels units, but it cannot include any ADEPTUS ASTARTES units drawn from any other Chapter.":"Les attaques qui ciblent des unités d’infanterie/montées ADEPTUS ASTARTES alliées avec une S supérieure à la T de cette unité ont -1 aux jets pour blesser.\n\nRestrictions : votre armée peut inclure des unités des Dark Angels, mais elle ne peut inclure aucune unité ADEPTUS ASTARTES issue d’un autre chapitre.","Attacks that target this unit with a S greater than this unit’s T have -1 to wound rolls.":"Les attaques qui ciblent cette unité et dont la F est supérieure à la T de cette unité ont -1 aux jets pour blesser.","Attacks that target your unit have -1":"Les attaques qui ciblent votre unité ont -1","Aucun arrondi : les coûts sont additionnés tels quels (entiers publiés par la source).":"Aucun arrondi : les coûts sont additionnés tels quels (entiers publiés par la source).","Aucune":"Aucune","Auspex Triangulation Shrines":"Auspex Triangulation Shrines","Azrael":"Azrael","Battleline":"Ligne de bataille","Before the battle, in the Muster Armies step, for each leader and support unit in your army, you can select one friendly bodyguard unit that unit can lead.":"Avant la bataille, lors de l’étape de rassemblement des armées, pour chaque Leader et chaque unité de Soutien de votre armée, vous pouvez sélectionner une unité Bodyguard alliée que cette unité peut mener.","Belial":"Belial","bgv-pistol":"bgv-pistol","Black Templars":"Black Templars","Black-winged Vigilance":"Vigilance aux ailes noires","BLACK‑ARMOURED COMBAT CRAFT HUNT THEIR PREY UPON WINGS OF DARK FURY":"LES ENGINS DE COMBAT EN ARMURE NOIRE CHASSENT LEUR PROIE SUR LES AILES DE LA FUREUR TÉNÉBREUSE","Bladeguard (Once per turn, per unit)":"Garde-lame (une fois par tour, par unité)","Bladeguard Ancient":"Bladeguard Ancient","Bladeguard Ancients bear the honour of carrying their Chapter’s precious standards into battle. The most revered of these incorporate the remains of fallen heroes of the Chapter; in their presence, battle-brothers are inspired to emulate the legendary deeds of these paragons of old.":"Les Ancients Garde-lame ont l’honneur de porter les précieuses bannières de leur chapitre au combat. Les plus vénérés d’entre eux intègrent les restes de héros tombés du chapitre ; en leur présence, les frères de bataille sont inspirés pour imiter les exploits légendaires de ces parangons d’antan.","Bladeguard Veteran":"Bladeguard Veteran","Bladeguard Veteran Sergeant":"Bladeguard Veteran Sergeant","Bladeguard Veteran Squad":"Bladeguard Veteran Squad","Bladeguard Veterans are inexorable warriors, advancing relentlessly with blades held high – the very image of noble knights of myth. Members of their Chapter’s elite 1st Company of Veterans, each of these vastly experienced Space Marines has fought to preserve the Imperium across uncounted worlds.":"Les Bladeguard Veterans sont des guerriers inexorables, avançant sans relâche, lames levées — l’image même des nobles chevaliers des mythes. Membres de la 1re compagnie d’élite de vétérans de leur chapitre, chacun de ces Space Marines chevronnés a combattu pour préserver l’Imperium sur d’innombrables mondes.","BLAST 1":"BLAST 1","BLAST 1, Hazardous":"BLAST 1, dangereux","BLAST 2":"BLAST 2","BLAST 2, Torrent":"BLAST 2, torrent","blast, indirect fire":"blast, tir indirect","blast, melta 6":"blast, fusion 6","Blood Angels":"Blood Angels","Blood Angels Captain":"Blood Angels Captain","Bolt Pistol":"Bolt Pistol","Boltstorm Gauntlet":"Boltstorm Gauntlet","Boltstorm Gauntlet + Relic Blade":"Boltstorm Gauntlet + Relic Blade","Boltstorm Gauntlet + Relic Chainsword":"Boltstorm Gauntlet + Relic Chainsword","Boltstorm Gauntlet + Relic Power Fist":"Boltstorm Gauntlet + Relic Power Fist","Braziers of Judgement":"Brasiers du Jugement","Calibanite Greatsword - Strike":"Calibanite Greatsword - Strike","Calibanite Greatsword - Sweep":"Calibanite Greatsword - Sweep","Captain":"Captain","Captain in Gravis Armour":"Captain in Gravis Armour","Captain In Gravis Armour":"Captain In Gravis Armour","Captain In Terminator Armour":"Captain In Terminator Armour","Captain model only. In your Movement phase, if this unit is embarked within a Transport unit, you can select one friendly Adeptus Astartes Infantry unit within 6\" of that TRANSPORT unit and select one combat doctrine. That combat doctrine is active for that INFANTRY unit.":"Figurine Captain uniquement. Dans votre phase de mouvement, si cette unité est embarquée dans une unité de Transport, vous pouvez sélectionner une unité d’infanterie Adeptus Astartes alliée à 6\" ou moins de cette unité TRANSPORT et choisir une doctrine de combat. Cette doctrine de combat est active pour cette unité INFANTERIE.","Captain model only. The tactical doctrine is active for this unit in addition to any other combat doctrine.":"Figurine Captain uniquement. La doctrine tactique est active pour cette unité en plus de toute autre doctrine de combat.","Captain Titus":"Captain Titus","Castellan":"Castellan","Ceramite Fists":"Ceramite Fists","Chainsword":"Chainsword","Champion of the Deathwing":"Champion of the Deathwing","Champion of the First Company":"Champion of the First Company","Chaplain":"Chaplain","Chaplain Grimaldus":"Chaplain Grimaldus","Chaplain In Terminator Armour":"Chaplain In Terminator Armour","Chapter Master":"Maître de chapitre","Character":"Personnage","Charge phase":"Phase de charge","CHARGING INTO BATTLE, TACTICUS-ARMOURED BATTLE-BROTHERS CUT A BLOODY PATH THROUGH THE FOE":"CHARGEANT AU COMBAT, LES FRÈRES DE BATAILLE EN ARMURE TACTICUS TRACENT UN CHEMIN SANGLANT À TRAVERS L’ENNEMI","Chief Librarian Tigurius":"Chief Librarian Tigurius","Clad in a suit of indomitable Gravis armour, a Space Marine Captain can fearlessly stride into the very fiercest battlefield firestorms. To don Gravis armour is to demonstrate the greatest determination to crush the enemy, no matter how deeply they are entrenched.":"Revêtu d’une armure Gravis indomptable, un Captain Space Marine peut avancer sans crainte au cœur des plus violents feux de bataille. Revêtir l’armure Gravis, c’est témoigner de la plus grande détermination à écraser l’ennemi, aussi profondément retranché soit-il.","Clad in Gravis armour, the Apothecary Biologis can advance through storms of enemy fire, vivispectrum at the ready to take bio-material samples for later analysis, whether that be xenos flesh, viral weapons casings or esoteric gene-tech.":"Revêtu d’une armure Gravis, l’Apothecary Biologis peut progresser sous les tempêtes de feu ennemi, vivispectrum prêt à prélever des échantillons de biomatière pour analyse ultérieure, qu’il s’agisse de chair xéno, d’enveloppes d’armes virales ou de technologie génétique ésotérique.","CLEAVE 1":"FEND 1","Cloak billowing in the heat of battle and absolvor pistol flaring, Chaplains stride purposefully into battle, the boom of their oration audible even over the furious din of conflict. Without rest they exhort their brothers to victory, steeling their hearts, minds and souls no matter the savagery of the enemy.":"Le manteau gonflé par la chaleur du combat et le pistolet Absolvor crachant le feu, les Chaplains avancent résolument au combat, le fracas de leurs oraisons audible même au milieu du tumulte furieux de la mêlée. Sans répit, ils exhortent leurs frères à la victoire, affermissant leurs cœurs, leurs esprits et leurs âmes, quelle que soit la sauvagerie de l’ennemi.","CLOSE-QUARTERS":"CORPS À CORPS","CLOSE-QUARTERS, Devastating Wounds":"CORPS À CORPS, blessures dévastatrices","CLOSE-QUARTERS, Hazardous":"CORPS À CORPS, dangereux","CLOSE-QUARTERS, Torrent":"CORPS À CORPS, torrent","Code Chivalric":"Code chevaleresque","Codex Discipline":"Discipline du Codex","Codex Fire-patterns":"Modèles de tir du Codex","Combat Doctrines":"Doctrines de combat","Combined Deployment":"Déploiement combiné","Command phase":"Phase de commandement","Command phase.":"Phase de commandement.","Company Heroes":"Company Heroes","Core":"Base","Corporeum Reliquary":"Corporeum Reliquary","Crozius Arcanum":"Crozius Arcanum","Crozius Arcanum and Power Weapon - Strike":"Crozius Arcanum and Power Weapon - Strike","Crozius Arcanum and Power Weapon - Sweep":"Crozius Arcanum and Power Weapon - Sweep","Crusader Squad":"Crusader Squad","Cyber-familiar":"Cyber-familiar","DA":"DA","Damaged":"Endommagé","DAMAGED24.39\n\nThis ability always takes the form Damaged X. While a model’s remaining wounds are equal to or less than X, that model is damaged: while damaged, that model’s attacks have -1 to hit rolls.":"ENDOMMAGÉ24.39\n\nCette aptitude prend toujours la forme Endommagé X. Tant que les blessures restantes d’une figurine sont égales ou inférieures à X, cette figurine est endommagée ; lorsqu’elle est endommagée, ses attaques ont -1 aux jets pour toucher.","Damocles-class Uplink":"Damocles-class Uplink","Dark Angels":"Dark Angels","Dark Angels Bodyguard":"Bodyguard des Dark Angels","Darkflight Pursuit":"Darkflight Pursuit","Darkflight Pursuit Stratagem":"Stratagème Darkflight Pursuit","Datasheet":"Fiche","Deadly Demise":"Mort funeste","DEADLY DEMISE24.08\n\nFrom detonating ammo stores to corrosive innards or frenzied death throes, some targets are deadly even in defeat.\nThis ability always takes the form Deadly Demise X. Each time a model with this ability is destroyed, after the units embarked within it (if any) have made their emergency disembark moves, roll one D6. On a 6, that model suffers a deadly demise; each unit within 6\" of that model suffers a number of mortal wounds denoted by X (if this is a random number, roll separately for each unit within 6\").":"MORT FUNESTE24.08\n\nDes dépôts de munitions qui explosent aux entrailles corrosives ou aux spasmes frénétiques de l’agonie, certaines cibles restent mortelles même dans la défaite.\nCette aptitude prend toujours la forme Mort funeste X. Chaque fois qu’une figurine ayant cette aptitude est détruite, après que les unités embarquées à son bord (le cas échéant) ont effectué leur mouvement de débarquement d’urgence, lancez un D6. Sur un 6, cette figurine subit une mort funeste ; chaque unité à 6\" ou moins de cette figurine subit un nombre de blessures mortelles indiqué par X (si ce nombre est aléatoire, lancez séparément pour chaque unité à 6\" ou moins).","Death Blow":"Coup mortel","Death Company Marines":"Death Company Marines","Deathwatch":"Deathwatch","Deathwatch Veterans":"Deathwatch Veterans","Deathwing":"Deathwing","Deathwing Assault":"Deathwing Assault","Deathwing Knights":"Deathwing Knights","Deathwing Knights are the Chapter’s ultimate death-dealers, their strikes breaking the enemy’s back in one fell swoop. Equipped with heirloom wargear, they teleport into the heart of the thickest fighting, led by Knight Masters who are whirlwinds of deathly destruction.":"Les Deathwing Knights sont les faiseurs de mort ultimes du chapitre, dont les frappes brisent l’ennemi d’un seul coup. Équipés d’une armure de héritage, ils se téléportent au cœur des combats les plus acharnés, menés par des Knight Masters qui sont des tourbillons de destruction mortelle.","Deathwing model only. This unit’s attacks that target an enemy unit within range of your vowed objective have [SUSTAINED HITS 1].":"Figurine Deathwing uniquement. Les attaques de cette unité qui ciblent une unité ennemie à portée de votre objectif voué ont [COUPS SOUTENUS 1].","Deathwing model only. When this unit is selected to make a consolidation move, this unit can move up to D3+3\".":"Figurine Deathwing uniquement. Lorsque cette unité est sélectionnée pour effectuer un mouvement de régroupement, elle peut se déplacer jusqu’à D3+3\".","Deathwing model with the Deep Strike ability only. In your first Movement phase, this unit can make an ingress move.":"Figurine Deathwing avec l’aptitude Frappe en profondeur uniquement. Lors de votre première phase de mouvement, cette unité peut effectuer un mouvement d’entrée.","Decimus Kill Team":"Decimus Kill Team","Deeds of Legend":"Exploits légendaires","Deep Strike":"Frappe en profondeur","DEEP STRIKE24.09\n\nThere are many ways by which to deploy troops to the field of battle including tunnels, teleportation devices and other esoteric means of transportation.\nEach time this unit makes an ingress move (20.04), if every model in this unit has this ability, it can be set up anywhere on the battlefield that is more than 8\" horizontally from all enemy units, even if that is within your opponent’s deployment zone.":"FRAPPE EN PROFONDEUR24.09\n\nIl existe de nombreuses façons de déployer des troupes sur le champ de bataille, notamment les tunnels, les dispositifs de téléportation et autres moyens de transport ésotériques.\nChaque fois que cette unité effectue un mouvement d’arrivée (20.04), si toutes les figurines de cette unité ont cette aptitude, elle peut être placée n’importe où sur le champ de bataille à plus de 8\" horizontalement de toutes les unités ennemies, même dans la zone de déploiement de votre adversaire.","default":"default","Deployed as a mutually supportive strike force that epitomises the flexibility and martial wisdom of the Codex Astartes, Space Marines have the answer to any strategic or tactical challenge.":"Déployés comme une force de frappe mutuellement solidaire qui incarne la souplesse et la sagesse martiale du Codex Astartes, les Space Marines ont une réponse à tout défi stratégique ou tactique.","Desolation Squad":"Desolation Squad","Devastating Wounds":"Blessures dévastatrices","Devastating Wounds, Sustained Hits 1":"Blessures dévastatrices, COUPS SOUTENUS 1","DEVASTATING WOUNDS: non-MONSTER/VEHICLE":"BLESSURES DÉVASTATRICES : non-MONSTRE/VÉHICULE","DEVASTATING WOUNDS: non-MONSTER/VEHICLE, SUSTAINED HITS 2: non-MONSTER/VEHICLE":"BLESSURES DÉVASTATRICES : non-MONSTRE/VÉHICULE, COUPS SOUTENUS 2 : non-MONSTRE/VÉHICULE","Devastator Brethren":"Devastator Brethren","Devastator Brethren Stratagem":"Stratagème Devastator Brethren","Devastator Mastery":"Maîtrise de la dévastation","Disruption":"Perturbation","DOMINATION FIRE":"FEU DE DOMINATION","Dreadnought":"Dreadnought","Dreadnought unit only. Attacks that target this unit have -1 D.":"Unité Dreadnought uniquement. Les attaques qui ciblent cette unité ont -1 D.","Dreadnought unit only. While a friendly Adeptus Astartes Infantry/Mounted unit is within 6\" of this unit, that unit’s attacks can re-roll hit rolls of 1.":"Unité Dreadnought uniquement. Tant qu’une unité d’infanterie/montée Adeptus Astartes alliée est à 6\" ou moins de cette unité, les attaques de cette unité peuvent relancer les jets pour toucher de 1.","Dutiful Tenacity":"Ténacité loyale","Duty Eternal":"Devoir éternel","DUTY IN DEATH":"LE DEVOIR DANS LA MORT","DUTY IS NEVER DONE":"LE DEVOIR N’EST JAMAIS ACHEVÉ","DUTY UNTO DEATH":"DEVOIR JUSQU’À LA MORT","dwk-power-weapon":"dwk-power-weapon","dwk-relic-weapon":"dwk-relic-weapon","dwk-watcher":"dwk-watcher","Each enemy CHARACTER unit within 6\" makes a battle-shock roll with -1.":"Chaque unité PERSONNAGE ennemie à 6\" ou moins effectue un jet d’ébranlement avec -1.","Each enemy unit engaged with your unit makes a battle-shock roll, with -1 to that":"Chaque unité ennemie à portée d’engagement de votre unité effectue un jet d’ébranlement, avec -1 à ce","Each time a model with this ability makes a Normal, Advance or Fall Back move, it can move through models (excluding TITANIC models) and sections of terrain features that are 4\" or less in height. When doing so:\n• It can move within Engagement Range of enemy models, but cannot end that move within Engagement Range of them.\n• It can also move through sections of terrain features that are more than 4\" in height, but if it does, after it has moved, roll one D6: on a 1, that model is Battle-shocked.":"Chaque fois qu’une figurine avec cette aptitude effectue un mouvement normal, d’avance ou de repli, elle peut traverser des figurines (à l’exception des figurines TITANIQUES) et des sections de décors de 4\" de haut ou moins. Ce faisant :\n• Elle peut se déplacer à portée d’engagement de figurines ennemies, mais ne peut pas terminer ce mouvement à portée d’engagement d’elles.\n• Elle peut également traverser des sections de décors de plus de 4\" de haut, mais si elle le fait, après son déplacement, lancez un D6 : sur un 1, cette figurine est ébranlée.","Each time this model makes a ranged attack that targets the closest eligible target, add 1 to the Hit roll.":"Chaque fois que cette figurine effectue une attaque à distance ciblant la cible éligible la plus proche, ajoutez 1 au jet pour toucher.","Either player’s turn":"Tour de l’un ou l’autre joueur","Emnity for the Unworthy":"Inimitié pour les indignes","Emperor’s Champion":"Emperor’s Champion","End of the Fight phase.":"Fin de la phase de combat.","End of your Movement phase":"Fin de votre phase de mouvement","End of your Movement phase.":"Fin de votre phase de mouvement.","End of your opponent’s Fight phase.":"Fin de la phase de combat de votre adversaire.","Enduring Vengeance":"Vengeance tenace","Epic Hero":"Héros épique","Eradicator":"Eradicator","Eradicator Sergeant":"Eradicator Sergeant","Eradicator Squad with Heavy Bolters":"Eradicator Squad with Heavy Bolters","Eradicator Squad with Melta Rifles":"Eradicator Squad with Melta Rifles","eradicator-multi-melta":"eradicator-multi-melta","Errant’s Duty (Bondsman)":"Devoir de l’Errant (Écuyer)","Even amongst the Adeptus Astartes, the battle‑brothers of the Dark Angels are renowned for their tenacity and resilience on the battlefield. When ordered to war, they are utterly relentless in pursuing their objectives, wading into fields of withering fire and shrugging off blows that would slay mortal warriors outright.":"Même parmi les Adeptus Astartes, les frères de bataille des Dark Angels sont réputés pour leur ténacité et leur résilience sur le champ de bataille. Lorsqu’ils sont envoyés en guerre, ils poursuivent leurs objectifs avec une obstination sans faille, s’avançant dans des déluges de feu nourri et encaissant des coups qui abattaient net des guerriers mortels.","Execute and Redeploy":"Execute and Redeploy","Executioner Relic Blade":"Executioner Relic Blade","Exemplar of Hate":"Exemple de haine","EXPLODING FROM THE SHADOWS, PHOBOS-ARMOURED KILLERS CATCH THE FOE IN A BLOODY AMBUSH":"JAILLISSANT DES OMBRES, LES TUEURS EN ARMURE PHOBOS PRENNENT L’ENNEMI DANS UNE EMBUSCADE SANGLANTE","Explosives":"Explosifs","Extra Attacks":"Attaques supplémentaires","Ezekiel":"Ezekiel","Faced with multiple threats that must be efficiently eliminated, the Space Marines employ time-honoured ballistic doctrines to great effect.":"Face à de multiples menaces qu’il faut éliminer efficacement, les Space Marines emploient avec une grande efficacité des doctrines balistiques éprouvées par le temps.","Faction":"Faction","Fealty - Strike":"Fealty - Strike","Fealty - Sweep":"Fealty - Sweep","Feared Interrogator":"Interrogateur redouté","Few experiences are so terrifying for Mankind’s enemies as finding themselves the victims of Phobos-armoured ambushers.":"Peu d’expériences sont aussi terrifiantes pour les ennemis de l’Humanité que de se retrouver victimes d’embusqués en armure Phobos.","Fight phase":"Phase de combat","Fight phase, when a friendly ADEPTUS ASTARTES unit is selected to fight.":"Phase de combat, lorsqu’une unité ADEPTUS ASTARTES alliée est sélectionnée pour combattre.","Fight phase, when a friendly Tacticus unit is selected to make a consolidation move.":"Phase de combat, lorsqu’une unité Tacticus alliée est sélectionnée pour effectuer un mouvement de régroupement.","Fight phase, when an enemy unit has fought.":"Phase de combat, lorsqu’une unité ennemie a combattu.","Fight phase, when an enemy unit targets a friendly ADEPTUS ASTARTES unit.":"Phase de combat, lorsqu’une unité ennemie cible une unité ADEPTUS ASTARTES alliée.","Fight phase, when an enemy unit targets a friendly Deathwing unit.":"Phase de combat, lorsqu’une unité ennemie cible une unité Deathwing alliée.","Fights First":"Combat en premier (Fights First)","FIGHTS FIRST24.13\n\nThose possessed of lightning-fast reactions may strike before the opponent can react.\nWhile every model in a unit has this ability, that unit is a Fights First unit.\n\nSee the Resolve Fights First Combats step in the Fight phase (12.04).":"COMBAT EN PREMIER24.13\n\nCeux qui ont des réactions d’une rapidité fulgurante peuvent frapper avant que l’adversaire ne puisse réagir.\nTant que toutes les figurines d’une unité ont cette aptitude, cette unité est une unité de Combat en premier.\n\nVoir l’étape Résolution des combats en premier de la phase de combat (12.04).","flat":"flat","For every 3 models in this unit, 1 Eradicator model can have their Melta Rifle replaced with 1 Multi-melta.":"Pour chaque groupe de 3 figurines dans cette unité, 1 figurine d’Eradicator peut remplacer son Melta Rifle par 1 Multi-melta.","FOR THE EMPEROR!":"POUR L’EMPEROR !","Fortification (левая колонка)":"Fortification (colonne de gauche)","Fortis Kill Team":"Fortis Kill Team","Fragstorm Grenade Launchers":"Fragstorm Grenade Launchers","Fragstorm Grenade Launchers → Storm Bolters":"Fragstorm Grenade Launchers → Storm Bolters","Friendly Adeptus Astartes Dreadnought units can re-roll hit rolls of 1.":"Les unités Dreadnought Adeptus Astartes alliées peuvent relancer les jets pour toucher de 1.","Friendly Adeptus Astartes Mounted/Speeder units have +2\" M.":"Les unités montées/speeder Adeptus Astartes alliées ont +2\" de M.","Friendly Adeptus Astartes Terminator units have +1 to charge rolls.":"Les unités Terminator Adeptus Astartes alliées ont +1 aux jets de charge.","Friendly Adeptus Astartes Vehicle units’ (excluding walker units) ranged attacks can:\n• Re-roll one hit roll.\n• Re-roll one wound roll.":"Les attaques à distance des unités de véhicule Adeptus Astartes alliées (à l’exclusion des unités marcheuses) peuvent :\n• Relancer un jet pour toucher.\n• Relancer un jet pour blesser.","Friendly Ravenwing Fly units’ ranged attacks have [IGNORES COVER].\n\nFriendly Outrider squad units have BATTLELINE.\n\nRestrictions: Your army can include Dark Angels units, but it cannot include any ADEPTUS ASTARTES units drawn from any other Chapter.":"Les attaques à distance des unités volantes Ravenwing alliées ont [IGNORE LE COUVERT].\n\nLes escouades Outrider alliées ont LIGNE DE BATAILLE.\n\nRestrictions : votre armée peut i ,"icarus":"icarus","Icarus Rocket Pod":"Icarus Rocket Pod","If this model is in your army, it must be your WARLORD.":"Si cette figurine est dans votre armée, elle doit être votre SEIGNEUR DE GUERRE.","If this unit made a charge move this turn, this unit’s melee attacks have +1 S and AP.":"Si cette unité a effectué un mouvement de charge ce tour-ci, ses attaques au corps à corps ont +1 F et +1 AP.","If your Army Faction is IMPERIAL KNIGHTS, at the end of the Read Mission Objectives step, you must determine your army’s Oath for the coming battle. An Oath consists of two parts - one Deed and one Quality. There are three options for each part, shown below.\n\nTo determine your army’s Deed, you can either select one Deed or you can randomly select one Deed by rolling a D6 and consulting the relevant table below. The selected Deed will describe what needs to be achieved in order to complete that Deed.\n\nTo determine your army’s Quality, you can either select one Quality or you can randomly select one Quality by rolling a D6 and consulting the relevant table below. Until the end of the battle, the ability described in the Quality selected applies to all models in your army with this ability.\n\nThe first time your selected Deed is completed your Oath is fulfilled and, until the end of the battle, your army becomes Honoured and you gain 2CP, or 3CP if you randomly selected your Deed and/or Quality (CP gained in this way are an exemption to the Core Rules that limit the maximum number of CP you can gain per battle round to 1).\n\nDeed\nD6We vow to lay low the tyrant...\nAt the start of the battle, select one CHARACTER model in your opponent’s army. This Deed is completed at the end of a turn if that CHARACTER is destroyed. We swear to reclaim the realm...\nThis deed is completed at the end of your opponent’s turn if you control more objective markers than your opponent. We pledge to reap a great tally...\nThis deed is completed at the end of the battle round if the number of enemy units destroyed this battle round is greater than the battle round number even if those units are subsequently returned to the battlefield (for example, two destroyed enemy units in the first battle round). \nQuality\nD6...with our martial valour risen over all.\nEach time this model is selected to shoot or fight, you can re-roll one Hit roll and you can re-roll one Wound roll. ...and we are eager for the challenge.\nAdd 2\" to this model’s Move characteristic and add 1 to Advance and Charge rolls made for this model. ...yet shall our legacy be unsullied.\nImprove this model’s Objective Control characteristic by 2 and its Leadership characteristic by 1.":"Si votre faction d’armée est IMPERIAL KNIGHTS, à la fin de l’étape Lecture des objectifs de mission, vous devez déterminer le Serment de votre armée pour la bataille à venir. Un Serment se compose de deux parties : un Exploit et une Qualité. Il y a trois options pour chaque partie, présentées ci-dessous.\n\nPour déterminer l’Exploit de votre armée, vous pouvez soit choisir un Exploit, soit en choisir un au hasard en lançant un D6 et en consultant le tableau correspondant ci-dessous. L’Exploit choisi décrit ce qui doit être accompli pour le réaliser.\n\nPour déterminer la Qualité de votre armée, vous pouvez soit choisir une Qualité, soit en choisir une au hasard en lançant un D6 et en consultant le tableau correspondant ci-dessous. Jusqu’à la fin de la bataille, l’aptitude décrite dans la Qualité choisie s’applique à toutes les figurines de votre armée ayant cette aptitude.\n\nLa première fois que votre Exploit choisi est accompli, votre Serment est honoré et, jusqu’à la fin de la bataille, votre armée devient Honorée et vous gagnez 2CP, ou 3CP si vous avez choisi votre Exploit et/ou votre Qualité au hasard (les CP gagnés de cette manière dérogent aux règles de base qui limitent à 1 le nombre maximal de CP que vous pouvez gagner par tour de bataille).\n\nExploit\nD6Nous jurons de renverser le tyran...\nAu début de la bataille, sélectionnez une figurine PERSONNAGE dans l’armée de votre adversaire. Cet Exploit est réalisé à la fin d’un tour si cette figurine PERSONNAGE est détruite. Nous jurons de reconquérir le royaume...\nCet Exploit est réalisé à la fin du tour de votre adversaire si vous contrôlez plus de marqueurs d’objectif que lui. Nous jurons de faire un grand butin...\nCet Exploit est réalisé à la fin du tour de bataille si le nombre d’unités ennemies détruites ce tour de bataille est supérieur au numéro du tour de bataille, même si ces unités sont ensuite revenues sur le champ de bataille (par exemple, deux unités ennemies détruites lors du premier tour de bataille). \nQualité\nD6...avec notre valeur martiale surpassant toutes les autres.\nChaque fois que cette figurine est choisie pour tirer ou combattre, vous pouvez relancer un jet pour toucher et un jet pour blesser. ...et nous sommes avides de défis.\nAjoutez 2\" à la caractéristique M de cette figurine et ajoutez 1 aux jets d’avance et de charge effectués pour cette figurine. ...mais notre héritage restera sans tache.\nAméliorez de 2 la caractéristique OC de cette figurine et de 1 sa caractéristique Ld.","If your unit is controlling an objective, that":"Si votre unité contrôle un objectif, celui-ci","Immovable Conquerors":"Immovable Conquerors","Imperial Knights":"Imperial Knights","Imperial Knights : faction distincte, aucune règle Leader dans sa fiche 11e.":"Imperial Knights : faction distincte, aucune règle Leader dans sa fiche 11e.","Imperium":"Imperium","Imperium's Sword":"Imperium's Sword","In a turn a friendly Gravis unit made a normal move, that unit’s ranged attacks:\n• Do not have [Heavy].\n• Have +1 to hit rolls.":"Lors d’un tour où une unité Gravis alliée a effectué un mouvement normal, les attaques à distance de cette unité :\n• N’ont pas [LOURD].\n• Ont +1 aux jets pour toucher.","In addition to battlefield surgery, it is the Apothecary’s duty to recover the gene-seed of the fallen, and thus preserve the Chapter for later generations. For this task the Apothecary is equipped to bring peace to those too wounded to save, and efficiently extract their.precious progenoid glands.":"En plus de la chirurgie de bataille, l’Apothecary a le devoir de récupérer le gène-semence des tombés, et ainsi de préserver le chapitre pour les générations à venir. Pour cette tâche, l’Apothecary est équipé pour apporter la paix à ceux qui sont trop gravement blessés pour être sauvés, et pour extraire efficacement leurs précieuses glandes progénoïdes.","In any phase, when this unit suffers a mortal wound, this unit can summon a Watcher in the Dark. If it does, this unit has Feel No Pain 4+ against mortal wounds.":"Dans n’importe quelle phase, lorsque cette unité subit une blessure mortelle, elle peut invoquer un Watcher in the Dark. Si elle le fait, cette unité a Insensible à la douleur 4+ (FNP) contre les blessures mortelles.","In any phase, when this unit suffers a mortal wound, this unit has Feel No Pain 4+ against mortal wounds.":"Dans n’importe quelle phase, lorsque cette unité subit une blessure mortelle, elle possède l’aptitude Insensible à la douleur 4+ (FNP) contre les blessures mortelles.","IN SACRIFICE, VICTORY":"DANS LE SACRIFICE, LA VICTOIRE","In the Fight phase, when this unit is selected to fight or when an enemy unit targets this unit, you can select one of the following:\n• This unit’s melee attacks have +1 to hit rolls.\n• Or: Attacks that target this unit have -1 to hit rolls.":"Dans la phase de combat, lorsque cette unité est choisie pour combattre ou lorsqu’une unité ennemie cible cette unité, vous pouvez choisir l’une des options suivantes :\n• Les attaques au corps à corps de cette unité ont +1 aux jets pour toucher.\n• Ou : les attaques qui ciblent cette unité ont -1 aux jets pour toucher.","In your Command phase, if this unit is unengaged, you can use this ability. If you do:\n• Place this unit in strategic reserves.\n• This unit can make an ingress move in your next Movement phase (including in your first turn).":"Dans votre phase de commandement, si cette unité n’est pas engagée, vous pouvez utiliser cette aptitude. Si vous le faites :\n• Placez cette unité en réserve stratégique.\n• Cette unité peut effectuer un mouvement d’arrivée lors de votre prochaine phase de mouvement (y compris lors de votre premier tour).","In your Command phase, this unit heals D3+1 wounds.":"Dans votre phase de commandement, cette unité guérit D3+1 blessures.","In your Command phase, you can use this ability. If you do, select one combat doctrine to be active for this unit until the start of your next Command phase, in addition to any other combat doctrine.":"Dans votre phase de commandement, vous pouvez utiliser cette aptitude. Si vous le faites, choisissez une doctrine de combat qui reste active pour cette unité jusqu’au début de votre prochaine phase de commandement, en plus de toute autre doctrine de combat.","In your Command phase, you can use this ability. If you do, select one combat doctrine to be active for this unit until the start of your next Command phase.":"Dans votre phase de commandement, vous pouvez utiliser cette aptitude. Si vous le faites, choisissez une doctrine de combat qui reste active pour cette unité jusqu’au début de votre prochaine phase de commandement.","In your Command phase, you can use this ability. If you do, select one objective. That objective is your vowed objective until your next Command phase.\n• Friendly Deathwing Infantry unit’s attacks that target an enemy unit within range of your vowed objective have +1 to wound rolls.\n\nRestrictions: Your army can include Dark Angels units, but it cannot include any ADEPTUS ASTARTES units drawn from any other Chapter.":"Dans votre phase de commandement, vous pouvez utiliser cette aptitude. Si vous le faites, sélectionnez un objectif. Cet objectif est votre objectif voué jusqu’à votre prochaine phase de commandement.\n• Les attaques des unités d’infanterie Deathwing alliées qui ciblent une unité ennemie à portée de votre objectif voué ont +1 aux jets pour blesser.\n\nRestrictions : votre armée peut inclure des unités des Dark Angels, mais elle ne peut inclure aucune unité ADEPTUS ASTARTES issue d’un autre chapitre.","In your Movement phase, select up to one visible friendly ADEPTUS ASTARTES unit within 9\" of this model, and select one combat doctrine. That combat doctrine is active for that unit until the start of your next Command phase.":"Dans votre phase de mouvement, sélectionnez jusqu’à une unité ADEPTUS ASTARTES amie visible à 9\" ou moins de cette figurine, puis choisissez une doctrine de combat. Cette doctrine de combat est active pour cette unité jusqu’au début de votre prochaine phase de commandement.","In your Shooting phase, when a friendly Adeptus Astartes Transport unit has shot, you can select one enemy unit hit by those attacks. That enemy unit is assailed until the end of the turn:\n• While a unit is assailed, when an ADEPTUS ASTARTES unit that disembarked this turn targets that unit, those attacks have [Sustained Hits 1].":"Dans votre phase de tir, lorsqu’une unité de Transport ADEPTUS ASTARTES alliée a tiré, vous pouvez sélectionner une unité ennemie touchée par ces attaques. Cette unité ennemie est harcelée jusqu’à la fin du tour :\n• Tant qu’une unité est harcelée, lorsqu’une unité ADEPTUS ASTARTES ayant débarqué ce tour la cible, ces attaques ont [COUPS SOUTENUS 1].","In your Shooting phase, you can select one enemy unit. This unit’s Heavy Bolter weapons that target that enemy unit have [Blast 1].":"Dans votre phase de tir, vous pouvez sélectionner une unité ennemie. Les armes Heavy Bolter de cette unité qui ciblent cette unité ennemie ont [BLAST 1].","Indefatigable Fortitude":"Indefatigable Fortitude","Indomitable Defence":"Défense indomptable","Indomitor Kill Team":"Indomitor Kill Team","INESCAPABLE JUSTICE":"JUSTICE INÉLUCTABLE","Infantry":"Infanterie","Infantry Character":"Personnage d’infan ad that bodyguard unit for the battle and form an attached unit with it.\n\nUnless otherwise stated, each bodyguard unit can only have one leader unit and one support unit attached to it.":"LEADER24.22\n\nLes héros puissants combattent au premier rang de la bataille.\nAvant la bataille, lors de l’étape Mobilisation des armées, pour chaque unité Leader et unité de Soutien de votre armée, vous pouvez sélectionner une unité Bodyguard amie que cette unité peut diriger. Cette unité dirigera alors cette unité Bodyguard pendant la bataille et formera avec elle une unité attachée.\n\nSauf indication contraire, chaque unité Bodyguard ne peut avoir qu’une unité Leader et une unité de Soutien attachées.","Les paliers « YOUR 3RD+ UNIT COSTS » ne sont pas appliqués automatiquement : le total reste indicatif.":"Les paliers « YOUR 3RD+ UNIT COSTS » ne sont pas appliqués automatiquement : le total reste indicatif.","Lethal Hits":"Touches fatales (Lethal Hits)","Librarian":"Librarian","Librarian In Terminator Armour":"Librarian In Terminator Armour","Lieutenant":"Lieutenant","Lightning-fast Strike":"Frappe éclair","Limites indicatives pour une petite liste ; aucune validation d'armée complète.":"Limites indicatives pour une petite liste ; aucune validation d'armée complète.","Linebreaker Onslaught":"Linebreaker Onslaught","Lion El'Jonson":"Lion El'Jonson","Lion El’jonson":"Lion El’jonson","Lion El’Jonson stalks from mist-wreathed shadow realms like an ancient questing knight hunting down the galaxy’s terrors. With the immense blade, Fealty, the Primarch cleaves apart the most heinous of monstrosities, while the Emperor’s Shield erupts in blazes of light and force in response to his foes’ savage blows.":"Lion El'Jonson surgit des royaumes d’ombre voilés de brume tel un Ancient chevalier errant traquant les terreurs de la galaxie. De la lame immense qu’est Fealty, le Primarque fend les monstruosités les plus infâmes, tandis que the Emperor's Shield éclate en éclats de lumière et de fo moins et une doctrine de combat ; cette doctrine reste active pour cette unité jusqu’au début de votre prochaine phase de commandement.","Servo-armature":"Servo-armature","Shadow Masters":"Maîtres de l’ombre","Shooting or Fight phase":"Phase de tir ou de combat","Shooting phase":"Phase de tir","single":"single","Singular Will":"Singular Will","SKYBORNE SURVEILLANCE":"SURVEILLANCE AÉROPORTÉE","SM":"SM","Space Marine armoured formations rapidly share cogitated targeting data to augment their already superb marksmanship and reaction times.":"Les formations blindées des Space Marines partagent rapidement des données de visée calculées afin d’améliorer leur déjà excellente précision de tir et leurs temps de réaction.","SPACE MARINE BIKE SQUADRONS, SPEEDERS AND LIGHT ARMOUR RACE INTO BATTLE":"ESCADRONS DE MOTOS, SPEEDERS ET BLINDÉS LÉGERS DES SPACE MARINES SE PRÉCIPITENT AU COMBAT","Space Marine crews train to provide armoured fire support to their debarked passengers while on the attack.":"Les équipages des Space Marines s’entraînent à fournir un appui feu blindé à leurs passagers débarqués lors des attaques.","SPACE MARINE TANKS DEPLOY AT SQUADRON STRENGTH TO PUNCH THROUGH ENEMY LINES":"LES CHARS DES SPACE MARINES SE DÉPLOIENT EN ESCADRONS POUR PERCER LES LIGNES ENNEMIES","Space Marines":"Space Marines","Space Marines who specialise in close-quarters brutality truly embody their sobriquet ‘Angels of Death’.":"Les Space Marines spécialisés dans la brutalité au corps à corps incarnent pleinement leur surnom « Anges de la Mort ».","Spearpoint War Leader":"Spearpoint War Leader","Spiritual Leader":"Leader spirituel","Spiritual Leader (Once per battle round, per unit)":"Leader spirituel (une fois par tour de bataille, par unité)","SQUADS OF BATTLE-BROTHERS RACE INTO BATTLE ABOARD INDOMITABLE ARMOURED TRANSPORTS":"DES ESCOUADES DE FRÈRES DE BATAILLE SE RUEENT AU COMBAT À BORD DE TRANSPORTS BLINDÉS INDOMPTABLES","STAND UNYIELDING":"TENEZ BON SANS CÉDER","Standard of the Emperor Ascendant":"Standard of the Emperor Ascendant","Start of the Fight phase":"Début de la phase de combat","Start of the Fight phase.":"Début de la phase de combat.","Sternguard Veteran Squad":"Sternguard Veteran Squad","STORM AND SECURE":"PRENDRE D’ASSAUT ET SÉCURISER","Storm Bolters":"Storm Bolters","STORM OF DEVASTATION":"TEMPÊTE DE DÉVASTATION","STORM OF FIRE":"TEMPÊTE DE FEU","storm-bolters":"storm-bolters","Stormlance Task Force":"Stormlance Task Force","Stormlance Task Force Stratagem":"Stratagème Stormlance Task Force","stormspear":"stormspear","stormspear rocket pod":"stormspear rocket pod","Stormspear rocket pod":"Stormspear rocket pod","Strategic Acumen":"Acuité stratégique","STRIKE FROM THE SHADOWS":"FRAPPE DEPUIS LES OMBRES","stubber":"stubber","SUDDEN ONSLAUGHT":"OFFENSIVE SOUDAINE","Super-heavy Walker":"Marcheur super-lourd","Supercharged Engines":"Supercharged Engines","support":"support","Support":"Soutien","SUPPORT24.34\n\nSpecialist combatants may be assigned to front-line squads to bolster their fighting effectiveness.\nBefore the battle, in the Muster Armies step, for each leader and support unit in your army, you can select one friendly bodyguard unit that unit can lead. That unit will then lead that bodyguard unit for the battle and form an attached unit with it.\n\nUnless otherwise stated, each bodyguard unit can only have one leader unit and one support unit attached to it.":"SOUTIEN24.34\n\nDes combattants spécialistes peuvent être affectés aux escouades de première ligne pour renforcer leur efficacité au combat.\nAvant la bataille, lors de l’étape Mobilisation des armées, pour chaque unité Leader et unité de Soutien de votre armée, vous pouvez sélectionner une unité Bodyguard amie que cette unité peut diriger. Cette unité dirigera alors cette unité Bodyguard pendant la bataille et formera avec elle une unité attachée.\n\nSauf indication contraire, chaque unité Bodyguard ne peut avoir qu’une unité Leader et une unité de Soutien attachées.","SUPPRESSION VOLLEYS":"VOLÉES DE SUPPRESSION","Supreme Commander":"Commandant suprême","Supreme Grand Master":"Grand Maître suprême","Supreme Grand Master Azrael is a beacon of inspiration to those who follow him, and is paid enormous respect for his ability as a strategist. A masterful commander, he quickly grasps changing battlefield realities and orchestrates his forces to maximum advantage. In the fray, Azrael decapitates foes with every strike of the Sword of Secrets.":"Le Grand Maître suprême Azrael est un phare d’inspiration pour ceux qui le suivent, et jouit d’un immense respect pour ses qualités de stratège. Commandeur accompli, il saisit rapidement les réalités changeantes du champ de bataille et orchestre ses forces pour en tirer le meilleur parti. Dans la mêlée, Azrael décapite ses ennemis à chaque coup de the Sword of Secrets.","Sustained Hits 1, CLEAVE 2":"COUPS SOUTENUS 1, FEND 2","Sustained Hits 1, Rapid Fire 2, Heavy":"COUPS SOUTENUS 1, tir rapide 2, lourd","Sustained Hits 2":"COUPS SOUTENUS 2","Sword Brethren Squad":"Sword Brethren Squad","Sworn to silence, Judiciars do not preach aloud, but instead their deeds are a litany of fury. Wielding a tempormortis in one hand and an immense blade in the other, they must prove their worth in battle to join the Chaplaincy proper, doing so through acts of devotion and the slaying of enemies.":"Liés par le silence, les Judiciars ne prêchent pas à voix haute ; leurs actes sont une liturgie de fureur. Armés d’un tempormortis d’une main et d’une lame immense de l’autre, ils doivent prouver leur valeur au combat pour rejoindre l’Aumônerie proprement dite, en accomplissant des actes de dévotion et en tuant des ennemis.","Tactical Brethren":"Tactical Brethren","Tactical Brethren Stratagem":"Stratagème Tactical Brethren","TACTICAL DREADNOUGHT FORTITUDE":"FORTITUDE TACTIQUE DES DREADNOUGHT","TACTICAL FOCUS":"CONCENTRATION TACTIQUE","Tactical Insight":"Tactical Insight","Tactical Mastery":"Maîtrise tactique","TACTICAL MASTERY":"MAÎTRISE TACTIQUE","TACTICAL WITHDRAWAL":"RETRAITE TACTIQUE","Tacticus":"Tacticus","Tacticus Attack Force":"Tacticus Attack Force","Tacticus Attack Force Stratagem":"Stratagème Tacticus Attack Force","Tacticus Firestorm Force":"Tacticus Firestorm Force","Tacticus Firestorm Force Stratagem":"Stratagème Tacticus Firestorm Force","Tacticus model only. Friendly ADEPTUS ASTARTES units within 6\" of this model can re-roll leadership rolls.":"Figurine Tacticus uniquement. Les unités ADEPTUS ASTARTES alliées à 6\" ou moins de cette figurine peuvent relancer les jets de commandement.","Tacticus model only. This unit has Scouts 6\".":"Figurine Tacticus uniquement. Cette unité a Éclaireurs 6\".","Tacticus model only. This unit’s attacks can:\n• Re-roll one hit roll.\n• Re-roll one wound roll.":"Figurine Tacticus uniquement. Les attaques de cette unité peuvent :\n• Relancer un jet pour toucher.\n• Relancer un jet pour blesser.","Tacticus model only. When both players have deployed their armies, you can redeploy up to three friendly Adeptus Astartes Infantry units. When doing so, you can set those units up in strategic reserves, regardless of how many units are already in strategic reserves.":"Figurine Tacticus uniquement. Lorsque les deux joueurs ont déployé leurs armées, vous pouvez redéployer jusqu’à trois unités d’infanterie Adeptus Astartes alliées. Ce faisant, vous pouvez placer ces unités dans les réserves stratégiques, quel que soit le nombre d’unités déjà dans les réserves stratégiques.","TACTICUS-ARMOURED WARRIORS LAY DOWN DISCIPLINED FIRE TO DOMINATE THE BATTLEFIELD":"LES GUERRIERS EN ARMURE TACTICUS FONT FEU AVEC DISCIPLINE POUR DOMINER LE CHAMP DE BATAILLE","Take and Hold":"Prendre et tenir","Targeted Intercession":"Intercession ciblée","Techmarine":"Techmarine","Teleport Homer (Once per battle, per unit)":"Balise de téléportation (une fois par bataille, par unité)","Tempered in Battle (Aura)":"Tempered in Battle (Aura)","Tempormortis":"Tempormortis","Termi
