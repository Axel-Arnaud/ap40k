  function refreshDetachmentResults() {
    var box = document.getElementById('results');
    if (!box) return;
    var input = document.getElementById('det-search');
    state.search = input ? input.value : '';
    var q = norm(state.search);
    clear(box);
    var matches = rules.detachments.filter(function (d) {
      var hay = norm([
        d.name, tf(d.name), d.faction, d.forceDisposition, tf(d.forceDisposition)
      ].concat((d.rules || []).map(function (x) {
        return [x.name, tf(x.name), x.description, tf(x.description)].join(' ');
      })).concat((d.stratagems || []).map(function (s) {
        return [s.name, tf(s.name), s.effect, tf(s.effect)].join(' ');
      })).join(' '));
      return !q || hay.indexOf(q) !== -1;
    });
    if (!matches.length) {
      box.appendChild(el('div', { className: 'empty', text: 'Aucun détachement trouvé.' }));
      return;
    }
    matches.forEach(function (d) {
      var badgeClass = d.faction === 'DA' ? 'badge da' : 'badge';
      var card = el('div', {
        className: 'card tappable',
        attrs: { role: 'button', tabindex: '0', 'data-id': d.id }
      }, [
        el('div', { className: 'row' }, [
          el('span', { className: 'card-title grow', text: tf(d.name) }),
          el('span', { className: badgeClass, text: d.faction === 'DA' ? 'Dark Angels' : 'Space Marines' })
        ]),
        el('div', { className: 'card-sub' }, [
          el('span', { text: d.dp + ' DP · ' }),
          el('span', { text: (d.rules || []).map(function (x) { return tf(x.name); }).join(', ') || '—' })
        ]),
        el('div', { className: 'tiny muted', text: d.stratagems.length + ' stratagèmes · ' + d.enhancements.length + ' améliorations' })
      ]);
      var open = function () { go('detachements', d.id); };
      card.addEventListener('click', open);
      card.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
      });
      box.appendChild(card);
    });
  }

  function renderDetachmentDetail(main, d) {
    main.appendChild(backButton('detachements'));
    main.appendChild(el('div', { className: 'row' }, [
      el('h1', { className: 'grow', text: tf(d.name) }),
      el('span', { className: d.faction === 'DA' ? 'badge da' : 'badge', text: d.dp + ' DP' })
    ]));
    if (d.legend) main.appendChild(el('p', { className: 'prose muted', text: tf(d.legend) }));

    main.appendChild(el('div', { className: 'section-title', text: 'Règles' }));
    if (!(d.rules || []).length) main.appendChild(el('p', { className: 'muted', text: 'Aucune règle détaillée dans le snapshot.' }));
    (d.rules || []).forEach(function (rule) {
      var card = el('div', { className: 'card' }, [
        el('div', { className: 'card-title', text: tf(rule.name) })
      ]);
      if (rule.description) card.appendChild(el('p', { className: 'prose small', text: tf(rule.description) }));

    });

    if (d.forceDisposition || (d.chapterDp || []).length) {
      main.appendChild(el('div', { className: 'section-title', text: 'Restrictions' }));
      if (d.forceDisposition) main.appendChild(el('p', { className: 'small', text: 'Disposition de force : ' + tf(d.forceDisposition) }));
      (d.chapterDp || []).forEach(function (c) {
        main.appendChild(el('p', { className: 'small muted', text: tf(c.keyword) + ' : ' + c.dp + ' DP' }));
      });
    }

    main.appendChild(el('div', { className: 'section-title', text: 'Améliorations (' + d.enhancements.length + ')' }));
    if (!d.enhancements.length) main.appendChild(el('p', { className: 'muted', text: 'Aucune amélioration.' }));
    d.enhancements.forEach(function (e) {

          el('span', { className: 'points', text: e.cost + ' pts' })
        ]),
        el('p', { className: 'prose small', text: tf(e.description) }),
        el('button', {
          className: 'ghost small',
          text: 'Ajouter à Ma liste',
          attrs: { type: 'button' },
          on: {
            click: function () {
              if (state.detachmentId !== d.id) {
                state.detachmentId = d.id;
                state.enhancements = [];
              }
              if (!state.enhancements.some(function (x) { return x.id === e.id; })) {
                state.enhancements.push({ id: e.id, detachmentId: d.id, name: tf(e.name), cost: e.cost });
              }
              scheduleSave();
              showToast('Amélioration ajoutée : ' + tf(e.name));
            }
          }
        })
      ]);
      main.appendChild(card);
    });

    main.appendChild(el('div', { className: 'section-title', text: 'Stratagèmes (' + d.stratagems.length + ')' }));
    if (!d.stratagems.length) main.appendChild(el('p', { className: 'muted', text: 'Aucun stratagème.' }));
    d.stratagems.forEach(function (s) {

          el('span', { className: 'badge sm', text: s.cp + ' CP' })
        ]),

      ]);

        card.appendChild(el('p', { className: 'small prose', text: tf(s.text) }));
      }
      main.appendChild(card);
    });

    main.appendChild(el('button', {
      className: 'primary',
      text: 'Utiliser ce détachement dans Ma liste',
      attrs: { type: 'button' },
      on: {
        click: function () {
          state.detachmentId = d.id;
          state.enhancements = [];
          scheduleSave();
          showToast('Détachement actif : ' + tf(d.name));
          go('liste');
        }
      }
    }));
  }

    var table = el('table', { className: 'table' });

      head.appendChild(el('th', { text: h }));
    });
    table.appendChild(el('thead', {}, head));
    var body = el('tbody');
    result.weapons.forEach(function (w) {
      var isNew = result.added.indexOf(w.name) !== -1;
      var row = el('tr', { className: isNew ? 'granted' : '' });
      row.appendChild(el('td', {}, [
        el('div', { className: 'weapon-name', text: tf(w.name) }),
        w.description ? el('div', { className: 'weapon-props', text: tf(w.description) }) : null
      ]));
      [tf(w.range), tf(w.type), w.A, w.BS_WS, w.S, w.AP, w.D].forEach(function (v) {

  function renderOptions(sheetId, cfg, container) {
    clear(container);
    var groups = groupList(sheetId);
    if (!groups.length) {
      container.appendChild(el('p', { className: 'muted small', text: 'Aucune option d’armement pour cette fiche.' }));
      return;
    }
    groups.forEach(function (g) {
      var box = el('div', { className: 'option-group' });
      box.appendChild(el('div', { className: 'section-title', text: tf(g.label) }));
      var max = effectiveMax(g, cfg.size);
      if (g.maxTakesPerModels) {
        box.appendChild(el('div', { className: 'small muted', text: 'Maximum ' + max + ' pour ' + cfg.size + ' modèles.' }));
      }
      g.choices.forEach(function (c) {
        var chosen = cfg.options[g.id] || [];
        var selected = chosen.indexOf(c.id) !== -1;
        var requiresMissing = (c.requires || []).some(function (req) { return chosen.indexOf(req) === -1; });
        var disabled = !selected && ((g.mode === 'multi' && chosen.length >= max) || requiresMissing);
        var input = el('input', {
          attrs: {
            type: g.mode === 'single' ? 'radio' : 'checkbox',
            name: g.id,
            value: c.id
          },
          on: {
            change: function () { setChoice(sheetId, g.id, c.id, input.checked); }
          }
        });
        if (selected) input.checked = true;
        if (disabled) input.disabled = true;
        box.appendChild(el('label', { className: 'choice' + (disabled ? ' disabled' : '') }, [
          input,
          el('div', { className: 'grow' }, [
            el('div', { text: tf(c.label) }),
            c.note ? el('div', { className: 'tiny muted', text: tf(c.note) }) : null
          ]),
          c.cost ? el('div', { className: 'cost', text: '+' + c.cost } ) : null
        ]));
      });
      container.appendChild(box);
    });
  }

  function setChoice(sheetId, groupId, choiceId, checked) {
    var cfg = currentConfig();
    var g = groupList(sheetId).find(function (x) { return x.id === groupId; });
    if (!g) return;
    var arr = (cfg.options[groupId] || []).slice();
    if (g.mode === 'single') {
      arr = checked ? [choiceId] : [];
      if (!arr.length && g.choices[0] && g.choices[0].id === 'default') arr = ['default'];
    } else if (checked) {
      var picked = g.choices.find(function (c) { return c.id === choiceId; });
      if (picked && (picked.requires || []).some(function (req) { return arr.indexOf(req) === -1; })) return;
      if (arr.indexOf(choiceId) === -1) arr.push(choiceId);
      arr = limitChoices(g, cfg.size, arr);
    } else {
      // Unchecking a prerequisite must also drop choices that depend on it.
      arr = limitChoices(g, cfg.size, arr.filter(function (id) { return id !== choiceId; }));
    }
    cfg.options[groupId] = arr;
    renderOptions(sheetId, cfg, document.getElementById('options-box'));
    paintPreview();
    scheduleSave();
  }

  function currentConfig() {
    var id = route().id;
    if (!state.configs[id]) state.configs[id] = defaultConfig(id);
    return state.configs[id];
  }

  function renderLeaderSelectors(sheetId, cfg, container) {
    clear(container);
    [['leader', 'Meneur', 'leader-box'], ['support', 'Soutien', 'support-box']].forEach(function (spec) {
      var candidates = leaderCandidates(sheetId, spec[0]);
      if (!candidates.length) return;
      var select = el('select', {
        attrs: { id: spec[2], 'aria-label': spec[1] },
        on: {
          change: function () {
            var others = cfg.leaders.filter(function (id) {
              var l = leaderById(id);
              return l && l.kind !== spec[0];
            });
            cfg.leaders = select.value ? others.concat([select.value]) : others;
            paintPreview();
            scheduleSave();
          }
        }
      }, [el('option', { value: '', text: 'Aucun' })]);
      candidates.forEach(function (l) {
        select.appendChild(el('option', { value: l.id, text: tf(l.name) }));
      });
      var current = cfg.leaders.find(function (id) {
        var l = leaderById(id);
        return l && l.kind === spec[0];
      });
      if (current) select.value = current;
      container.appendChild(el('label', { className: 'small muted', text: spec[1] }));
      container.appendChild(select);
    });
    if (!container.firstChild) {
      container.appendChild(el('p', { className: 'muted small', text: 'Aucun meneur ni soutien compatible dans cette sélection de fiches.' }));
    }
  }

  function paintPreview() {
    var id = route().id;
    var sheet = sheetById(id);
    if (!sheet) return;
    var cfg = currentConfig();
    var result = computeSheet(sheet.id, cfg);
    var pv = document.getElementById('points-value');
    var tv = document.getElementById('total-value');
    var lv = document.getElementById('leader-points');
    if (pv) pv.textContent = String(result.unitPoints);
    if (tv) tv.textContent = String(result.total);
    if (lv) lv.textContent = String(result.leaderTotal);
    renderWeaponBox(result, document.getElementById('weapon-changes'), document.getElementById('weapon-box'));
    renderBonusBox(result, document.getElementById('bonus-box'));
  }

  function addToSheetList(sheetId) {
    var cfg = sanitizeConfig(currentConfig()) || defaultConfig(sheetId);
    if (state.editingIndex >= 0 && state.entries[state.editingIndex]) {
      state.entries[state.editingIndex].config = cfg;
      showToast('Unité mise à jour');
    } else {
      state.entries.push({ key: makeKey(), sheetId: sheetId, qty: 1, config: cfg });
      showToast('Ajouté à Ma liste : ' + tf(sheetById(sheetId).name));
    }
    state.editingIndex = -1;
    scheduleSave();
    go('liste');
  }

  /* ---------------------------------------------------------------- *
   * Ma liste
   * ---------------------------------------------------------------- */

  function entryPoints(entry) {
    var result = computeSheet(entry.sheetId, entry.config);
    return result ? { unit: result.unitPoints * entry.qty, total: result.total * entry.qty, result: result } : { unit: 0, total: 0, result: null };
  }

  function factionIssues() {
    var det = detachmentById(state.detachmentId);
    var issues = [];
    if (!det) return issues;
    var chapterKeywords = /^(DARK ANGELS|BLOOD ANGELS|SPACE WOLVES|BLACK TEMPLARS|DEATHWATCH|IMPERIAL FISTS|IRON HANDS|RAVEN GUARDS|SALAMANDERS|ULTRAMARINES|WHITE SCARS)$/i;
    state.entries.forEach(function (e) {
      var sheet = sheetById(e.sheetId);
      if (!sheet) return;
      if (det.faction === 'DA') {
        var da = (sheet.keywords || []).some(function (k) { return k.name === 'DARK ANGELS'; });
        if (!da) issues.push(tf(sheet.name) + ' : mot-clé DARK ANGELS absent');
      } else {
        var second = (sheet.keywords || []).some(function (k) { return k.factionKeyword && chapterKeywords.test(k.name); });
        if (second) issues.push(tf(sheet.name) + ' : second mot-clé de chapitre');
      }
    });
    return issues;
  }

              render();

            className: 'ghost',
            text: 'Retirer',

    state.entries.forEach(function (entry, index) {
      var sheet = sheetById(entry.sheetId);
      if (!sheet) return;
      var pts = entryPoints(entry);
      var optionLabels = [];
      groupList(sheet.id).forEach(function (g) {
        (entry.config.options[g.id] || []).forEach(function (id) {
          var c = g.choices.find(function (x) { return x.id === id; });
          if (c && c.id !== 'default' && c.id !== 'none') optionLabels.push(tf(c.label));
        });
      });
      var leaderLabels = entry.config.leaders.map(function (id) {
        var l = leaderById(id);
        return l ? tf(l.name) : id;
      });
      var card = el('div', { className: 'card' }, [
        el('div', { className: 'spread' }, [
          el('span', { className: 'card-title grow', text: entry.qty + '× ' + tf(sheet.name) }),
          el('span', { className: 'points', text: pts.total + ' pts' })
        ]),
        el('div', { className: 'tiny muted', text: [entry.config.size + ' modèles', optionLabels.join(', '), leaderLabels.join(' + ')].filter(Boolean).join(' · ') || 'Configuration par défaut' }),
        el('div', { className: 'row', attrs: {} }, [
          el('button', {
            text: '−',
            className: 'qty-btn',
            attrs: { type: 'button', 'aria-label': 'Retirer une figurine' },
            on: { click: function () { changeQty(index, -1); } }
          }),
          el('button', {
            text: '+',
            className: 'qty-btn',
            attrs: { type: 'button', 'aria-label': 'Ajouter une figurine' },
            on: { click: function () { changeQty(index, 1); } }
          }),
          el('button', {
            text: 'Modifier',
            attrs: { type: 'button' },
            on: {
              click: function () {
                state.configs[sheet.id] = sanitizeConfig(entry.config) || defaultConfig(sheet.id);
                state.editingIndex = index;
                go('datasheets', sheet.id);
              }
            }
          }),
          el('button', {
            text: 'Retirer',
            className: 'danger',
            attrs: { type: 'button' },
            on: { click: function () { removeEntry(index); } }
          })
        ])
      ]);
      main.appendChild(card);
    });

    if (state.entries.length) {
      var warlordSelect = el('select', {
        attrs: { id: 'warlord-select', 'aria-label': 'Warlord' },
        on: {
          change: function () {
            state.warlordKey = warlordSelect.value;
            scheduleSave();
          }
        }
      }, [el('option', { value: '', text: 'Aucun warlord' })]);
      state.entries.forEach(function (e) {
        warlordSelect.appendChild(el('option', { value: e.key, text: tf(sheetById(e.sheetId).name) }));
      });
      warlordSelect.value = state.warlordKey;
      main.appendChild(el('div', { className: 'section-title', text: 'Warlord' }));
      main.appendChild(warlordSelect);
    }

    var total = state.entries.reduce(function (sum, e) { return sum + entryPoints(e).total; }, 0);
    var enhTotal = state.enhancements.reduce(function (sum, e) { return sum + (e.cost || 0); }, 0);
    main.appendChild(el('div', { className: 'total-bar' }, [
      el('span', { className: 'small', text: 'Total indicatif' }),
      el('b', { text: (total + enhTotal) + ' pts' })
    ]));
    main.appendChild(el('p', { className: 'tiny muted center', text: overrides.points.label + ' · ' + overrides.points.rounding }));

    var issues = factionIssues();
    if (issues.length) {
      main.appendChild(el('div', { className: 'section-title', text: 'Points de vigilance' }));
      issues.forEach(function (issue) { main.appendChild(el('p', { className: 'small', text: '• ' + issue })); });
    }

    main.appendChild(el('div', { className: 'section-title', text: 'Export / import' }));
    var exportArea = el('textarea', { attrs: { id: 'export-area', readonly: 'readonly', 'aria-label': 'Export de la liste' } });
    exportArea.value = exportText();
    var importArea = el('textarea', { attrs: { id: 'import-area', placeholder: 'Coller un export AP40K-LIST v1', 'aria-label': 'Import de la liste' } });
    main.appendChild(exportArea);
    main.appendChild(el('div', { className: 'row export-actions' }, [
      el('button', {
        text: 'Copier',
        attrs: { type: 'button' },
        on: {
          click: function () {
            if (!navigator.clipboard) { showToast('Copie indisponible sur cet appareil'); return; }
            navigator.clipboard.writeText(exportArea.value)
              .then(function () { showToast('Liste copiée'); })
              .catch(function () { showToast('Copie refusée par le navigateur'); });
          }
        }
      }),
      el('button', {
        text: 'Actualiser l’export',
        className: 'ghost',
        attrs: { type: 'button' },
        on: { click: function () { exportArea.value = exportText(); } }
      })
    ]));
    main.appendChild(importArea);
    main.appendChild(el('button', {
      className: 'primary',
      text: 'Importer cette liste',
      attrs: { type: 'button' },
      on: {
        click: function () { importText(importArea.value); }
      }
    }));
  }

  function changeQty(index, delta) {
    var entry = state.entries[index];
    if (!entry) return;
    entry.qty = Math.min(20, Math.max(1, entry.qty + delta));
    scheduleSave();
    render();
  }

  function removeEntry(index) {
    var removed = state.entries.splice(index, 1)[0];
    if (removed && state.warlordKey === removed.key) state.warlordKey = '';
    if (state.editingIndex === index) state.editingIndex = -1;
    scheduleSave();
    render();
  }

  function exportText() {
    var lines = ['AP40K-LIST v1'];
    lines.push('# Ap40k — liste locale (total indicatif)');
    lines.push('# ' + overrides.points.label);
    lines.push('DETACHMENT: ' + (state.detachmentId || ''));
    // Export an index: imported entries get fresh keys, so a raw key would
    // always be orphaned on the way back in.
    var warlordIndex = state.entries.findIndex(function (e) { return e.key === state.warlordKey; });
    lines.push('WARLORD: ' + (warlordIndex >= 0 ? String(warlordIndex) : ''));
    lines.push('ENHANCEMENTS: ' + state.enhancements.map(function (e) { return e.id; }).join(','));
    state.entries.forEach(function (e) {
      var opt = Object.keys(e.config.options || {}).map(function (gid) {
        return gid + '=' + (e.config.options[gid] || []).join(',');
      }).join(';');
      lines.push(['UNIT', e.sheetId, e.qty, e.config.size, opt, (e.config.leaders || []).join(',')].join('|'));
    });
    lines.push('END');
    lines.push('');
    lines.push('# Lecture humaine');
    var det = detachmentById(state.detachmentId);
    lines.push('Détachement : ' + (det ? tf(det.name) : '—'));
    state.entries.forEach(function (e) {
      var sheet = sheetById(e.sheetId);
      if (!sheet) return;
      var pts = entryPoints(e);
      lines.push('- ' + e.qty + '× ' + tf(sheet.name) + ' (' + e.config.size + ') — ' + pts.total + ' pts');
    });
    var total = state.entries.reduce(function (sum, e) { return sum + entryPoints(e).total; }, 0);
    var enhTotal = state.enhancements.reduce(function (sum, e) { return sum + (e.cost || 0); }, 0);
    lines.push('TOTAL : ' + (total + enhTotal) + ' pts (indicatif)');
    return lines.join('\n');
  }

  function importText(text) {
    var lines = String(text || '').split(/\r?\n/);
    var parsed = { detachmentId: '', warlordKey: '', enhancements: [], entries: [] };
    lines.forEach(function (line) {
      if (line.indexOf('DETACHMENT: ') === 0) parsed.detachmentId = line.slice(12).trim();
      else if (line.indexOf('WARLORD: ') === 0) parsed.warlordKey = line.slice(9).trim();
      else if (line.indexOf('ENHANCEMENTS: ') === 0) {
        parsed.enhancements = line.slice(14).split(',').map(function (x) { return x.trim(); }).filter(Boolean);
      } else if (line.indexOf('UNIT|') === 0) {
        var p = line.split('|');
        if (p.length < 4) return;
        var options = {};
        (p[4] || '').split(';').forEach(function (pair) {
          if (!pair) return;
          var kv = pair.split('=');
          if (kv.length === 2) options[kv[0]] = kv[1].split(',').filter(Boolean);
        });
        var cfg = sanitizeConfig({
          sheetId: p[1],
          size: Number(p[3]),
          options: options,
          leaders: (p[5] || '').split(',').filter(Boolean)
        });
        if (!cfg) return;
        parsed.entries.push({
          key: makeKey(),
          sheetId: cfg.sheetId,
          qty: Math.min(20, Math.max(1, Number(p[2]) || 1)),
          config: cfg
        });
      }
    });
    parsed.entries = parsed.entries.filter(function (e) { return e.config; });
    if (!parsed.entries.length && lines.indexOf('AP40K-LIST v1') === -1) {
      showToast('Format non reconnu');
      return;
    }
    state.detachmentId = detachmentById(parsed.detachmentId) ? parsed.detachmentId : null;
    state.entries = parsed.entries;
    state.enhancements = parsed.enhancements.map(function (id) { return findEnhancement(id); })
      .filter(function (e) { return e && e.detachmentId === state.detachmentId; })
      .map(function (e) { return { id: e.id, detachmentId: e.detachmentId, name: e.name, cost: e.cost }; });
    var warlordRef = /^\d+$/.test(parsed.warlordKey)
      ? (parsed.entries[Number(parsed.warlordKey)] || {}).key
      : parsed.warlordKey;
    state.warlordKey = parsed.entries.some(function (e) { return e.key === warlordRef; }) ? warlordRef : '';
    state.configs = {};
    scheduleSave();
    showToast('Liste importée : ' + state.entries.length + ' unité(s)');
    render();
  }

  /* ---------------------------------------------------------------- *
   * Update + service worker
   * ---------------------------------------------------------------- */

  function canonical(value) {
    if (Array.isArray(value)) return value.map(canonical);
    if (value && typeof value === 'object') {
      var out = {};
      Object.keys(value).sort().forEach(function (k) { out[k] = canonical(value[k]); });
      return out;
    }
    return value;
  }

  async function canonicalHash(value) {
    var bytes = new TextEncoder().encode(JSON.stringify(canonical(value)));
    var digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest)).map(function (b) {
      return b.toString(16).padStart(2, '0');
    }).join('');
  }

  // A runtime fetch replaces the editor layer globally: validate the shape the
  // renderers actually use before committing, or a later hashchange would crash
  // outside the updater's try/catch.
  function validOverrides(value) {
    if (!value || !Array.isArray(value.leaders) ||
        !value.options || typeof value.options !== 'object' ||
        !value.capLimits || typeof value.capLimits !== 'object' ||
        !value.points || typeof value.points !== 'object' ||
        typeof value.points.label !== 'string' ||
        typeof value.points.rounding !== 'string') return false;
    var tr = value.translations;
    if (!tr || tr.locale !== 'fr' || typeof tr.strings !== 'object' ||
        !Object.keys(tr.strings).every(function (k) { return typeof tr.strings[k] === 'string'; })) return false;
    var leaderIds = {};
    for (var i = 0; i < value.leaders.length; i += 1) {
      var leader = value.leaders[i];
      if (!leader || typeof leader.id !== 'string' || typeof leader.kind !== 'string' ||
          typeof leader.name !== 'string' || leaderIds[leader.id]) return false;
      leaderIds[leader.id] = true;
    }
    var sheets = Object.keys(value.options);
    for (var s = 0; s < sheets.length; s += 1) {
      var entry = value.options[sheets[s]];
      if (!entry || !Array.isArray(entry.groups)) return false;
      for (var g = 0; g < entry.groups.length; g += 1) {
        var group = entry.groups[g];
        if (!group || typeof group.id !== 'string' || !Array.isArray(group.choices)) return false;
        for (var c = 0; c < group.choices.length; c += 1) {
          var choice = group.choices[c];
          if (!choice || typeof choice.id !== 'string') return false;
          if (['requires', 'removes', 'grants'].some(function (field) {
            return choice[field] !== undefined && !Array.isArray(choice[field]);
          })) return false;
        }
      }
    }
    return true;
  }

  async function updateRules() {
    if (localMode) { showToast('Mise à jour indisponible en mode fichier local'); return; }
    try {
      // Both layers must be fetched together: mixing a new rules.json with the
      // editorial layer frozen at build time would mix new costs with old
      // option surcharges, bonuses and point dates.
      var responses = await Promise.all([
        fetch('./data/rules.json', { cache: 'no-store' }),
        fetch('./data/overrides.json', { cache: 'no-store' })
      ]);
      responses.forEach(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status + ' sur ' + (res.url || 'fichier inconnu'));
      });
      var next = await responses[0].json();
      var nextOverrides = await responses[1].json();
      if (!next.meta || Number(next.meta.edition) !== 11 ||
          !Array.isArray(next.detachments) || !Array.isArray(next.datasheets)) {
        throw new Error('format de données invalide');
      }
      // Self-contained integrity check: validate the fetched payload against
      // its own metadata, not against the version frozen in the inline boot.
      var hash = await canonicalHash({ detachments: next.detachments, datasheets: next.datasheets });
      if (hash !== next.meta.hashSha256) throw new Error('empreinte invalide');
      if (!validOverrides(nextOverrides) ||
          nextOverrides.sourceVersion !== next.meta.sourceVersion ||
          nextOverrides.sourceHash !== next.meta.hashSha256) {
        throw new Error('couche éditoriale incompatible');
      }

      rules = next;
      overrides = nextOverrides;
      rebuildIndexes();

      // Revalidate local state: a newer snapshot may have dropped ids.
      state.entries = state.entries.map(function (e) {
        var cfg = sanitizeConfig(e.config);
        return cfg ? { key: e.key, sheetId: cfg.sheetId, qty: e.qty, config: cfg } : null;
      }).filter(Boolean);
      var rebuilt = {};
      Object.keys(state.configs).forEach(function (id) {
        var cfg = sanitizeConfig(state.configs[id]);
        if (cfg && cfg.sheetId === id) rebuilt[id] = cfg;
      });
      state.configs = rebuilt;
      state.enhancements = state.enhancements.filter(function (e) {
        return Boolean(findEnhancement(e.id));
      });
      if (state.detachmentId && !detachmentById(state.detachmentId)) state.detachmentId = null;
      if (!state.entries.some(function (e) { return e.key === state.warlordKey; })) state.warlordKey = '';
      state.editingIndex = -1;

      if ('caches' in window) {
        // Write to the cache owned by the active service worker, not to a new
        // name that would be wiped on the next activate.
        var cache = await caches.open(CACHE_NAME);
        await Promise.all([
          ['./data/rules.json', next],
          ['./data/overrides.json', nextOverrides]
        ].map(function (pair) {
          return cache.put(pair[0], new Response(JSON.stringify(pair[1]), {
            headers: { 'content-type': 'application/json' }
          }));
        }));
      }
      render();
      showToast('Données à jour : ' + next.meta.sourceVersion);
    } catch (e) {
      showToast('Mise à jour impossible : ' + (e && e.message ? e.message : 'erreur'));
    }
  }

  loadSaved();
  window.addEventListener('hashchange', render);
  window.addEventListener('pagehide', flushSave);
  if ('serviceWorker' in navigator && !localMode) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* offline first load still works */ });
    });
  }
  render();
}());
</script>
</body>
</html>
