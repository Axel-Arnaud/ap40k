ais aussi d’augures et de traqueurs performants, dont les esprits de la machine sans sommeil sont aussi vigilants que les frères de bataille en armure noire.","The Assault Intercessor Sergeant can have their Chainsword replaced with one of the following:• 1 Power Fist\n• 1 Power Weapon\n• 1 Thunder Hammer":"Le Assault Intercessor Sergeant peut remplacer son Chainsword par l’une des options suivantes :• 1 Power Fist\n• 1 Power Weapon\n• 1 Thunder Hammer","The Assault Intercessor Sergeant can have their Heavy Bolt Pistol replaced with one of the following:• 1 Hand Flamer\n• 1 Plasma Pistol":"Le Assault Intercessor Sergeant peut remplacer son Heavy Bolt Pistol par l’une des options suivantes :• 1 Hand Flamer\n• 1 Plasma Pistol","The Bladeguard Veteran Sergeant can have their Heavy bolt pistol replaced with one of the following:• 1 Neo-volkite Pistol\n• 1 Plasma Pistol":"Le Bladeguard Veteran Sergeant peut remplacer son Heavy Bolt Pistol par l’une des options suivantes :• 1 Neo-volkite Pistol\n• 1 Plasma Pistol","THE CHAPTER’S CLOSE-COMBAT SPECIALISTS TEAR INTO THE FOE WITH LETHAL INTENT":"LES SPÉCIALISTES DU CORPS À CORPS DU CHAPITRE FONT IRRUPTION DANS L’ENNEMI AVEC UNE INTENTION MORTELLE","THE CHAPTER’S DEATHLESS DREADNOUGHT CHAMPIONS STRIDE OUT TO WAR":"LES CHAMPIONS DREADNOUGHT IMMORTELS DU CHAPITRE MARCHENT VERS LA GUERRE","The Emperor's Shield":"The Emperor's Shield","The Fight phase, when a friendly Adeptus Astartes unit is selected to fight.":"La phase de combat, lorsqu’une unité Adeptus Astartes alliée est sélectionnée pour combattre.","The heavy Mk X Gravis armour of these fire support specialists allows them to weather storms of incoming projectiles. Standing firm, they return fire with their brutal heavy bolters, scything down enemy infantry and blowing apart the foe’s light armoured vehicles with well-placed shots to weak spots in their targets’ hulls.":"L’armure Gravis Mk X épaisse de ces spécialistes du soutien de feu leur permet d’affronter les tempêtes de projectiles. Tels des rocs, ils ripostent avec leurs bolters lourds impitoyables, fauchant l’infanterie ennemie et pulvérisant les véhicules légèrement blindés de l’adversaire grâce à des tirs bien placés dans les points faibles de leur coque.","The Knight Master can have their Great Weapon of the Unforgiven replaced with 1 Relic Weapon.":"Le Knight Master peut remplacer sa Great Weapon of the Unforgiven par 1 Relic Weapon.","The Lion Helm":"The Lion Helm","THE PERFECTLY BALANCED BLADE OF A GLADIUS TASK FORCE CAN SLAY ANY FOE":"LA LAME PARFAITEMENT ÉQUILIBRÉE D’UNE GLADIUS TASK FORCE PEUT ABATTRE N’IMPORTE QUEL ENNEMI","The Sword of Secrets":"The Sword of Secrets","The Watchers":"Les Veilleurs","Thermal cannon":"Thermal cannon","These aggressive, close-range assault Knights excel at hunting and slaying enemy tanks and war beasts. They plunge aggressively into the fiercest fighting, unleashing hissing blasts of super-heated energy and deadly sweeps of their huge combat weapon. Theirs is a ceaseless hunt; they move on to new targets while melted ruin cools behind them.":"Ces Chevaliers d’assault agressifs et de courte portée excellent à traquer et abattre les chars et les bêtes de guerre ennemis. Ils se jettent avec fougue dans les combats les plus acharnés, déchaînant des détonations sifflantes d’énergie surchauffée et des balayages mortels de leur énorme arme de corps à corps. Leur chasse ne connaît pas de répit : ils passent à de nouvelles cibles tandis que les ruines fondues refroidissent derrière eux.","This model can be equipped with 1 Icarus Rocket Pod.":"Cette figurine peut être équipée de 1 Icarus Rocket Pod.","This model can be equipped with one of the following:• 1 ironstorm missile pod\n• 1 stormspear rocket pod\n• 1 twin Icarus autocannon":"Cette figurine peut être équipée de l’une des options suivantes :• 1 ironstorm missile pod\n• 1 stormspear rocket pod\n• 1 twin Icarus autocannon","This model’s Fragstorm Grenade Launchers can be replaced with 1 Storm Bolters.":"Les Fragstorm Grenade Launchers de cette figurine peuvent être remplacés par 1 Storm Bolters.","This model’s Heavy Flamer can be replaced with 1 Onslaught Gatling Cannon.":"Le Heavy Flamer de cette figurine peut être remplacé par 1 Onslaught Gatling Cannon.","This model’s Heavy Onslaught Gatling Cannon can be replaced with 1 Macro Plasma Incinerator.":"Le Heavy Onslaught Gatling Cannon de cette figurine peut être remplacé par 1 Macro Plasma Incinerator.","This model’s Master-crafted Heavy Bolt Rifle and Master-crafted Power Weapon can be replaced with one of the following:• 1 Boltstorm Gauntlet and 1 Relic Blade\n• 1 Boltstorm Gauntlet and 1 Relic Chainsword\n• 1 Boltstorm Gauntlet and 1 Relic Power Fist":"Le Master-crafted Heavy Bolt Rifle et l’Master-crafted Power Weapon de cette figurine peuvent être remplacés par l’une des options suivantes :• 1 Boltstorm Gauntlet et 1 Relic Blade\n• 1 Boltstorm Gauntlet et 1 Relic Chainsword\n• 1 Boltstorm Gauntlet et 1 Relic Power Fist","This model’s meltagun can be replaced with 1 Questoris heavy stubber.":"Le Meltagun de cette figurine peut être remplacé par 1 Questoris heavy stubber.","This model’s reaper chainsword can be replaced with 1 thunderstrike gauntlet.":"L’reaper chainsword de cette figurine peut être remplacée par 1 thunderstrike gauntlet.","This unit can be equipped with 1 Watcher in the Dark":"Cette unité peut être équipée de 1 Watcher in the Dark","This unit has 4+ InSv.":"Cette unité possède une sauvegarde invulnérable de 4+ (InvSv).","This unit has Feel No Pain 4+ against psychic attacks and mortal wounds.":"Cette unité a Insensible à la douleur 4+ (FNP) contre les attaques psychiques et les blessures mortelles.","This unit has Fights First.":"Cette unité possède le Combat en premier (Fights First).","This unit’s attacks have [Lethal Hits: non-Vehicle].":"Les attaques de cette unité ont [TOUCHES FATALES : non-VÉHICULE].","This unit’s attacks have [SUSTAINED HITS 1].":"Les attaques de cette unité ont [COUPS SOUTENUS 1].","This unit’s attacks that target a CHARACTER unit have +1 to hit rolls.":"Les attaques de cette unité qui ciblent une unité PERSONNAGE ont +1 aux jets pour toucher.","This unit’s melee attacks can re-roll hit rolls.":"Les attaques au corps à corps de cette unité peuvent relancer les jets pour toucher.","This unit’s melee attacks have [Lance].":"Les attaques au corps à corps de cette unité ont [LANCE].","This unit’s ranged attacks can re-roll damage rolls.":"Les attaques à distance de cette unité peuvent relancer les jets de dégâts.","Those who pilot Dreadnoughts combine the skill of undying champions with a cold and vengeful hatred of the Emperor’s countless enemies.":"Ceux qui pilotent des Dreadnoughts allient l’habileté de champions immortels à une haine froide et vengeresse envers les innombrables ennemis de l’Empereur.","Thunder Hammer":"Thunder Hammer","thunder-hammer":"thunder-hammer","Thundercowl Turbines":"Thundercowl Turbines","thunderstrike gauntlet":"thunderstrike gauntlet","Thunderstrike gauntlet – strike":"Thunderstrike gauntlet – strike","Thunderstrike gauntlet – sweep":"Thunderstrike gauntlet – sweep","Titanic":"Titanique","Tor Garadon":"Tor Garadon","Total Obliteration":"Oblitération totale","Tous les Deathwing Knights de l'unité":"Tous les Deathwing Knights de l’unité","Towering":"Imposant","TRANSHUMAN REACTIONS":"RÉACTIONS SURHUMAINES","Transhuman Strategist":"Stratège transhumain","TRANSHUMAN SWIFTNESS":"VITESSE SURHUMAINE","twin Icarus autocannon":"twin Icarus autocannon","Twin Icarus autocannon":"Twin Icarus autocannon","twin-icarus":"twin-icarus","Ulrik The Slayer":"Ulrik The Slayer","UMBRAL EVASION":"ÉVASION DANS L’OMBRE","Unceasing and unmerciful, Adeptus Astartes fire support formations lay waste to all that falls under their gunsights.":"Sans relâche et sans pitié, les formations d’appui feu des Adeptus Astartes ravagent tout ce qui tombe sous leur ligne de visée.","Unité de bodyguard potentielle, mais aucun personnage de la liste fournie ne peut actuellement l'attacher.":"Unité Bodyguard potentielle, mais aucun personnage de la liste fournie ne peut actuellement l’attacher.","Until the start of your next Command phase, your unit can ignore modifiers to your unit’s:\n•":"Jusqu’au début de votre prochaine phase de commandement, votre unité peut ignorer les modificateurs affectant :\n•","UPSTOPPABLE ADVANCE":"AVANCE INARRETABLE","Vanguard Ambushers":"Embusqués d’avant-garde","Vanguard Veteran Squad":"Vanguard Veteran Squad","Vehicle":"Véhicule","Vehicle Character":"Personnage Véhicule","Venator Omni-auspex":"Venator Omni-auspex","Venerable Champion (Aura)":"Venerable Champion (Aura)","Veterans of a hundred decapitating strikes, these First Company warriors know that if they land their first blow with sufficiently furious momentum, they will need no second.":"Veterans de cent frappes décapitantes, ces guerriers de la Première Compagnie savent que si leur premier coup porte avec une fureur suffisante, ils n’auront pas besoin d’un second.","Visible enemy units within 6\" of your unit have +3\" detection range.":"Les unités ennemies visibles à 6\" ou moins de votre unité ont une portée de détection de +3\".","Vivispectral Analysis Targeting":"Ciblage par analyse vivispectrale","Vowed Target":"Cible vouée","Vulkan He’stan":"Vulkan He’stan","Walker":"Marcheur","Walker : ne peut ni mener ni être mené.":"Marcheur : ne peut ni mener ni être mené.","Walking Fortress":"Forteresse ambulante","Wardens of Ultramar":"Wardens of Ultramar","Wargear":"Équipement","WARGEAR OPTIONS":"OPTIONS D’ÉQUIPEMENT","watcher":"watcher","Watcher in the Dark":"Watcher in the Dark","Watcher in the Dark (Once per battle, per unit)":"Watcher in the Dark (une fois par bataille, par unité)","WE ARE VENGEANCE":"NOUS SOMMES LA VENGEANCE","When a friendly Phobos or Scout SQUAD unit has shot:\n• Those attacks do not prevent that unit from being hidden.\n• Or: That unit can make a normal move of up to D6\". That unit is not eligible to declare a charge until the end of the turn.":"Lorsqu’une unité Phobos ou une ESCOUADE D’ÉCLAIREURS alliée a tiré :\n• Ces attaques n’empêchent pas cette unité d’être cachée.\n• Ou : cette unité peut effectuer un mouvement normal d’au maximum D6\". Elle ne peut pas déclarer de charge jusqu’à la fin du tour.","When a model in your unit is destroyed, if your unit has not been selected to fight this phase, roll one D6, with +1 to that roll if the assault doctrine is active for your unit:\n• On a 4+, do not remove that model from the battlefield. When your unit has fought, or at the end of the phase (whichever comes first), that model is removed from the battlefield.":"Lorsqu’une figurine de votre unité est détruite, si votre unité n’a pas été sélectionnée pour combattre cette phase, lancez un D6, avec +1 à ce jet si la doctrine d’assaut est active pour votre unité :\n• Sur un 4+, ne retirez pas cette figurine du champ de bataille. Lorsque votre unité a combattu, ou à la fin de la phase (selon la première éventualité), cette figurine est retirée du champ de bataille.","When a model in your unit is destroyed, if your unit has not been selected to fight this phase, roll one D6, with +1 to that roll if your unit is engaged with an enemy unit within range of your vowed objective:\n• On a 4+, do not remove that model from the battlefield. When your unit has fought, or at the end of the phase (whichever comes first), that model is removed from the battlefield.":"Lorsqu’une figurine de votre unité est détruite, si votre unité n’a pas été sélectionnée pour combattre cette phase, lancez un D6, avec +1 à ce jet si votre unité est à portée d’engagement d’une unité ennemie à portée de votre objectif voué :\n• Sur un 4+, ne retirez pas cette figurine du champ de bataille. Lorsque votre unité a combattu, ou à la fin de la phase (selon la première éventualité), cette figurine est retirée du champ de bataille.","When a model in your unit is destroyed, if your unit has not been selected to fight this phase, roll one D6:\n• On a 4+, do not remove that model from the battlefield. When your unit has fought, or at the end of the phase (whichever comes first), that model is removed from the battlefield.":"Lorsqu’une figurine de votre unité est détruite, si votre unité n’a pas été sélectionnée pour combattre cette phase, lancez un D6 :\n• Sur un 4+, ne retirez pas cette figurine du champ de bataille. Lorsque votre unité a combattu, ou à la fin de la phase (selon la première éventualité), cette figurine est retirée du champ de bataille.","When making that":"Lors de l’exécution de ce","When the Space Marines are roused to true martial fury, they bring their vengeance to their adversaries with the inescapable speed of a lightning strike.":"Lorsque les Space Marines sont animés d’une véritable fureur martiale, ils portent leur vengeance à leurs adversaires avec la rapidité inéluctable d’un éclair.","When your unit ends a":"Lorsque votre unité termine un","WHEN: Any phase, when a friendly ADEPTUS ASTARTES unit embarked within a Transport is selected to move.\n\nTARGET: That ADEPTUS ASTARTES unit.\n\nEFFECT: While making that move, each model in your unit can be set up within the set-up distance of that TRANSPORT.\n\nThis allows you to set up your unit within the set-up distance of your TRANSPORT, instead of wholly within that distance.":"QUAND : N’importe quelle phase, lorsqu’une unité ADEPTUS ASTARTES alliée embarquée dans un Transport est sélectionnée pour se déplacer.\n\nCIBLE : Cette unité ADEPTUS ASTARTES.\n\nEFFET : Lors de ce déplacement, chaque figurine de votre unité peut être mise en place dans la distance de mise en place de ce TRANSPORT.\n\nCela vous permet de placer votre unité dans la distance de mise en place de votre TRANSPORT, au lieu de l’être entièrement dans cette distance.","WHEN: Any phase, when a friendly Adeptus Astartes Vehicle unit suffers a mortal wound.\n\nTARGET: That ADEPTUS ASTARTES VEHICLE unit.\n\nEFFECT: Your unit has Feel No Pain 5+ against mortal wounds.":"QUAND : N’importe quelle phase, lorsqu’une unité de véhicule ADEPTUS ASTARTES alliée subit une blessure mortelle.\n\nCIBLE : Cette unité de véhicule ADEPTUS ASTARTES.\n\nEFFET : Votre unité a Insensible à la douleur 5+ (FNP) contre les blessures mortelles.","WHEN: Any phase, when a friendly Deathwing/Ravenwing unit within range of an objective is destroyed.\n\nTARGET: That DEATHWING/RAVENWING unit. You can target that unit with this stratagem even though it is destroyed.\n\nEFFECT: Select one objective:\n• That no enemy units (excluding AIRCRAFT units) are within range of.\n• That your unit was controlling at the end of the previous phase.\n\nThat objective is secured.":"QUAND : N’importe quelle phase, lorsqu’une unité DEATHWING/RAVENWING alliée à portée d’un objectif est détruite.\n\nCIBLE : Cette unité DEATHWING/RAVENWING. Vous pouvez cibler cette unité avec ce stratagème même si elle est détruite.\n\nEFFET : Sélectionnez un objectif :\n• Aucune unité ennemie (à l’exception des unités AÉRONEFS) n’est à portée de celui-ci.\n• Que votre unité contrôlait à la fin de la phase précédente.\n\nCet objectif est sécurisé.","WHEN: Command phase.\n\nTARGET: One friendly ADEPTUS ASTARTES unit that is within range of an objective.\n\nEFFECT: Your unit has +1 OC until the end of the turn.":"QUAND : Phase de commandement.\n\nCIBLE : Une unité ADEPTUS ASTARTES alliée à portée d’un objectif.\n\nEFFET : Votre unité a +1 OC jusqu’à la fin du tour.","WHEN: Command phase.\n\nTARGET: One friendly Tacticus unit that is within range of an objective.\n\nEFFECT: Your unit has +1 OC until the end of the turn.":"QUAND : Phase de commandement.\n\nCIBLE : Une unité Tacticus alliée à portée d’un objectif.\n\nEFFET : Votre unité a +1 OC jusqu’à la fin du tour.","WHEN: End of the Fight phase.\n\nTARGET: One friendly Adeptus Astartes Mounted unit that was eligible to fight this phase.\n\nEFFECT:\n• If your unit is unengaged, your unit can make a normal move.\n• Or: If your unit is engaged, your unit can make a fall-back move.":"QUAND : Fin de la phase de combat.\n\nCIBLE : Une unité montée Adeptus Astartes alliée qui était éligible à combattre cette phase.\n\nEFFET :\n• Si votre unité n’est pas engagée, elle peut effectuer un mouvement normal.\n• Ou : si votre unité est engagée, elle peut effectuer un mouvement de repli.","WHEN: End of the Fight phase.\n\nTARGET: One friendly unengaged Adeptus Astartes Infantry unit that was eligible to fight this phase, is wholly within 6\" of a friendly Transport unit, and is eligible to embark within that TRANSPORT unit.\n\nEFFECT: Your unit embarks within that TRANSPORT unit.":"QUAND : Fin de la phase de combat.\n\nCIBLE : Une unité d’infanterie Adeptus Astartes alliée non engagée qui était éligible à combattre cette phase, qui est entièrement à 6\" ou moins d’une unité de Transport alliée et qui peut embarquer dans cette unité TRANSPORT.\n\nEFFET : Votre unité embarque dans cette unité TRANSPORT.","WHEN: End of your Movement phase.\n\nTARGET: One friendly Adeptus Astartes Transport unit that has an Adeptus Astartes Battleline unit embarked within it.\n\nEFFECT: Select one objective your unit is controlling. That objective is secured.":"QUAND : Fin de votre phase de mouvement.\n\nCIBLE : Une unité de Transport Adeptus Astartes alliée ayant une unité de ligne de bataille Adeptus Astartes à son bord.\n\nEFFET : Sélectionnez un objectif contrôlé par votre unité. Celui-ci est sécurisé.","WHEN: End of your Movement phase.\n\nTARGET: One friendly Gravis unit.\n\nEFFECT: Select one objective your unit is controlling. That objective is secured.":"QUAND : Fin de votre phase de mouvement.\n\nCIBLE : Une unité Gravis alliée.\n\nEFFET : Sélectionnez un objectif contrôlé par votre unité. Celui-ci est sécurisé.","WHEN: End of your Movement phase.\n\nTARGET: One friendly unengaged Phobos/Scout Squad unit.\n\nEFFECT: If your unit is controlling an objective, that objective is snared. While an objective is snared, when an enemy unit ends a move within range of that objective, roll one D6:\n• On a 2+, that enemy unit suffers D6 mortal wounds. \n• That objective is no longer snared.":"QUAND : Fin de votre phase de mouvement.\n\nCIBLE : Une unité Phobos/Escouade d’éclaireurs alliée non engagée.\n\nEFFET : Si votre unité contrôle un objectif, celui-ci est piégé. Tant qu’un objectif est piégé, lorsqu’une unité ennemie termine un mouvement à portée de cet objectif, lancez un D6 :\n• Sur un 2+, cette unité ennemie subit D6 blessures mortelles. \n• Cet objectif n’est plus piégé.","WHEN: End of your opponent’s Fight phase.\n\nTARGET: One friendly unengaged adeptus astartes terminator unit.\n\nEFFECT: Place your unit in strategic reserves.":"QUAND : Fin de la phase de combat de votre adversaire.\n\nCIBLE : Une unité Terminator Adeptus Astartes alliée non engagée.\n\nEFFET : Placez votre unité dans les réserves stratégiques.","WHEN: End of your opponent’s Fight phase.\n\nTARGET: One friendly unengaged Phobos/Scout SQUAD unit.\n\nEFFECT: Place your unit in strategic reserves.":"QUAND : Fin de la phase de combat de votre adversaire.\n\nCIBLE : Une unité Phobos/ESCOUADE D’ÉCLAIREURS alliée non engagée.\n\nEFFET : Placez votre unité dans les réserves stratégiques.","WHEN: Fight phase, when a friendly ADEPTUS ASTARTES unit is selected to fight.\n\nTARGET: That ADEPTUS ASTARTES unit.\n\nEFFECT: Your unit’s melee attacks have [Lance].":"QUAND : Phase de combat, lorsqu’une unité ADEPTUS ASTARTES alliée est sélectionnée pour combattre.\n\nCIBLE : Cette unité ADEPTUS ASTARTES.\n\nEFFET : Les attaques au corps à corps de votre unité ont [LANCE].","WHEN: Fight phase, when a friendly ADEPTUS ASTARTES unit is selected to fight.\n\nTARGET: That ADEPTUS ASTARTES unit.\n\nEFFECT: Your unit’s melee attacks have:\n• [Lance].\n• Or: If the assault doctrine is active for your unit, [Lance] and +1 AP.":"QUAND : Phase de combat, lorsqu’une unité ADEPTUS ASTARTES alliée est sélectionnée pour combattre.\n\nCIBLE : Cette unité ADEPTUS ASTARTES.\n\nEFFET : Les attaques au corps à corps de votre unité ont :\n• [LANCE].\n• Ou : si la doctrine d’assaut est active pour votre unité, [LANCE] et +1 AP.","WHEN: Fight phase, when a friendly Tacticus unit is selected to make a consolidation move.\n\nTARGET: That TACTICUS unit.\n\nEFFECT: When making that consolidation move, your unit can move up to D3+3\".":"QUAND : Phase de combat, lorsqu’une unité Tacticus alliée est sélectionnée pour effectuer un mouvement de régroupement.\n\nCIBLE : Cette unité TACTICUS.\n\nEFFET : Lors de ce mouvement de régroupement, votre unité peut se déplacer jusqu’à D3+3\".","WHEN: Fight phase, when an enemy unit has fought.\n\nTARGET: One friendly Tacticus unit that is within range of an objective and is eligible to fight.\n\nEFFECT: Your unit has Fights First and must be the next unit you select to fight.":"QUAND : Phase de combat, lorsqu’une unité ennemie a combattu.\n\nCIBLE : Une unité Tacticus alliée à portée d’un objectif et éligible à combattre.\n\nEFFET : Votre unité a Combat en premier (Fights First) et doit être la prochaine unité que vous sélectionnez pour combattre.","WHEN: Fight phase, when an enemy unit targets a friendly ADEPTUS ASTARTES unit.\n\nTARGET: That ADEPTUS ASTARTES unit.\n\nEFFECT: When a model in your unit is destroyed, if your unit has not been selected to fight this phase, roll one D6, with +1 to that roll if the assault doctrine is active for your unit:\n• On a 4+, do not remove that model from the battlefield. When your unit has fought, or at the end of the phase (whichever comes first), that model is removed from the battlefield.":"QUAND : Phase de combat, lorsqu’une unité ennemie cible une unité ADEPTUS ASTARTES alliée.\n\nCIBLE : Cette unité ADEPTUS ASTARTES.\n\nEFFET : Lorsqu’une figurine de votre unité est détruite, si votre unité n’a pas été sélectionnée pour combattre cette phase, lancez un D6, avec +1 à ce jet si la doctrine d’assaut est active pour votre unité :\n• Sur un 4+, ne retirez pas cette figurine du champ de bataille. Lorsque votre unité a combattu, ou à la fin de la phase (selon la première éventualité), cette figurine est retirée du champ de bataille.","WHEN: Fight phase, when an enemy unit targets a friendly ADEPTUS ASTARTES unit.\n\nTARGET: That ADEPTUS ASTARTES unit.\n\nEFFECT: When a model in your unit is destroyed, if your unit has not been selected to fight this phase, roll one D6:\n• On a 4+, do not remove that model from the battlefield. When your unit has fought, or at the end of the phase (whichever comes first), that model is removed from the battlefield.":"QUAND : Phase de combat, lorsqu’une unité ennemie cible une unité ADEPTUS ASTARTES alliée.\n\nCIBLE : Cette unité ADEPTUS ASTARTES.\n\nEFFET : Lorsqu’une figurine de votre unité est détruite, si votre unité n’a pas été sélectionnée pour combattre cette phase, lancez un D6 :\n• Sur un 4+, ne retirez pas cette figurine du champ de bataille. Lorsque votre unité a combattu, ou à la fin de la phase (selon la première éventualité), cette figurine est retirée du champ de bataille.","WHEN: Fight phase, when an enemy unit targets a friendly Deathwing unit.\n\nTARGET: That DEATHWING unit.\n\nEFFECT: When a model in your unit is destroyed, if your unit has not been selected to fight this phase, roll one D6, with +1 to that roll if your unit is engaged with an enemy unit within range of your vowed objective:\n• On a 4+, do not remove that model from the battlefield. When your unit has fought, or at the end of the phase (whichever comes first), that model is removed from the battlefield.":"QUAND : Phase de combat, lorsqu’une unité ennemie cible une unité DEATHWING alliée.\n\nCIBLE : Cette unité DEATHWING.\n\nEFFET : Lorsqu’une figurine de votre unité est détruite, si votre unité n’a pas été sélectionnée pour combattre cette phase, lancez un D6, avec +1 à ce jet si votre unité est à portée d’engagement d’une unité ennemie à portée de votre objectif voué :\n• Sur un 4+, ne retirez pas cette figurine du champ de bataille. Lorsque votre unité a combattu, ou à la fin de la phase (selon la première éventualité), cette figurine est retirée du champ de bataille.","WHEN: Start of the Fight phase.\n\nTARGET: One friendly Dreadnought unit.\n\nEFFECT: Each enemy unit engaged with your unit makes a battle-shock roll, with -1 to that battle-shock roll.":"QUAND : Début de la phase de combat.\n\nCIBLE : Une unité Dreadnought alliée.\n\nEFFET : Chaque unité ennemie à portée d’engagement de votre unité effectue un jet d’ébranlement, avec -1 à ce jet d’ébranlement.","WHEN: The Fight phase, when a friendly Adeptus Astartes unit is selected to fight.\n\nTARGET: That Adeptus Astartes unit.\n\nEFFECT: Your unit's melee attacks have [Precision].":"QUAND : La phase de combat, lorsqu’une unité Adeptus Astartes alliée est sélectionnée pour combattre.\n\nCIBLE : Cette unité Adeptus Astartes.\n\nEFFET : Les attaques au corps à corps de votre unité ont [PRÉCISION].","WHEN: Your Charge phase, when a friendly Deathwing unit ends a charge move.\n\nTARGET: That DEATHWING unit.\n\nEFFECT: Select one enemy unit engaged with your unit. If you do, roll one D6 for each model in your unit engaged with that enemy unit:\n• For each 3+, that enemy unit suffers 1 mortal wound (to a maximum of 6 mortal wounds).":"QUAND : Votre phase de charge, lorsqu’une unité DEATHWING alliée termine un mouvement de charge.\n\nCIBLE : Cette unité DEATHWING.\n\nEFFET : Sélectionnez une unité ennemie à portée d’engagement de votre unité. Si vous le faites, lancez un D6 pour chaque figurine de votre unité engagée avec cette unité ennemie :\n• Pour chaque 3+, cette unité ennemie subit 1 blessure mortelle (jusqu’à un maximum de 6 blessures mortelles).","WHEN: Your Charge phase, when a friendly Gravis unit ends a charge move.\n\nTARGET: That GRAVIS unit.\n\nEFFECT: When your unit ends a charge move, you can select one enemy unit engaged with your unit. If you do, roll one D6 for each model in your unit engaged with that enemy unit:\n• For each 3+, that enemy unit suffers 1 mortal wound.":"QUAND : Votre phase de charge, lorsqu’une unité Gravis alliée termine un mouvement de charge.\n\nCIBLE : Cette unité Gravis.\n\nEFFET : Lorsque votre unité termine un mouvement de charge, vous pouvez sélectionner une unité ennemie à portée d’engagement de votre unité. Si vous le faites, lancez un D6 pour chaque figurine de votre unité engagée avec cette unité ennemie :\n• Pour chaque 3+, cette unité ennemie subit 1 blessure mortelle.","WHEN: Your Command phase.\n\nTARGET: One friendly ADEPTUS ASTARTES unit.\n\nEFFECT: Select one combat doctrine. That combat doctrine is active for your unit until the start of your next Command phase.":"QUAND : Votre phase de commandement.\n\nCIBLE : Une unité ADEPTUS ASTARTES alliée.\n\nEFFET : Sélectionnez une doctrine de combat. Cette doctrine de combat est active pour votre unité jusqu’au début de votre prochaine phase de commandement.","WHEN: Your Command phase.\n\nTARGET: One friendly Adeptus Astartes Vehicle unit (excluding Dedicated Transport/Fly/Walker units).\n\nEFFECT: Until the start of your next Command phase, your unit can ignore modifiers to your unit’s:\n• M.\n• BS.\n• Hit rolls and wound rolls.":"QUAND : Votre phase de commandement.\n\nCIBLE : Une unité de véhicule Adeptus Astartes alliée (à l’exclusion des unités de Transport dédié/volantes/marcheuses).\n\nEFFET : Jusqu’au début de votre prochaine phase de commandement, votre unité peut ignorer les modificateurs affectant :\n• M.\n• BS.\n• Les jets pour toucher et les jets pour blesser.","WHEN: Your Command phase.\n\nTARGET: One friendly Deathwing/Ravenwing unit.\n\nEFFECT: Select one combat doctrine. That combat doctrine is active for your unit until the start of your next Command phase.":"QUAND : Votre phase de commandement.\n\nCIBLE : Une unité Deathwing/Ravenwing alliée.\n\nEFFET : Sélectionnez une doctrine de combat. Cette doctrine de combat est active pour votre unité jusqu’au début de votre prochaine phase de commandement.","WHEN: Your Movement phase, when a friendly Adeptus Astartes Mounted/Speeder unit is selected to make an advance move.\n\nTARGET: That ADEPTUS ASTARTES MOUNTED/SPEEDER unit.\n\nEFFECT: Your unit can change its advance rolls to a 6.":"QUAND : Votre phase de mouvement, lorsqu’une unité montée/speeder ADEPTUS ASTARTES alliée est sélectionnée pour effectuer un mouvement d’avance.\n\nCIBLE : Cette unité montée/speeder ADEPTUS ASTARTES.\n\nEFFET : Votre unité peut remplacer ses jets d’avance par un 6.","WHEN: Your Movement phase, when a friendly Deathwing unit with the Deep Strike ability is selected to make an ingress move.\n\nTARGET: That DEATHWING unit.\n\nEFFECT:\n• Your unit can be set up more than 6\" horizontally from all enemy units (instead of more than 8\").\n• Your unit is not eligible to declare a charge until the end of this turn.":"QUAND : Votre phase de mouvement, lorsqu’une unité DEATHWING alliée avec l’aptitude Frappe en profondeur est sélectionnée pour effectuer un mouvement d’entrée.\n\nCIBLE : Cette unité DEATHWING.\n\nEFFET :\n• Votre unité peut être mise en place à plus de 6\" horizontalement de toutes les unités ennemies (au lieu de plus de 8\").\n• Votre unité ne peut pas déclarer de charge jusqu’à la fin de ce tour.","WHEN: Your Movement/Charge phase, when a friendly Dreadnought unit is selected to move or declares a charge.\n\nTARGET: That DREADNOUGHT unit.\n\nEFFECT: Your unit has Mobile.":"QUAND : Votre phase de mouvement ou de charge, lorsqu’une unité Dreadnought alliée est sélectionnée pour se déplacer ou déclare une charge.\n\nCIBLE : Cette unité DREADNOUGHT.\n\nEFFET : Votre unité a Mobile.","WHEN: Your Movement/Charge phase, when a friendly Ravenwing unit is selected to move or declares a charge.\n\nTARGET: That RAVENWING unit.\n\nEFFECT: Your unit has Mobile.":"QUAND : Votre phase de mouvement ou de charge, lorsqu’une unité RAVENWING alliée est sélectionnée pour se déplacer ou déclare une charge.\n\nCIBLE : Cette unité RAVENWING.\n\nEFFET : Votre unité a Mobile.","WHEN: Your opponent’s Movement phase, when an enemy unit ends a move within 8\" of a friendly unengaged Adeptus Astartes Infantry/Mounted unit.\n\nTARGET: That ADEPTUS ASTARTES INFANTRY/MOUNTED unit.\n\nEFFECT: Your unit can make a normal move of up to D6\".":"QUAND : Phase de mouvement de votre adversaire, lorsqu’une unité ennemie termine un mouvement à 8\" ou moins d’une unité d’infanterie/montée ADEPTUS ASTARTES alliée non engagée.\n\nCIBLE : Cette unité d’infanterie/montée ADEPTUS ASTARTES.\n\nEFFET : Votre unité peut effectuer un mouvement normal d’au maximum D6\".","WHEN: Your opponent’s Movement phase, when an enemy unit ends a move within 8\" of a friendly unengaged Adeptus Astartes Infantry/Mounted unit.\n\nTARGET: That ADEPTUS ASTARTES INFANTRY/MOUNTED unit.\n\nEFFECT: Your unit can make a normal move of:\n• Up to D6\".\n• Or: If the tactical doctrine is active for your unit, up to 6\".":"QUAND : Phase de mouvement de votre adversaire, lorsqu’une unité ennemie termine un mouvement à 8\" ou moins d’une unité d’infanterie/montée ADEPTUS ASTARTES alliée non engagée.\n\nCIBLE : Cette unité d’infanterie/montée ADEPTUS ASTARTES.\n\nEFFET : Votre unité peut effectuer un mouvement normal de :\n• Jusqu’à D6\".\n• Ou : si la doctrine tactique est active pour votre unité, jusqu’à 6\".","WHEN: Your opponent’s Movement phase, when an enemy unit ends a move within 8\" of a friendly unengaged Phobos unit.\n\nTARGET: That PHOBOS unit.\n\nEFFECT: Your unit can make a normal move of:\n• Up to D6\".\n• Or: If the tactical doctrine is active for your unit, up to 6\".":"QUAND : Phase de mouvement de votre adversaire, lorsqu’une unité ennemie termine un mouvement à 8\" ou moins d’une unité Phobos alliée non engagée.\n\nCIBLE : Cette unité Phobos.\n\nEFFET : Votre unité peut effectuer un mouvement normal de :\n• Jusqu’à D6\".\n• Ou : si la doctrine tactique est active pour votre unité, jusqu’à 6\".","WHEN: Your opponent’s Shooting phase or the Fight phase, when an enemy unit targets a friendly adeptus astartes Terminator unit.\n\nTARGET: That ADEPTUS ASTARTES TERMINATOR unit.\n\nEFFECT: Attacks that target your unit have -1 D until that enemy unit has attacked.":"QUAND : Phase de tir de votre adversaire ou phase de combat, lorsqu’une unité ennemie cible une unité Terminator ADEPTUS ASTARTES alliée.\n\nCIBLE : Cette unité Terminator ADEPTUS ASTARTES.\n\nEFFET : Les attaques qui ciblent votre unité ont -1 D jusqu’à ce que cette unité ennemie ait attaqué.","WHEN: Your opponent’s Shooting phase or the Fight phase, when an enemy unit targets a friendly ADEPTUS ASTARTES unit.\n\nTARGET: That ADEPTUS ASTARTES unit.\n\nEFFECT: Attacks that target your unit have -1 AP until that enemy unit has attacked.":"QUAND : Phase de tir de votre adversaire ou phase de combat, lorsqu’une unité ennemie cible une unité ADEPTUS ASTARTES alliée.\n\nCIBLE : Cette unité ADEPTUS ASTARTES.\n\nEFFET : Les attaques qui ciblent votre unité ont -1 AP jusqu’à ce que cette unité ennemie ait attaqué.","WHEN: Your opponent’s Shooting phase, when an enemy unit has shot, if those attacks destroyed a model in a friendly ADEPTUS ASTARTES unit.\n\nTARGET: That ADEPTUS ASTARTES unit.\n\nEFFECT: Your unit shoots using normal shooting, but while doing so your unit can only target that enemy unit.":"QUAND : Phase de tir de votre adversaire, lorsqu’une unité ennemie a tiré, si ces attaques ont détruit une figurine dans une unité ADEPTUS ASTARTES alliée.\n\nCIBLE : Cette unité ADEPTUS ASTARTES.\n\nEFFET : Votre unité tire en utilisant le tir normal, mais ce faisant elle ne peut cibler que cette unité ennemie.","WHEN: Your opponent’s Shooting phase, when an enemy unit targets a friendly Adeptus Astartes Mounted/Speeder unit.\n\nTARGET: That ADEPTUS ASTARTES MOUNTED/SPEEDER unit.\n\nEFFECT: Ranged attacks that target your unit have -1 to hit rolls.":"QUAND : Phase de tir de votre adversaire, lorsqu’une unité ennemie cible une unité montée/speeder ADEPTUS ASTARTES alliée.\n\nCIBLE : Cette unité montée/speeder ADEPTUS ASTARTES.\n\nEFFET : Les attaques à distance qui ciblent votre unité ont -1 aux jets pour toucher.","WHEN: Your opponent’s Shooting phase, when an enemy unit targets a friendly Phobos unit.\n\nTARGET: That PHOBOS unit.\n\nEFFECT: Ranged attacks that target your unit have -1 to hit rolls.":"QUAND : Phase de tir de votre adversaire, lorsqu’une unité ennemie cible une unité Phobos alliée.\n\nCIBLE : Cette unité Phobos.\n\nEFFET : Les attaques à distance qui ciblent votre unité ont -1 aux jets pour toucher.","WHEN: Your opponent’s Shooting phase, when an enemy unit targets a friendly Ravenwing Fly/Mounted unit.\n\nTARGET: That RAVENWING FLY/MOUNTED unit.\n\nEFFECT: Your unit has Stealth.":"QUAND : Phase de tir de votre adversaire, lorsqu’une unité ennemie cible une unité volante/montée RAVENWING alliée.\n\nCIBLE : Cette unité volante/montée RAVENWING.\n\nEFFET : Votre unité a Furtivité.","WHEN: Your opponent’s Shooting phase, when an enemy unit that targeted a friendly unengaged Ravenwing Fly unit has shot.\n\nTARGET: That RAVENWING FLY unit.\n\nEFFECT: Your unit can make a normal move of up to D3+3\".":"QUAND : Phase de tir de votre adversaire, lorsqu’une unité ennemie qui a ciblé une unité volante RAVENWING alliée non engagée a tiré.\n\nCIBLE : Cette unité volante RAVENWING.\n\nEFFET : Votre unité peut effectuer un mouvement normal d’au maximum D3+3\".","WHEN: Your Shooting phase or the Fight phase, when a friendly Dreadnought unit is selected to attack.\n\nTARGET: That DREADNOUGHT unit.\n\nEFFECT: Your unit’s attacks have:\n• [lethal hits].\n• Or: [Sustained Hits 1].":"QUAND : Votre phase de tir ou la phase de combat, lorsqu’une unité Dreadnought alliée est sélectionnée pour attaquer.\n\nCIBLE : Cette unité DREADNOUGHT.\n\nEFFET : Les attaques de votre unité ont :\n• [TOUCHES FATALES].\n• Ou : [COUPS SOUTENUS 1].","WHEN: Your Shooting phase or the Fight phase, when a friendly Gravis unit is selected to attack.\n\nTARGET: That GRAVIS unit.\n\nEFFECT: Your unit’s attacks have [Lethal Hits].":"QUAND : Votre phase de tir ou la phase de combat, lorsqu’une unité Gravis alliée est sélectionnée pour attaquer.\n\nCIBLE : Cette unité GRAVIS.\n\nEFFET : Les attaques de votre unité ont [TOUCHES FATALES].","WHEN: Your Shooting phase or the Fight phase, when a friendly hidden Phobos unit is selected to attack.\n\nTARGET: That PHOBOS unit.\n\nEFFECT: Your unit’s attacks have:\n• +1 S.\n• [Lethal Hits].":"QUAND : Votre phase de tir ou la phase de combat, lorsqu’une unité Phobos alliée cachée est sélectionnée pour attaquer.\n\nCIBLE : Cette unité PHOBOS.\n\nEFFET : Les attaques de votre unité ont :\n• +1 S.\n• [TOUCHES FATALES].","WHEN: Your Shooting phase or the Fight phase, when a friendly Tacticus unit is selected to attack.\n\nTARGET: That TACTICUS unit.\n\nEFFECT: Your unit’s attacks have:\n• [Sustained Hits 1: non-Monster/Vehicle].\n• Or: [Lethal Hits: Monster/Vehicle].":"QUAND : Votre phase de tir ou la phase de combat, lorsqu’une unité Tacticus alliée est sélectionnée pour attaquer.\n\nCIBLE : Cette unité TACTICUS.\n\nEFFET : Les attaques de votre unité ont :\n• [COUPS SOUTENUS 1 : non-MONSTRE/VÉHICULE].\n• Ou : [TOUCHES FATALES : MONSTRE/VÉHICULE].","WHEN: Your Shooting phase, when a friendly Adeptus Astartes Infantry/Mounted unit is selected to shoot.\n\nTARGET: That ADEPTUS ASTARTES INFANTRY/MOUNTED unit.\n\nEFFECT: Your unit’s ranged attacks have +2 S.":"QUAND : Votre phase de tir, lorsqu’une unité d’infanterie/montée ADEPTUS ASTARTES alliée est sélectionnée pour tirer.\n\nCIBLE : Cette unité d’infanterie/montée ADEPTUS ASTARTES.\n\nEFFET : Les attaques à distance de votre unité ont +2 S.","WHEN: Your Shooting phase, when a friendly adeptus astartes Terminator unit is selected to shoot.\n\nTARGET: That ADEPTUS ASTARTES TERMINATOR unit.\n\nEFFECT: Your unit’s ranged attacks have:\n• [Lethal Hits].\n• [Sustained Hits 1].":"QUAND : Votre phase de tir, lorsqu’une unité Terminator ADEPTUS ASTARTES alliée est sélectionnée pour tirer.\n\nCIBLE : Cette unité Terminator ADEPTUS ASTARTES.\n\nEFFET : Les attaques à distance de votre unité ont :\n• [TOUCHES FATALES].\n• [COUPS SOUTENUS 1].","WHEN: Your Shooting phase, when a friendly ADEPTUS ASTARTES unit has shot.\n\nTARGET: That ADEPTUS ASTARTES unit.\n\nEFFECT: Select one enemy unit hit by those attacks. That enemy unit is suppressed until the start of your next turn:\n• While a unit is suppressed, that unit’s attacks have -1 to hit rolls.":"QUAND : Votre phase de tir, lorsqu’une unité ADEPTUS ASTARTES alliée a tiré.\n\nCIBLE : Cette unité ADEPTUS ASTARTES.\n\nEFFET : Sélectionnez une unité ennemie touchée par ces attaques. Cette unité ennemie est neutralisée jusqu’au début de votre prochain tour :\n• Tant qu’une unité est neutralisée, ses attaques ont -1 aux jets pour toucher.","WHEN: Your Shooting phase, when a friendly ADEPTUS ASTARTES unit is selected to shoot.\n\nTARGET: That ADEPTUS ASTARTES unit.\n\nEFFECT: Your unit’s ranged attacks have [IGNORES COVER].":"QUAND : Votre phase de tir, lorsqu’une unité ADEPTUS ASTARTES alliée est sélectionnée pour tirer.\n\nCIBLE : Cette unité ADEPTUS ASTARTES.\n\nEFFET : Les attaques à distance de votre unité ont [IGNORE LE COUVERT].","WHEN: Your Shooting phase, when a friendly ADEPTUS ASTARTES unit is selected to shoot.\n\nTARGET: That ADEPTUS ASTARTES unit.\n\nEFFECT: Your unit’s ranged attacks have:\n• [Ignores Cover].\n• Or: If the devastator doctrine is active for your unit, [Ignores Cover] and +1 AP.":"QUAND : Votre phase de tir, lorsqu’une unité ADEPTUS ASTARTES alliée est sélectionnée pour tirer.\n\nCIBLE : Cette unité ADEPTUS ASTARTES.\n\nEFFET : Les attaques à distance de votre unité ont :\n• [IGNORE LE COUVERT].\n• Ou : si la doctrine de dévastation est active pour votre unité, [IGNORE LE COUVERT] et +1 AP.","WHEN: Your Shooting phase, when a friendly Adeptus Astartes Vehicle unit (excluding Dedicated Transport/Fly/Walker units) is selected to shoot.\n\nTARGET: That ADEPTUS ASTARTES VEHICLE unit.\n\nEFFECT: Your unit’s ranged attacks have [Lethal Hits: Monster/Vehicle].":"QUAND : Votre phase de tir, lorsqu’une unité de véhicule ADEPTUS ASTARTES alliée (à l’exclusion des unités de Transport dédié/volantes/marcheuses) est sélectionnée pour tirer.\n\nCIBLE : Cette unité de véhicule ADEPTUS ASTARTES.\n\nEFFET : Les attaques à distance de votre unité ont [TOUCHES FATALES : MONSTRE/VÉHICULE].","WHEN: Your Shooting phase, when a friendly engaged Tacticus unit is selected to shoot.\n\nTARGET: That TACTICUS unit.\n\nEFFECT: Your unit’s ranged attacks (excluding [Blast] attacks) have:\n• [Close-Quarters].\n• [Ignores Cover].":"QUAND : Votre phase de tir, lorsqu’une unité Tacticus alliée engagée est sélectionnée pour tirer.\n\nCIBLE : Cette unité TACTICUS.\n\nEFFET : Les attaques à distance de votre unité (à l’exclusion des attaques [BLAST]) ont :\n• [CORPS À CORPS].\n• [IGNORE LE COUVERT].","WHEN: Your Shooting phase, when a friendly Gravis unit has shot.\n\nTARGET: That GRAVIS unit.\n\nEFFECT:\n• If your unit is unengaged, your unit can make a normal move of up to 5\", and must end that move within range of an objective.\n• Your unit is not eligible to declare a charge or embark within a Transport until the end of the turn.":"QUAND : Votre phase de tir, lorsqu’une unité Gravis alliée a tiré.\n\nCIBLE : Cette unité GRAVIS.\n\nEFFET :\n• Si votre unité n’est pas engagée, elle peut effectuer un mouvement normal d’au maximum 5\" et doit terminer ce mouvement à portée d’un objectif.\n• Votre unité ne peut pas déclarer de charge ni embarquer dans un Transport jusqu’à la fin du tour.","WHEN: Your Shooting phase, when a friendly Gravis unit has shot.\n\nTARGET: That GRAVIS unit.\n\nEFFECT: Select one enemy unit hit by those attacks. That enemy unit makes a battle-shock roll, with -1 to that battle-shock roll.":"QUAND : Votre phase de tir, lorsqu’une unité Gravis alliée a tiré.\n\nCIBLE : Cette unité GRAVIS.\n\nEFFET : Sélectionnez une unité ennemie touchée par ces attaques. Cette unité ennemie effectue un jet d’ébranlement, avec -1 à ce jet d’ébranlement.","WHEN: Your Shooting phase, when a friendly Ravenwing Fly unit has shot.\n\nTARGET: That RAVENWING FLY unit.\n\nEFFECT: Visible enemy units within 6\" of your unit have +3\" detection range.":"QUAND : Votre phase de tir, lorsqu’une unité volante RAVENWING alliée a tiré.\n\nCIBLE : Cette unité volante RAVENWING.\n\nEFFET : Les unités ennemies visibles à 6\" ou moins de votre unité ont une portée de détection de +3\".","Whether its true significance is kept a secret or not, there is a singular prize here that the Inner Circle have come to either secure or destroy. They will pursue this strategic objective with cold ferocity.":"Que sa véritable signification soit gardée secrète ou non, il y a ici un prix unique que le Inner Circle est venu sécuriser ou détruire. Ils poursuivront cet objectif stratégique avec une froide férocité.","While a friendly Dark Angels unit is within 6\" of this unit, that unit has Feel No Pain 5+ against psychic attacks and mortal wounds.":"Tant qu’une unité des Dark Angels amie est à 6\" ou moins de cette unité, cette unité a Insensible à la douleur 5+ (FNP) contre les attaques psychiques et les blessures mortelles.","While a friendly Dark Angels unit is within 6\" of this unit, that unit’s melee attacks can:\n• Re-roll hit rolls of 1.\n• Re-roll wound rolls of 1.":"Tant qu’une unité des Dark Angels amie est à 6\" ou moins de cette unité, les attaques au corps à corps de cette unité peuvent :\n• Relancer les jets pour toucher de 1.\n• Relancer les jets pour blesser de 1.","While a friendly Gravis unit is within range of an objective, attacks that target that unit with a S greater than that unit’s T have -1 to wound rolls.":"Tant qu’une unité Gravis alliée est à portée d’un objectif, les attaques qui ciblent cette unité avec une S supérieure à la T de cette unité ont -1 aux jets pour blesser.","While a model is affected by this ability, you can re-roll Advance rolls made for that model and ranged weapons equipped by that model have the [ASSAULT] ability.":"Tant qu’une figurine est affectée par cette aptitude, vous pouvez relancer les jets d’avance effectués pour cette figurine et les armes à distance dont elle est équipée ont l’aptitude [ASSAUT].","While making that move, each model in your unit can be set up within the":"Lors de ce déplacement, chaque figurine de votre unité peut être mise en place dans la","While this model has 1‑9 wounds remaining, subtract 5 from this model’s Objective Control characteristic and each time this model makes an attack, subtract 1 from the Hit roll.":"Tant que cette figurine a entre 1 et 9 blessures restantes, retirez 5 à sa caractéristique OC et, chaque fois qu’elle effectue une attaque, retirez 1 au jet pour toucher.","While this unit is within 3\" of a friendly Dark Angels Infantry unit, this unit has Lone Operative.":"Tant que cette unité est à 3\" ou moins d’une unité d’Infanterie des Dark Angels amie, cette unité a l’Agent solitaire.","While this unit is within range of an objective, this unit’s melee attacks have +1 A.":"Tant que cette unité est à portée d’un objectif, ses attaques au corps à corps ont +1 A.","Wielding Calibanite greatswords with breathtaking skill, wreathed in the incense smoke of their braziers of judgement, the Inner Circle Companions cut a crimson path through their foes. They are sinister warriors whether battling as ally or enemy, for they fight in silence save for the whine of their armour servos and the crunch of their blades through flesh and bone.":"Manient les grandes épées calibanites avec une habileté à couper le souffle, enveloppés de la fumée d’encens de leurs brasiers du Jugement, les Inner Circle Companions tracent un sillon cramoisi parmi leurs ennemis. Ce sont des guerriers sinistres, qu’ils combattent comme alliés ou comme ennemis, car ils ne rompent le silence que pour le sifflement des servo-moteurs de leur armure et le craquement de leurs lames dans la chair et les os.","WIND-SWIFT EVASION":"ÉVASION RAPIDE COMME LE VENT","WINGS OF SHADOW":"AILES D’OMBRE","With their plan in motion and targets designated, Gravis-armoured warriors stride unstoppably into battle as they lay down withering hails of firepower.":"Leur plan en mouvement et leurs cibles désignées, les guerriers en armure Gravis avancent irrésistiblement au combat en déversant des déluges de feu dévastateurs.","Within range of an objective":"À portée d’un objectif","Wolf Guard Battle Leader":"Wolf Guard Battle Leader","Wolf Priest":"Wolf Priest","Wrath of the Chapter":"Courroux du chapitre","WRATH OF THE LION":"COURROUX DU LION","Wrath of the Rock":"Wrath of the Rock","Wrath of the Rock Stratagem":"Stratagème Wrath of the Rock","You can attach this model to one of the above units even if one CAPTAIN, CHAPTER MASTER or LIEUTENANT model has already been attached to it.":"Vous pouvez attacher cette figurine à l’une des unités ci-dessus même si une figurine CAPITAINE, MAÎTRE DE CHAPITRE ou LIEUTENANT y est déjà attachée.","You can attach this model to one of the above units even if one CAPTAIN, CHAPTER MASTER or LIEUTENANT model has already been attached to it. If you do, and that Bodyguard unit is destroyed, the Leader units attached to it become separate units, with their original Starting Strengths.":"Vous pouvez attacher cette figurine à l’une des unités ci-dessus même si une figurine CAPITAINE, MAÎTRE DE CHAPITRE ou LIEUTENANT y est déjà attachée. Si vous le faites et que cette unité Bodyguard est détruite, les unités Leader qui lui sont attachées deviennent des unités distinctes, avec leurs effectifs initiaux respectifs.","You can select one combat doctrine one additional time per battle.":"Vous pouvez sélectionner une doctrine de combat une fois supplémentaire par bataille.","You can select the assault doctrine one additional time per battle.":"Vous pouvez sélectionner la doctrine d’assaut une fois supplémentaire par bataille.","You can select the devastator doctrine one additional time per battle.":"Vous pouvez sélectionner la doctrine de dévastation une fois supplémentaire par bataille.","You can select the tactical doctrine one additional time per battle.":"Vous pouvez sélectionner la doctrine tactique une fois supplémentaire par bataille.","YOUR 1ST TO 2ND UNITS COST":"COÛT DE VOS 1RE ET 2E UNITÉS","YOUR 3RD+ UNIT COSTS":"COÛT DE VOTRE 3E UNITÉ ET SUIVANTES","Your Charge phase, when a friendly Deathwing unit ends a charge move.":"Votre phase de charge, lorsqu’une unité Deathwing alliée termine un mouvement de charge.","Your Charge phase, when a friendly Gravis unit ends a charge move.":"Votre phase de charge, lorsqu’une unité Gravis alliée termine un mouvement de charge.","Your Command phase":"Votre phase de commandement","Your Command phase.":"Votre phase de commandement.","Your Movement phase":"Votre phase de mouvement","Your Movement phase, when a friendly Adeptus Astartes Mounted/Speeder unit is selected to make an advance move.":"Votre phase de mouvement, lorsqu’une unité montée/speeder Adeptus Astartes alliée est sélectionnée pour effectuer un mouvement d’avance.","Your Movement phase, when a friendly Deathwing unit with the Deep Strike ability is selected to make an ingress move.":"Votre phase de mouvement, lorsqu’une unité Deathwing alliée avec l’aptitude Frappe en profondeur est sélectionnée pour effectuer un mouvement d’entrée.","Your Movement/Charge phase, when a friendly Dreadnought unit is selected to move or declares a charge.":"Votre phase de mouvement ou de charge, lorsqu’une unité Dreadnought alliée est sélectionnée pour se déplacer ou déclare une charge.","Your Movement/Charge phase, when a friendly Ravenwing unit is selected to move or declares a charge.":"Votre phase de mouvement ou de charge, lorsqu’une unité Ravenwing alliée est sélectionnée pour se déplacer ou déclare une charge.","Your opponent’s Movement phase, when an enemy unit ends a move within 8\" of a friendly unengaged Adeptus Astartes Infantry/Mounted unit.":"Phase de mouvement de votre adversaire, lorsqu’une unité ennemie termine un mouvement à 8\" ou moins d’une unité d’infanterie/montée Adeptus Astartes alliée non engagée.","Your opponent’s Movement phase, when an enemy unit ends a move within 8\" of a friendly unengaged Phobos unit.":"Phase de mouvement de votre adversaire, lorsqu’une unité ennemie termine un mouvement à 8\" ou moins d’une unité Phobos alliée non engagée.","Your opponent’s Shooting phase or the Fight phase, when an enemy unit targets a friendly adeptus astartes Terminator unit.":"Phase de tir de votre adversaire ou phase de combat, lorsqu’une unité ennemie cible une unité Terminator Adeptus Astartes alliée.","Your opponent’s Shooting phase or the Fight phase, when an enemy unit targets a friendly ADEPTUS ASTARTES unit.":"Phase de tir de votre adversaire ou phase de combat, lorsqu’une unité ennemie cible une unité ADEPTUS ASTARTES alliée.","Your opponent’s Shooting phase, when an enemy unit has shot, if those attacks destroyed a model in a friendly ADEPTUS ASTARTES unit.":"Phase de tir de votre adversaire, lorsqu’une unité ennemie a tiré, si ces attaques ont détruit une figurine dans une unité ADEPTUS ASTARTES alliée.","Your opponent’s Shooting phase, when an enemy unit targets a friendly Adeptus Astartes Mounted/Speeder unit.":"Phase de tir de votre adversaire, lorsqu’une unité ennemie cible une unité montée/speeder Adeptus Astartes alliée.","Your opponent’s Shooting phase, when an enemy unit targets a friendly Phobos unit.":"Phase de tir de votre adversaire, lorsqu’une unité ennemie cible une unité Phobos alliée.","Your opponent’s Shooting phase, when an enemy unit targets a friendly Ravenwing Fly/Mounted unit.":"Phase de tir de votre adversaire, lorsqu’une unité ennemie cible une unité volante/montée Ravenwing alliée.","Your opponent’s Shooting phase, when an enemy unit that targeted a friendly unengaged Ravenwing Fly unit has shot.":"Phase de tir de votre adversaire, lorsqu’une unité ennemie qui a ciblé une unité volante Ravenwing alliée non engagée a tiré.","Your Shooting phase or the Fight phase, when a friendly Dreadnought unit is selected to attack.":"Votre phase de tir ou la phase de combat, lorsqu’une unité Dreadnought alliée est sélectionnée pour attaquer.","Your Shooting phase or the Fight phase, when a friendly Gravis unit is selected to attack.":"Votre phase de tir ou la phase de combat, lorsqu’une unité Gravis alliée est sélectionnée pour attaquer.","Your Shooting phase or the Fight phase, when a friendly hidden Phobos unit is selected to attack.":"Votre phase de tir ou la phase de combat, lorsqu’une unité Phobos alliée cachée est sélectionnée pour attaquer.","Your Shooting phase or the Fight phase, when a friendly Tacticus unit is selected to attack.":"Votre phase de tir ou la phase de combat, lorsqu’une unité Tacticus alliée est sélectionnée pour attaquer.","Your Shooting phase, when a friendly Adeptus Astartes Infantry/Mounted unit is selected to shoot.":"Votre phase de tir, lorsqu’une unité d’infanterie/montée Adeptus Astartes alliée est sélectionnée pour tirer.","Your Shooting phase, when a friendly adeptus astartes Terminator unit is selected to shoot.":"Votre phase de tir, lorsqu’une unité Terminator Adeptus Astartes alliée est sélectionnée pour tirer.","Your Shooting phase, when a friendly ADEPTUS ASTARTES unit has shot.":"Votre phase de tir, lorsqu’une unité ADEPTUS ASTARTES alliée a tiré.","Your Shooting phase, when a friendly ADEPTUS ASTARTES unit is selected to shoot.":"Votre phase de tir, lorsqu’une unité ADEPTUS ASTARTES alliée est sélectionnée pour tirer.","Your Shooting phase, when a friendly Adeptus Astartes Vehicle unit (excluding Dedicated Transport/Fly/Walker units) is selected to shoot.":"Votre phase de tir, lorsqu’une unité de véhicule Adeptus Astartes alliée (à l’exclusion des unités de Transport dédié/volantes/marcheuses) est sélectionnée pour tirer.","Your Shooting phase, when a friendly engaged Tacticus unit is selected to shoot.":"Votre phase de tir, lorsqu’une unité Tacticus alliée engagée est sélectionnée pour tirer.","Your Shooting phase, when a friendly Gravis unit has shot.":"Votre phase de tir, lorsqu’une unité Gravis alliée a tiré.","Your Shooting phase, when a friendly Ravenwing Fly unit has shot.":"Votre phase de tir, lorsqu’une unité volante Ravenwing alliée a tiré.","Your turn":"Votre tour","Your unit can change its advance rolls to a 6.":"Votre unité peut remplacer ses jets d’avance par un 6.","Your unit can make a normal move of up to D3+3\".":"Votre unité peut effectuer un mouvement normal d’au maximum D3+3\".","Your unit can make a normal move of up to D6\".":"Votre unité peut effectuer un mouvement normal d’au maximum D6\".","Your unit can make a normal move of:\n• Up to D6\".\n• Or: If the tactical doctrine is active for your unit, up to 6\".":"Votre unité peut effectuer un mouvement normal de :\n• Jusqu’à D6\".\n• Ou : si la doctrine tactique est active pour votre unité, jusqu’à 6\".","YOUR UNIT COSTS":"COÛT DE VOTRE UNITÉ","Your unit embarks within that TRANSPORT unit.":"Votre unité embarque dans cette unité TRANSPORT.","Your unit has +1":"Votre unité a +1","Your unit has Feel No Pain 5+ against":"Votre unité a Insensible à la douleur 5+ (FNP) contre","Your unit has Fights First and must be the next unit you select to fight.":"Votre unité a Combat en premier (Fights First) et doit être la prochaine unité que vous sélectionnez pour combattre.","Your unit has Mobile.":"Votre unité a Mobile.","Your unit has Stealth.":"Votre unité a Furtivité.","Your unit shoots using normal shooting, but while doing so your unit can only target that enemy unit.":"Votre unité tire en utilisant le tir normal, mais ce faisant elle ne peut cibler que cette unité ennemie.","Your unit’s attacks have [Lethal Hits].":"Les attaques de votre unité ont [TOUCHES FATALES].","Your unit’s attacks have:\n• [lethal hits].\n• Or: [Sustained Hits 1].":"Les attaques de votre unité ont :\n• [TOUCHES FATALES].\n• Ou : [COUPS SOUTENUS 1].","Your unit’s attacks have:\n• [Sustained Hits 1: non-Monster/Vehicle].\n• Or: [Lethal Hits: Monster/Vehicle].":"Les attaques de votre unité ont :\n• [COUPS SOUTENUS 1 : non-MONSTRE/VÉHICULE].\n• Ou : [TOUCHES FATALES : MONSTRE/VÉHICULE].","Your unit’s attacks have:\n• +1":"Les attaques de votre unité ont :\n• +1","Your unit’s melee attacks have [Lance].":"Les attaques au corps à corps de votre unité ont [LANCE].","Your unit's melee attacks have [Precision].":"Les attaques au corps à corps de votre unité ont [PRÉCISION].","Your unit’s melee attacks have:\n• [Lance].\n• Or: If the assault doctrine is active for your unit, [Lance] and +1":"Les attaques au corps à corps de votre unité ont :\n• [LANCE].\n• Ou : si la doctrine d’assaut est active pour votre unité, [LANCE] et +1","Your unit’s ranged attacks (excluding [Blast] attacks) have:\n• [Close-Quarters].\n• [Ignores Cover].":"Les attaques à distance de votre unité (à l’exclusion des attaques [BLAST]) ont :\n• [CORPS À CORPS].\n• [IGNORE LE COUVERT].","Your unit’s ranged attacks have [IGNORES COVER].":"Les attaques à distance de votre unité ont [IGNORE LE COUVERT].","Your unit’s ranged attacks have [Lethal Hits: Monster/Vehicle].":"Les attaques à distance de votre unité ont [TOUCHES FATALES : MONSTRE/VÉHICULE].","Your unit’s ranged attacks have +2":"Les attaques à distance de votre unité ont +2","Your unit’s ranged attacks have:\n• [Ignores Cover].\n• Or: If the devastator doctrine is active for your unit, [Ignores Cover] and +1":"Les attaques à distance de votre unité ont :\n• [IGNORE LE COUVERT].\n• Ou : si la doctrine de dévastation est active pour votre unité, [IGNORE LE COUVERT] et +1","Your unit’s ranged attacks have:\n• [Lethal Hits].\n• [Sustained Hits 1].":"Les attaques à distance de votre unité ont :\n• [TOUCHES FATALES].\n• [COUPS SOUTENUS 1]."}}}};</script>
<script id="app-code">(function () {
  'use strict';

  var boot = window.__BOOT__ || {};
  var rules = boot.rules || { detachments: [], datasheets: [], meta: {} };
  var overrides = boot.overrides || { leaders: [], options: {}, points: {}, capLimits: {} };

  var STORAGE_KEY = 'ap40k.list.v1';
  var localMode = location.protocol === 'file:';
  // The active service worker owns this cache name; keep writing to it after a
  // data update so the refreshed files survive an offline reload.
  var CACHE_NAME = 'ap40k-' + String((rules.meta && rules.meta.hashSha256) || '').slice(0, 12);

  var state = {
    detachmentId: null,
    editingIndex: -1,
    configs: {},
    entries: [],
    enhancements: [],
    warlordKey: '',
    search: ''
  };

  /* ---------------------------------------------------------------- *
   * Small DOM toolkit — every data string goes through textContent.
   * ---------------------------------------------------------------- */

  var ALLOWED_ATTR = /^(id|role|aria-[a-z-]+|data-[a-z-]+|name|type|value|checked|disabled|readonly|placeholder|title|lang|href|target|rel|min|max|step|colspan|tabindex|autocomplete)$/;

  function el(tag, opts, children) {
    var node = document.createElement(tag);
    var o = opts || {};
    if (o.className) node.className = o.className;
    if (o.text !== undefined && o.text !== null) node.textContent = String(o.text);
    if (o.attrs) {
      Object.keys(o.attrs).forEach(function (k) {
        var v = o.attrs[k];
        if (v === null || v === undefined || v === false || !ALLOWED_ATTR.test(k)) return;
        if (k === 'href' && !/^\/#/.test(String(v))) return;
        node.setAttribute(k, String(v));
      });
    }
    var list = Array.isArray(children) ? children : [children];
    list.forEach(function (child) {
      if (child === null || child === undefined || child === false) return;
      if (child && typeof child === 'object' && child.nodeType) node.appendChild(child);
      else node.appendChild(document.createTextNode(String(child)));
    });
    if (o.value !== undefined) node.value = String(o.value);
    if (o.on) {
      Object.keys(o.on).forEach(function (evt) { node.addEventListener(evt, o.on[evt]); });
    }
    return node;
  }

  function clear(node) {
    while (node && node.firstChild) node.removeChild(node.firstChild);
  }

  function norm(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[\u2019\u2018\u02bc`\u00b4']/g, '')
      .replace(/œ/gi, 'oe')
      .replace(/æ/gi, 'ae')
      .replace(/\s+/g, '')
      .toLowerCase()
      .trim();
  }

  function key(value) {
    return norm(value).replace(/[^a-z0-9]+/g, ' ').trim();
  }

  // Display-only translation layer. Source strings stay untouched: ids, weapon
  // matching and the canonical snapshot hash all rely on the original English.
  function tf(value) {
    if (typeof value !== 'string') return value;
    var layer = (overrides && overrides.translations && overrides.translations.strings) || {};
    return Object.prototype.hasOwnProperty.call(layer, value) ? layer[value] : value;
  }

  // Wahapedia names multi-profile weapons "Weapon - Mode" while an option only
  // names the weapon. Accept that trailing qualifier, never a bare substring:
  // removing "Flamer" must not also remove "Hand Flamer".
  var PROFILE_MODES = /^(standard|supercharge|strike|sweep)$/;

  function matchName(a, b) {
    var x = key(a);
    var y = key(b);
    if (!x || !y) return false;
    if (x === y) return true;
    var long = x.length >= y.length ? x : y;
    var short = x.length >= y.length ? y : x;
    if (long.indexOf(short) !== 0) return false;
    var qualifier = long.slice(short.length).trim();
    return Boolean(qualifier) && PROFILE_MODES.test(qualifier);
  }

  function makeKey() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ---------------------------------------------------------------- *
   * Indexes and rules engine
   * ---------------------------------------------------------------- */

  var sheetIndex = {};
  var detachmentIndex = {};
  var leaderIndex = {};

  function rebuildIndexes() {
    sheetIndex = {};
    detachmentIndex = {};
    leaderIndex = {};
    rules.datasheets.forEach(function (s) { sheetIndex[s.id] = s; });
    rules.detachments.forEach(function (d) { detachmentIndex[d.id] = d; });
    (overrides.leaders || []).forEach(function (l) { leaderIndex[l.id] = l; });
  }
  rebuildIndexes();

  function sheetById(id) { return sheetIndex[String(id)] || null; }
  function detachmentById(id) { return detachmentIndex[String(id)] || null; }
  function leaderById(id) { return leaderIndex[String(id)] || null; }

  function groupList(sheetId) {
    return ((overrides.options || {})[sheetId] || {}).groups || [];
  }

  function availableSizes(sheet) {
    var seen = {};
    var out = [];
    (sheet.costs || []).forEach(function (c) {
      if (c.cost === null || c.cost === undefined) return;
      var m = String(c.text || '').match(/^(\d+)\s+models?$/i);
      if (!m) return;
      var n = Number(m[1]);
      if (!seen[n]) { seen[n] = true; out.push(n); }
    });
    return out.length ? out.sort(function (a, b) { return a - b; }) : [1];
  }

  function baseCost(sheet, size) {
    var entries = (sheet.costs || []).filter(function (c) {
      return c.cost !== null && c.cost !== undefined && /^\d+\s+models?$/i.test(String(c.text || ''));
    });
    var exact = entries.find(function (c) {
      return Number(String(c.text).match(/\d+/)[0]) === Number(size);
    });
    if (exact) return exact.cost;
    return entries.length ? entries[0].cost : 0;
  }

  function effectiveMax(group, size) {
    if (group.maxTakesPerModels) {
      return Math.min(group.max || 99, Math.floor(size / group.maxTakesPerModels));
    }
    var cap = group.maxTakes !== undefined ? group.maxTakes : group.max;
    return Math.max(0, Math.min(group.max || 99, cap === undefined ? group.max || 1 : cap));
  }

  // Drop unknown ids and orphaned requirements, order requirements before
  // their dependents, then apply the cap without separating a pair.
  function limitChoices(group, size, ids) {
    var known = {};
    var valid = {};
    var list = (Array.isArray(ids) ? ids : []).filter(function (id) {
      var choice = group.choices.find(function (c) { return c.id === id; });
      if (!choice) return false;
      known[id] = choice;
      valid[id] = true;
      return true;
    });
    var changed = true;
    while (changed) {
      changed = false;
      list = list.filter(function (id) {
        var missing = (known[id].requires || []).some(function (req) { return !valid[req]; });
        if (!missing) return true;
        delete valid[id];
        changed = true;
        return false;
      });
    }
    var depths = {};
    function depthOf(id, path) {
      if (path.indexOf(id) !== -1) return 0;
      if (depths[id] !== undefined) return depths[id];
      var reqs = (known[id].requires || []).filter(function (req) { return Boolean(known[req]); });
      var depth = reqs.length
        ? 1 + Math.max.apply(null, reqs.map(function (req) { return depthOf(req, path.concat(id)); }))
        : 0;
      depths[id] = depth;
      return depth;
    }
    // Array#sort is stable in modern engines: equal depths keep user order.
    list.sort(function (a, b) { return depthOf(a, []) - depthOf(b, []); });
    var max = effectiveMax(group, size);
    var kept = [];
    list.forEach(function (id) {
      if (kept.length >= max) return;
      if ((known[id].requires || []).some(function (req) { return kept.indexOf(req) === -1; })) return;
      kept.push(id);
    });
    return kept;
  }

  function defaultConfig(sheetId) {
    var sheet = sheetById(sheetId);
    var sizes = availableSizes(sheet);
    var cfg = { sheetId: sheetId, size: sizes[0], options: {}, leaders: [] };
    groupList(sheetId).forEach(function (g) {
      var def = g.choices.find(function (c) { return c.id === 'default'; });
      cfg.options[g.id] = def ? [def.id] : [];
    });
    return cfg;
  }

  function dedupeLeaders(ids) {
    var used = {};
    return ids.filter(function (id) {
      var leader = leaderById(id);
      if (!leader || used[leader.kind]) return false;
      used[leader.kind] = true;
      return true;
    });
  }

  function sanitizeConfig(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var sheet = sheetById(raw.sheetId);
    if (!sheet) return null;
    var sizes = availableSizes(sheet);
    var size = sizes.indexOf(Number(raw.size)) !== -1 ? Number(raw.size) : sizes[0];
    var cfg = { sheetId: sheet.id, size: size, options: {}, leaders: [] };
    groupList(sheet.id).forEach(function (g) {
      cfg.options[g.id] = limitChoices(g, size, raw.options && raw.options[g.id]);
    });
    var ids = Array.isArray(raw.leaders) ? raw.leaders : [];
    cfg.leaders = dedupeLeaders(ids.filter(function (id) { return Boolean(leaderById(id)); }));
    return cfg;
  }

  function computeSheet(sheetId, config) {
    var sheet = sheetById(sheetId);
    if (!sheet) return null;
    var weapons = (sheet.weapons || []).map(function (w) { return Object.assign({}, w); });
    var added = [];
    var removed = [];

    groupList(sheetId).forEach(function (g) {
      (config.options[g.id] || []).forEach(function (id) {
        var choice = g.choices.find(function (c) { return c.id === id; });
        if (!choice) return;
        (choice.removes || []).forEach(function (name) {
          weapons = weapons.filter(function (w) {
            if (matchName(w.name, name)) { removed.push(w.name); return false; }
            return true;
          });
        });
        (choice.grants || []).forEach(function (name) {
          // Report the choice even when its profile already exists in the table
          // (starting loadout): the user still needs the visual confirmation.
          added.push(name);
          if (!choice.duplicate && weapons.some(function (w) { return matchName(w.name, name); })) return;
          var src = (sheet.weapons || []).find(function (w) { return matchName(w.name, name); });
          weapons.push(src
            ? Object.assign({}, src, { name: name })
            : { name: name, description: '', range: '', type: '', A: '', BS_WS: '', S: '', AP: '', D: '' });
          added.push(name);
        });
      });
    });

    var extra = 0;
    groupList(sheetId).forEach(function (g) {
      (config.options[g.id] || []).forEach(function (id) {
        var c = g.choices.find(function (x) { return x.id === id; });
        if (!c) return;
        extra += (c.cost || 0) * (c.costMode === 'perModel' ? config.size : 1);
      });
    });

    var bonuses = [];
    config.leaders.forEach(function (id) {
      var leader = leaderById(id);
      if (!leader) return;
      (leader.bonuses || []).forEach(function (b) {
        bonuses.push({
          leader: leader.name,
          name: b.name,
          text: b.text,
          condition: b.condition || ''
        });
      });
    });

    var unitPoints = baseCost(sheet, config.size) + extra;
    var leaderTotal = config.leaders.reduce(function (sum, id) {
      var leaderSheet = sheetById(id);
      return sum + (leaderSheet ? baseCost(leaderSheet, 1) : 0);
    }, 0);

    return {
      weapons: weapons,
      added: added,
      removed: removed,
      unitPoints: unitPoints,
      leaderTotal: leaderTotal,
      total: unitPoints + leaderTotal,
      bonuses: bonuses
    };
  }

  function leaderCandidates(sheetId, kind) {
    return (overrides.leaders || []).filter(function (l) {
      return l.kind === kind && (l.leadsTo || []).indexOf(sheetId) !== -1;
    });
  }

  /* ---------------------------------------------------------------- *
   * Persistence (validated, debounced, fault-tolerant)
   * ---------------------------------------------------------------- */

  var saveTimer = null;

  function flushSave() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        schemaVersion: 1,
        detachmentId: state.detachmentId,
        entries: state.entries,
        enhancements: state.enhancements,
        warlordKey: state.warlordKey,
        configs: state.configs
      }));
    } catch (e) {
      showToast('Sauvegarde locale indisponible');
    }
  }

  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 200);
  }

  function loadSaved() {
    var raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return; }
    if (!raw) return;
    try {
      var data = JSON.parse(raw);
      if (!data || data.schemaVersion !== 1) return;
      state.detachmentId = detachmentById(data.detachmentId) ? data.detachmentId : null;
      var entries = Array.isArray(data.entries) ? data.entries : [];
      state.entries = entries.slice(0, 100).map(function (e) {
        var cfg = sanitizeConfig(e && e.config);
        if (!cfg) return null;
        var qty = Number(e.qty);
        return {
          key: String(e.key || makeKey()),
          sheetId: cfg.sheetId,
          qty: Math.min(20, Math.max(1, Number.isFinite(qty) ? qty : 1)),
          config: cfg
        };
      }).filter(Boolean);
      var enh = Array.isArray(data.enhancements) ? data.enhancements : [];
      state.enhancements = enh.map(function (e) {
        var found = findEnhancement(e && e.id);
        return found ? { id: found.id, detachmentId: found.detachmentId, name: found.name, cost: found.cost } : null;
      }).filter(Boolean);
      state.warlordKey = typeof data.warlordKey === 'string' ? data.warlordKey : '';
      state.configs = {};
      Object.keys(data.configs || {}).forEach(function (id) {
        var cfg = sanitizeConfig(data.configs[id]);
        if (cfg && cfg.sheetId === id) state.configs[id] = cfg;
      });
    } catch (e) {
      // Corrupt or hostile localStorage: keep a clean default state.
    }
  }

  function findEnhancement(id) {
    var found = null;
    rules.detachments.some(function (d) {
      var hit = (d.enhancements || []).find(function (x) { return x.id === id; });
      if (hit) { found = Object.assign({ detachmentId: d.id }, hit); return true; }
      return false;
    });
    return found;
  }

  /* ---------------------------------------------------------------- *
   * Routing + shell
   * ---------------------------------------------------------------- */

  function route() {
    var raw = location.hash.replace(/^#\/?/, '');
    var parts = raw.split('/').filter(Boolean);
    if (parts[0] === 'datasheets') return { view: 'datasheets', id: parts[1] || null };
    if (parts[0] === 'detachements') return { view: 'detachements', id: parts[1] || null };
    if (parts[0] === 'liste') return { view: 'liste', id: null };
    return { view: 'detachements', id: null };
  }

  function go(view, id) {
    location.hash = '#/' + view + (id ? '/' + encodeURIComponent(id) : '');
  }

  var TABS = [
    { view: 'detachements', icon: '\u25c6', label: 'Détachements' },
    { view: 'datasheets', icon: '\u2630', label: 'Datasheets' },
    { view: 'liste', icon: '\u2611', label: 'Ma liste' }
  ];

  function showToast(message) {
    var app = document.getElementById('app');
    if (!app) return;
    var old = document.getElementById('toast-node');
    if (old) old.parentNode.removeChild(old);
    var node = el('div', {
      className: 'toast',
      text: String(message),
      attrs: { id: 'toast-node', role: 'status' }
    });
    app.appendChild(node);
    setTimeout(function () {
      if (node.parentNode) node.parentNode.removeChild(node);
    }, 3200);
  }

  function renderHeader() {
    var btn = el('button', {
      className: 'icon-btn',
      text: 'Mettre à jour',
      attrs: { type: 'button', title: localMode ? 'Indisponible en mode fichier local' : 'Recharger rules.json et overrides.json' },
      on: { click: updateRules }
    });
    if (localMode) btn.disabled = true;
    return el('header', { className: 'app-header' }, [
      el('div', { className: 'brand' }, [
        el('span', { text: 'AP40K' }),
        el('small', { text: 'Space Marines · 11e édition' })
      ]),
      el('div', { className: 'header-spacer' }),
      btn
    ]);
  }

  function renderTabs(active) {
    var bar = el('nav', { className: 'tabbar', attrs: { role: 'tablist', 'aria-label': 'Navigation principale' } });
    TABS.forEach(function (tab, i) {
      var selected = tab.view === active;
      var btn = el('button', {
        attrs: {
          type: 'button',
          id: 'tab-' + tab.view,
          role: 'tab',
          'aria-selected': selected ? 'true' : 'false',
          'aria-controls': 'main-content',
          tabindex: selected ? '0' : '-1'
        },
        on: {
          click: function () { go(tab.view); },
          keydown: function (ev) {
            if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
            ev.preventDefault();
            var next = (i + (ev.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
            go(TABS[next].view);
            var tabs = bar.querySelectorAll('[role="tab"]');
            if (tabs[next]) tabs[next].focus();
          }
        }
      }, [
        el('span', { className: 'tab-icon', text: tab.icon }),
        el('span', { text: tab.label })
      ]);
      bar.appendChild(btn);
    });
    return bar;
  }

  function backButton(view) {
    return el('button', {
      className: 'ghost back-btn',
      text: '‹ Retour',
      attrs: { type: 'button' },
      on: { click: function () { go(view); } }
    });
  }

  function render() {
    var app = document.getElementById('app');
    clear(app);
    var r = route();
    // Editing is scoped to one entry on one sheet: leaving that sheet cancels it.
    if (state.editingIndex >= 0) {
      var editing = state.entries[state.editingIndex];
      if (!editing || r.view !== 'datasheets' || r.id !== editing.sheetId) state.editingIndex = -1;
    }
    app.appendChild(renderHeader());
    var main = el('main');
    // Keep the main landmark and put the tabpanel role on a real child.
    var panel = el('div', {
      attrs: {
        id: 'main-content',
        role: 'tabpanel',
        tabindex: '0',
        'aria-labelledby': 'tab-' + r.view
      }
    });
    // Attach before view renderers: they resolve their containers via getElementById.
    main.appendChild(panel);
    app.appendChild(main);
    if (r.view === 'detachements') {
      if (r.id && detachmentById(r.id)) renderDetachmentDetail(panel, detachmentById(r.id));
      else renderDetachmentList(panel);
    } else if (r.view === 'datasheets') {
      if (r.id && sheetById(r.id)) renderSheetDetail(panel, sheetById(r.id));
      else renderSheetList(panel);
    } else {
      renderListView(panel);
    }
    app.appendChild(renderTabs(r.view));
    app.appendChild(el('div', {
      className: 'footnote',
      text: 'Projet fan made non affilié à Games Workshop · ' + (rules.meta.attribution || 'Powered by Wahapedia') +
        ' · Snapshot ' + (rules.meta.sourceVersion || '') + (localMode ? ' · Mode fichier local (hors ligne, sans mise à jour)' : '')
    }));
  }
