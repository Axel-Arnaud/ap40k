<title>Ap40k — Compagnon Space Marines</title>

<style id="app-styles">:root {
  color-scheme: dark;
  --bg: #0b0f14;
  --bg-2: #121922;
  --card: #18212c;
  --card-2: #202b38;
  --line: #2e3b4b;
  --text: #e9eef5;
  --muted: #9dabbb;
  --accent: #f0b429;
  --accent-2: #55b8e8;
  --good: #6fd08c;
  --danger: #f0736b;
  --radius: 14px;
  --tap: 44px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

button, input, select, textarea {
  font: inherit;
  color: inherit;
}

button, select, input[type="search"] {
  min-height: var(--tap);
}

button {
  border: 1px solid var(--line);
  background: var(--card-2);
  border-radius: 10px;
  padding: 8px 14px;
  cursor: pointer;
  touch-action: manipulation;
}
button:hover { border-color: var(--accent); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .45; cursor: not-allowed; }

button.primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #1a1305;
  font-weight: 700;
}
button.ghost { background: transparent; }
button.danger { border-color: var(--danger); color: var(--danger); }

input[type="search"], input[type="text"], select, textarea {
  width: 100%;
  min-height: var(--tap);
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 9px 12px;
}
textarea { min-height: 130px; font-family: ui-monospace, monospace; font-size: 13px; }

:focus-visible {
  outline: 3px solid var(--accent-2);
  outline-offset: 2px;
}

.app-header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background: rgba(11, 15, 20, .96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
}
.brand { font-weight: 800; letter-spacing: .5px; color: var(--accent); font-size: 18px; }
.brand small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); letter-spacing: 0; }
.header-spacer { flex: 1; }
.icon-btn { min-width: var(--tap); padding: 8px 10px; font-size: 13px; }

main {
  padding: 14px 14px calc(96px + env(safe-area-inset-bottom));
  max-width: 780px;
  margin: 0 auto;
}

.tabbar {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  background: rgba(11, 15, 20, .97);
  border-top: 1px solid var(--line);
}
.tabbar button {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 56px;
  background: transparent;
  border-color: transparent;
  color: var(--muted);
  font-size: 12px;
}
.tabbar button .tab-icon { font-size: 18px; line-height: 1; }
.tabbar button[aria-selected="true"] {
  color: var(--accent);
  background: var(--card);
  border-color: var(--line);
}

h1 { font-size: 22px; margin: 4px 0 12px; }
h2 { font-size: 17px; margin: 22px 0 10px; color: var(--accent); }
h3 { font-size: 15px; margin: 16px 0 8px; }
p { margin: 8px 0; }

.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11px; }
.center { text-align: center; }
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spread { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.stack { display: grid; gap: 10px; }
.grow { flex: 1; }

.search-wrap { position: relative; margin: 4px 0 14px; }
.search-wrap input { padding-left: 38px; }
.search-wrap .mag { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px;
  margin-bottom: 10px;
}
.card.tappable { cursor: pointer; }
.card.tappable:hover { border-color: var(--accent); }
.card-title { font-weight: 700; font-size: 16px; }
.card-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--bg-2);
  color: var(--muted);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .4px;
  white-space: nowrap;
}
.badge.sm { background: var(--accent); border-color: var(--accent); color: #1a1305; }
.badge.da { background: #25415e; border-color: #3f6d99; color: #d9ecff; }
.badge.ki { background: #4a3220; border-color: #7a5330; color: #ffe4c2; }
.badge.support { background: #2c4638; border-color: #42775a; color: #d6f5e2; }

.points {
  display: inline-flex;
  align-items: baseline;
  gap: 5px;
  padding: 5px 10px;
  border-radius: 999px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}
.points b { color: var(--accent); font-size: 18px; }

.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 20px 0 8px;
  font-weight: 700;
  color: var(--accent);
}
.section-title::after { content: ""; flex: 1; height: 1px; background: var(--line); }

.statgrid {
  display: grid;
  grid-template-columns: repeat(7, minmax(0, 1fr));
  gap: 4px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.statgrid .cell { text-align: center; padding: 8px 2px; }
.statgrid .head { background: var(--card-2); color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .5px; }
.statgrid .val { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; }

.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th, .table td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.table th { color: var(--muted); font-size: 11px; letter-spacing: .3px; }
.table tr:last-child td { border-bottom: 0; }
.table .num { font-variant-numeric: tabular-nums; white-space: nowrap; }

.weapon-name { font-weight: 700; }
.weapon-props { color: var(--muted); font-size: 11px; }
.granted { color: var(--good); }
.removed { color: var(--danger); text-decoration: line-through; opacity: .75; }

.option-group { margin-bottom: 12px; }
.choice {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  min-height: var(--tap);
  padding: 9px 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg-2);
  margin-bottom: 6px;
  cursor: pointer;
}
.choice input { margin-top: 4px; accent-color: var(--accent); width: 20px; height: 20px; flex: none; }
.choice.disabled { opacity: .45; cursor: not-allowed; }
.choice .label { flex: 1; }
.choice .cost { color: var(--accent); font-weight: 700; white-space: nowrap; }

.bonus {
  border-left: 3px solid var(--good);
  padding: 6px 10px;
  margin: 6px 0;
  background: var(--bg-2);
  border-radius: 0 8px 8px 0;
}
.bonus .bonus-name { font-weight: 700; color: var(--good); }
.bonus .bonus-cond { color: var(--muted); font-size: 12px; }

.prose { white-space: pre-wrap; font-size: 14px; }
.prose ul, .prose ol { margin: 6px 0; padding-left: 20px; }

.empty {
  text-align: center;
  color: var(--muted);
  padding: 30px 12px;
  border: 1px dashed var(--line);
  border-radius: var(--radius);
}

.back-btn { margin-bottom: 12px; }

.total-bar {
  position: sticky;
  bottom: calc(70px + env(safe-area-inset-bottom));
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 12px;
  background: var(--card);
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  margin-top: 12px;
}

.export-actions { margin: 8px 0; }

.qty-btn { min-width: var(--tap); padding: 6px 10px; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(90px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  z-index: 50;
  max-width: min(90vw, 460px);
  padding: 10px 16px;
  border-radius: 10px;
  background: var(--accent);
  color: #1a1305;
  font-weight: 700;
  box-shadow: 0 8px 24px rgba(0,0,0,.45);
}

.footnote { color: var(--muted); font-size: 11px; text-align: center; padding: 18px 6px 4px; }

@media (min-width: 600px) {
  main { padding-left: 20px; padding-right: 20px; }
  .statgrid { grid-template-columns: repeat(7, 1fr); }
}
</style>
</head>

Quality, you can either select one Quality or you can randomly select one Quality by rolling a D6 and consulting the relevant table below. Until the end of the battle, the ability described in the Quality selected applies to all models in your army with this ability.\n\nThe first time your selected Deed is completed your Oath is fulfilled and, until the end of the battle, your army becomes Honoured and you gain 2CP, or 3CP if you randomly selected your Deed and/or Quality (CP gained in this way are an exemption to the Core Rules that limit the maximum number of CP you can gain per battle round to 1).\n\nDeed\nD6We vow to lay low the tyrant...\nAt the start of the battle, select one CHARACTER model in your opponent’s army. This Deed is completed at the end of a turn if that CHARACTER is destroyed. We swear to reclaim the realm...\nThis deed is completed at the end of your opponent’s turn if you control more objective markers than your opponent. We pledge to reap a great tally...\nThis deed is completed at the end of the battle round if the number of enemy units destroyed this battle round is greater than the battle round number even if those units are subsequently returned to the battlefield (for example, two destroyed enemy units in the first battle round). \nQuality\nD6...with our martial valour risen over all.\nEach time this model is selected to shoot or fight, you can re-roll one Hit roll and you can re-roll one Wound roll. ...and we are eager for the challenge.\nAdd 2\" to this model’s Move characteristic and add 1 to Advance and Charge rolls made for this model. ...yet shall our legacy be unsullied.\nImprove this model’s Objective Control characteristic by 2 and its Leadership characteristic by 1.","type":"Faction","model":"","shared":true},{"name":"Super-heavy Walker","description":"Each time a model with this ability makes a Normal, Advance or Fall Back move, it can move through models (excluding TITANIC models) and sections of terrain features that are 4\"   var CACHE_NAME = 'ap40k-' + String((rules.meta && rules.meta.hashSha256) || '').slice(0, 12);

  var state = {
    detachmentId: null,
    editingIndex: -1,
    configs: {},
    entries: [],
    enhancements: [],
    warlordKey: '',
    search: ''
  };

  /* ---------------------------------------------------------------- *
   * Small DOM toolkit — every data string goes through textContent.
   * ---------------------------------------------------------------- */

  var ALLOWED_ATTR = /^(id|role|aria-[a-z-]+|data-[a-z-]+|name|type|value|checked|disabled|readonly|placeholder|title|lang|href|target|rel|min|max|step|colspan|tabindex|autocomplete)$/;

  function el(tag, opts, children) {
    var node = document.createElement(tag);
    var o = opts || {};
    if (o.className) node.className = o.className;
    if (o.text !== undefined && o.text !== null) node.textContent = String(o.text);
    if (o.attrs) {
      Object.keys(o.attrs).forEach(function (k) {
        var v = o.attrs[k];
        if (v === null || v === undefined || v === false || !ALLOWED_ATTR.test(k)) return;
        if (k === 'href' && !/^\/#/.test(String(v))) return;
        node.setAttribute(k, String(v));
      });
    }
    var list = Array.isArray(children) ? children : [children];
    list.forEach(function (child) {
      if (child === null || child === undefined || child === false) return;
      if (child && typeof child === 'object' && child.nodeType) node.appendChild(child);
      else node.appendChild(document.createTextNode(String(child)));
    });
    if (o.value !== undefined) node.value = String(o.value);
    if (o.on) {
      Object.keys(o.on).forEach(function (evt) { node.addEventListener(evt, o.on[evt]); });
    }
    return node;
  }

  function clear(node) {
    while (node && node.firstChild) node.removeChild(node.firstChild);
  }

  function norm(value) {
    return String(value || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .replace(/[\u2019\u2018\u02bc`\u00b4']/g, '')
      .replace(/œ/gi, 'oe')
      .replace(/æ/gi, 'ae')
      .replace(/\s+/g, '')
      .toLowerCase()
      .trim();
  }

  function key(value) {
    return norm(value).replace(/[^a-z0-9]+/g, ' ').trim();
  }

  // Wahapedia names multi-profile weapons "Weapon - Mode" while an option only
  // names the weapon. Accept that trailing qualifier, never a bare substring:
  // removing "Flamer" must not also remove "Hand Flamer".
  var PROFILE_MODES = /^(standard|supercharge|strike|sweep)$/;

  function matchName(a, b) {
    var x = key(a);
    var y = key(b);
    if (!x || !y) return false;
    if (x === y) return true;
    var long = x.length >= y.length ? x : y;
    var short = x.length >= y.length ? y : x;
    if (long.indexOf(short) !== 0) return false;
    var qualifier = long.slice(short.length).trim();
    return Boolean(qualifier) && PROFILE_MODES.test(qualifier);
  }

  function makeKey() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  /* ---------------------------------------------------------------- *
   * Indexes and rules engine
   * ---------------------------------------------------------------- */

  var sheetIndex = {};
  var detachmentIndex = {};
  var leaderIndex = {};

  function rebuildIndexes() {
    sheetIndex = {};
    detachmentIndex = {};
    leaderIndex = {};
    rules.datasheets.forEach(function (s) { sheetIndex[s.id] = s; });
    rules.detachments.forEach(function (d) { detachmentIndex[d.id] = d; });
    (overrides.leaders || []).forEach(function (l) { leaderIndex[l.id] = l; });
  }
  rebuildIndexes();

  function sheetById(id) { return sheetIndex[String(id)] || null; }
  function detachmentById(id) { return detachmentIndex[String(id)] || null; }
  function leaderById(id) { return leaderIndex[String(id)] || null; }

  function groupList(sheetId) {
    return ((overrides.options || {})[sheetId] || {}).groups || [];
  }

  function availableSizes(sheet) {
    var seen = {};
    var out = [];
    (sheet.costs || []).forEach(function (c) {
      if (c.cost === null || c.cost === undefined) return;
      var m = String(c.text || '').match(/^(\d+)\s+models?$/i);
      if (!m) return;
      var n = Number(m[1]);
      if (!seen[n]) { seen[n] = true; out.push(n); }
    });
    return out.length ? out.sort(function (a, b) { return a - b; }) : [1];
  }

  function baseCost(sheet, size) {
    var entries = (sheet.costs || []).filter(function (c) {
      return c.cost !== null && c.cost !== undefined && /^\d+\s+models?$/i.test(String(c.text || ''));
    });
    var exact = entries.find(function (c) {
      return Number(String(c.text).match(/\d+/)[0]) === Number(size);
    });
    if (exact) return exact.cost;
    return entries.length ? entries[0].cost : 0;
  }

  function effectiveMax(group, size) {
    if (group.maxTakesPerModels) {
      return Math.min(group.max || 99, Math.floor(size / group.maxTakesPerModels));
    }
    var cap = group.maxTakes !== undefined ? group.maxTakes : group.max;
    return Math.max(0, Math.min(group.max || 99, cap === undefined ? group.max || 1 : cap));
  }

  // Drop unknown ids and orphaned requirements, order requirements before
  // their dependents, then apply the cap without separating a pair.
  function limitChoices(group, size, ids) {
    var known = {};
    var valid = {};
    var list = (Array.isArray(ids) ? ids : []).filter(function (id) {
      var choice = group.choices.find(function (c) { return c.id === id; });
      if (!choice) return false;
      known[id] = choice;
      valid[id] = true;
      return true;
    });
    var changed = true;
    while (changed) {
      changed = false;
      list = list.filter(function (id) {
        var missing = (known[id].requires || []).some(function (req) { return !valid[req]; });
        if (!missing) return true;
        delete valid[id];
        changed = true;
        return false;
      });
    }
    var depths = {};
    function depthOf(id, path) {
      if (path.indexOf(id) !== -1) return 0;
      if (depths[id] !== undefined) return depths[id];
      var reqs = (known[id].requires || []).filter(function (req) { return Boolean(known[req]); });
      var depth = reqs.length
        ? 1 + Math.max.apply(null, reqs.map(function (req) { return depthOf(req, path.concat(id)); }))
        : 0;
      depths[id] = depth;
      return depth;
    }
    // Array#sort is stable in modern engines: equal depths keep user order.
    list.sort(function (a, b) { return depthOf(a, []) - depthOf(b, []); });
    var max = effectiveMax(group, size);
    var kept = [];
    list.forEach(function (id) {
      if (kept.length >= max) return;
      if ((known[id].requires || []).some(function (req) { return kept.indexOf(req) === -1; })) return;
      kept.push(id);
    });
    return kept;
  }

  function defaultConfig(sheetId) {
    var sheet = sheetById(sheetId);
    var sizes = availableSizes(sheet);
    var cfg = { sheetId: sheetId, size: sizes[0], options: {}, leaders: [] };
    groupList(sheetId).forEach(function (g) {
      var def = g.choices.find(function (c) { return c.id === 'default'; });
      cfg.options[g.id] = def ? [def.id] : [];
    });
    return cfg;
  }

  function dedupeLeaders(ids) {
    var used = {};
    return ids.filter(function (id) {
      var leader = leaderById(id);
      if (!leader || used[leader.kind]) return false;
      used[leader.kind] = true;
      return true;
    });
  }

  function sanitizeConfig(raw) {
    if (!raw || typeof raw !== 'object') return null;
    var sheet = sheetById(raw.sheetId);
    if (!sheet) return null;
    var sizes = availableSizes(sheet);
    var size = sizes.indexOf(Number(raw.size)) !== -1 ? Number(raw.size) : sizes[0];
    var cfg = { sheetId: sheet.id, size: size, options: {}, leaders: [] };
    groupList(sheet.id).forEach(function (g) {
      cfg.options[g.id] = limitChoices(g, size, raw.options && raw.options[g.id]);
    });
    var ids = Array.isArray(raw.leaders) ? raw.leaders : [];
    cfg.leaders = dedupeLeaders(ids.filter(function (id) { return Boolean(leaderById(id)); }));
    return cfg;
  }

  function computeSheet(sheetId, config) {
    var sheet = sheetById(sheetId);
    if (!sheet) return null;
    var weapons = (sheet.weapons || []).map(function (w) { return Object.assign({}, w); });
    var added = [];
    var removed = [];

    groupList(sheetId).forEach(function (g) {
      (config.options[g.id] || []).forEach(function (id) {
        var choice = g.choices.find(function (c) { return c.id === id; });
        if (!choice) return;
        (choice.removes || []).forEach(function (name) {
          weapons = weapons.filter(function (w) {
            if (matchName(w.name, name)) { removed.push(w.name); return false; }
            return true;
          });
        });
        (choice.grants || []).forEach(function (name) {
          // Report the choice even when its profile already exists in the table
          // (starting loadout): the user still needs the visual confirmation.
          added.push(name);
          if (!choice.duplicate && weapons.some(function (w) { return matchName(w.name, name); })) return;
          var src = (sheet.weapons || []).find(function (w) { return matchName(w.name, name); });
          weapons.push(src
            ? Object.assign({}, src, { name: name })
            : { name: name, description: '', range: '', type: '', A: '', BS_WS: '', S: '', AP: '', D: '' });
          added.push(name);
        });
      });
    });

    var extra = 0;
    groupList(sheetId).forEach(function (g) {
      (config.options[g.id] || []).forEach(function (id) {
        var c = g.choices.find(function (x) { return x.id === id; });
        if (!c) return;
        extra += (c.cost || 0) * (c.costMode === 'perModel' ? config.size : 1);
      });
    });

    var bonuses = [];
    config.leaders.forEach(function (id) {
      var leader = leaderById(id);
      if (!leader) return;
      (leader.bonuses || []).forEach(function (b) {
        bonuses.push({
          leader: leader.name,
          name: b.name,
          text: b.text,
          condition: b.condition || ''
        });
      });
    });

    var unitPoints = baseCost(sheet, config.size) + extra;
    var leaderTotal = config.leaders.reduce(function (sum, id) {
      var leaderSheet = sheetById(id);
      return sum + (leaderSheet ? baseCost(leaderSheet, 1) : 0);
    }, 0);

    return {
      weapons: weapons,
      added: added,
      removed: removed,
      unitPoints: unitPoints,
      leaderTotal: leaderTotal,
      total: unitPoints + leaderTotal,
      bonuses: bonuses
    };
  }

  function leaderCandidates(sheetId, kind) {
    return (overrides.leaders || []).filter(function (l) {
      return l.kind === kind && (l.leadsTo || []).indexOf(sheetId) !== -1;
    });
  }

  /* ---------------------------------------------------------------- *
   * Persistence (validated, debounced, fault-tolerant)
   * ---------------------------------------------------------------- */

  var saveTimer = null;

  function flushSave() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        schemaVersion: 1,
        detachmentId: state.detachmentId,
        entries: state.entries,
        enhancements: state.enhancements,
        warlordKey: state.warlordKey,
        configs: state.configs
      }));
    } catch (e) {
      showToast('Sauvegarde locale indisponible');
    }
  }

  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(flushSave, 200);
  }

  function loadSaved() {
    var raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { return; }
    if (!raw) return;
    try {
      var data = JSON.parse(raw);
      if (!data || data.schemaVersion !== 1) return;
      state.detachmentId = detachmentById(data.detachmentId) ? data.detachmentId : null;
      var entries = Array.isArray(data.entries) ? data.entries : [];
      state.entries = entries.slice(0, 100).map(function (e) {
        var cfg = sanitizeConfig(e && e.config);
        if (!cfg) return null;
        var qty = Number(e.qty);
        return {
          key: String(e.key || makeKey()),
          sheetId: cfg.sheetId,
          qty: Math.min(20, Math.max(1, Number.isFinite(qty) ? qty : 1)),
          config: cfg
        };
      }).filter(Boolean);
      var enh = Array.isArray(data.enhancements) ? data.enhancements : [];
      state.enhancements = enh.map(function (e) {
        var found = findEnhancement(e && e.id);
        return found ? { id: found.id, detachmentId: found.detachmentId, name: found.name, cost: found.cost } : null;
      }).filter(Boolean);
      state.warlordKey = typeof data.warlordKey === 'string' ? data.warlordKey : '';
      state.configs = {};
      Object.keys(data.configs || {}).forEach(function (id) {
        var cfg = sanitizeConfig(data.configs[id]);
        if (cfg && cfg.sheetId === id) state.configs[id] = cfg;
      });
    } catch (e) {
      // Corrupt or hostile localStorage: keep a clean default state.
    }
  }

  function findEnhancement(id) {
    var found = null;
    rules.detachments.some(function (d) {
      var hit = (d.enhancements || []).find(function (x) { return x.id === id; });
      if (hit) { found = Object.assign({ detachmentId: d.id }, hit); return true; }
      return false;
    });
    return found;
  }

  /* ---------------------------------------------------------------- *
   * Routing + shell
   * ---------------------------------------------------------------- */

  function route() {
    var raw = location.hash.replace(/^#\/?/, '');
    var parts = raw.split('/').filter(Boolean);
    if (parts[0] === 'datasheets') return { view: 'datasheets', id: parts[1] || null };
    if (parts[0] === 'detachements') return { view: 'detachements', id: parts[1] || null };
    if (parts[0] === 'liste') return { view: 'liste', id: null };
    return { view: 'detachements', id: null };
  }

  function go(view, id) {
    location.hash = '#/' + view + (id ? '/' + encodeURIComponent(id) : '');
  }

  var TABS = [
    { view: 'detachements', icon: '\u25c6', label: 'Détachements' },
    { view: 'datasheets', icon: '\u2630', label: 'Datasheets' },
    { view: 'liste', icon: '\u2611', label: 'Ma liste' }
  ];

  function showToast(message) {
    var app = document.getElementById('app');
    if (!app) return;
    var old = document.getElementById('toast-node');
    if (old) old.parentNode.removeChild(old);
    var node = el('div', {
      className: 'toast',
      text: String(message),
      attrs: { id: 'toast-node', role: 'status' }
    });
    app.appendChild(node);
    setTimeout(function () {
      if (node.parentNode) node.parentNode.removeChild(node);
    }, 3200);
  }

  function renderHeader() {
    var btn = el('button', {
      className: 'icon-btn',
      text: 'Mettre à jour',
      attrs: { type: 'button', title: localMode ? 'Indisponible en mode fichier local' : 'Recharger rules.json et overrides.json' },
      on: { click: updateRules }
    });
    if (localMode) btn.disabled = true;
    return el('header', { className: 'app-header' }, [
      el('div', { className: 'brand' }, [
        el('span', { text: 'AP40K' }),
        el('small', { text: 'Space Marines · 11e édition' })
      ]),
      el('div', { className: 'header-spacer' }),
      btn
    ]);
  }

  function renderTabs(active) {
    var bar = el('nav', { className: 'tabbar', attrs: { role: 'tablist', 'aria-label': 'Navigation principale' } });
    TABS.forEach(function (tab, i) {
      var selected = tab.view === active;
      var btn = el('button', {
        attrs: {
          type: 'button',
          id: 'tab-' + tab.view,
          role: 'tab',
          'aria-selected': selected ? 'true' : 'false',
          'aria-controls': 'main-content',
          tabindex: selected ? '0' : '-1'
        },
        on: {
          click: function () { go(tab.view); },
          keydown: function (ev) {
            if (ev.key !== 'ArrowRight' && ev.key !== 'ArrowLeft') return;
            ev.preventDefault();
            var next = (i + (ev.key === 'ArrowRight' ? 1 : TABS.length - 1)) % TABS.length;
            go(TABS[next].view);
            var tabs = bar.querySelectorAll('[role="tab"]');
            if (tabs[next]) tabs[next].focus();
          }
        }
      }, [
        el('span', { className: 'tab-icon', text: tab.icon }),
        el('span', { text: tab.label })
      ]);
      bar.appendChild(btn);
    });
    return bar;
  }

  function backButton(view) {
    return el('button', {
      className: 'ghost back-btn',
      text: '‹ Retour',
      attrs: { type: 'button' },
      on: { click: function () { go(view); } }
    });
  }

  function render() {
    var app = document.getElementById('app');
    clear(app);
    var r = route();
    // Editing is scoped to one entry on one sheet: leaving that sheet cancels it.
    if (state.editingIndex >= 0) {
      var editing = state.entries[state.editingIndex];
      if (!editing || r.view !== 'datasheets' || r.id !== editing.sheetId) state.editingIndex = -1;
    }
    app.appendChild(renderHeader());
    var main = el('main');
    // Keep the main landmark and put the tabpanel role on a real child.
    var panel = el('div', {
      attrs: {
        id: 'main-content',
        role: 'tabpanel',
        tabindex: '0',
        'aria-labelledby': 'tab-' + r.view
      }
    });
    // Attach before view renderers: they resolve their containers via getElementById.
    main.appendChild(panel);
    app.appendChild(main);
    if (r.view === 'detachements') {
      if (r.id && detachmentById(r.id)) renderDetachmentDetail(panel, detachmentById(r.id));
      else renderDetachmentList(panel);
    } else if (r.view === 'datasheets') {
      if (r.id && sheetById(r.id)) renderSheetDetail(panel, sheetById(r.id));
      else renderSheetList(panel);
    } else {
      renderListView(panel);
    }
    app.appendChild(renderTabs(r.view));
    app.appendChild(el('div', {
      className: 'footnote',
      text: 'Projet fan made non affilié à Games Workshop · ' + (rules.meta.attribution || 'Powered by Wahapedia') +
        ' · Snapshot ' + (rules.meta.sourceVersion || '') + (localMode ? ' · Mode fichier local (hors ligne, sans mise à jour)' : '')
    }));
  }

  /* ---------------------------------------------------------------- *
   * Détachements
   * ---------------------------------------------------------------- */

  function renderDetachmentList(main) {
    main.appendChild(el('h1', { text: 'Détachements' }));
    main.appendChild(el('p', { className: 'muted small', text: '15 détachements Space Marines + 3 Dark Angels · édition 11' }));
    var input = el('input', {
      attrs: { type: 'search', id: 'det-search', placeholder: 'Rechercher un détachement, une règle…', autocomplete: 'off' },
      on: { input: refreshDetachmentResults }
    });
    main.appendChild(el('div', { className: 'search-wrap' }, [
      el('span', { className: 'mag', text: '\u26b2' }),
      input
    ]));
    main.appendChild(el('div', { attrs: { id: 'results' } }));
    refreshDetachmentResults();
  }

  function refreshDetachmentResults() {
    var box = document.getElementById('results');
    if (!box) return;
    var input = document.getElementById('det-search');
    state.search = input ? input.value : '';
    var q = norm(state.search);
    clear(box);
    var matches = rules.detachments.filter(function (d) {
      var hay = norm(d.name + ' ' + d.faction + ' ' + d.forceDisposition + ' ' +
        (d.rules || []).map(function (x) { return x.name + ' ' + x.description; }).join(' '));
      return !q || hay.indexOf(q) !== -1;
    });
    if (!matches.length) {
      box.appendChild(el('div', { className: 'empty', text: 'Aucun détachement trouvé.' }));
      return;
    }
    matches.forEach(function (d) {
      var badgeClass = d.faction === 'DA' ? 'badge da' : 'badge';
      var card = el('div', {
        className: 'card tappable',
        attrs: { role: 'button', tabindex: '0', 'data-id': d.id }
      }, [
        el('div', { className: 'row' }, [
          el('span', { className: 'card-title grow', text: d.name }),
          el('span', { className: badgeClass, text: d.faction === 'DA' ? 'Dark Angels' : 'Space Marines' })
        ]),
        el('div', { className: 'card-sub' }, [
          el('span', { text: d.dp + ' DP · ' }),
          el('span', { text: (d.rules || []).map(function (x) { return x.name; }).join(', ') || '—' })
        ]),
        el('div', { className: 'tiny muted', text: d.stratagems.length + ' stratagèmes · ' + d.enhancements.length + ' améliorations' })
      ]);
      var open = function () { go('detachements', d.id); };
      card.addEventListener('click', open);
      card.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
      });
      box.appendChild(card);
    });
  }

  function renderDetachmentDetail(main, d) {
    main.appendChild(backButton('detachements'));
    main.appendChild(el('div', { className: 'row' }, [
      el('h1', { className: 'grow', text: d.name }),
      el('span', { className: d.faction === 'DA' ? 'badge da' : 'badge', text: d.dp + ' DP' })
    ]));
    if (d.legend) main.appendChild(el('p', { className: 'prose muted', text: d.legend }));

    main.appendChild(el('div', { className: 'section-title', text: 'Règles' }));
    if (!(d.rules || []).length) main.appendChild(el('p', { className: 'muted', text: 'Aucune règle détaillée dans le snapshot.' }));
    (d.rules || []).forEach(function (rule) {
      var card = el('div', { className: 'card' }, [
        el('div', { className: 'card-title', text: rule.name })
      ]);
      if (rule.description) card.appendChild(el('p', { className: 'prose small', text: rule.description }));
      main.appendChild(card);
    });

    if (d.forceDisposition || (d.chapterDp || []).length) {
      main.appendChild(el('div', { className: 'section-title', text: 'Restrictions' }));
      if (d.forceDisposition) main.appendChild(el('p', { className: 'small', text: 'Disposition de force : ' + d.forceDisposition }));
      (d.chapterDp || []).forEach(function (c) {
        main.appendChild(el('p', { className: 'small muted', text: c.keyword + ' : ' + c.dp + ' DP' }));
      });
    }

    main.appendChild(el('div', { className: 'section-title', text: 'Améliorations (' + d.enhancements.length + ')' }));
    if (!d.enhancements.length) main.appendChild(el('p', { className: 'muted', text: 'Aucune amélioration.' }));
    d.enhancements.forEach(function (e) {
      var card = el('div', { className: 'card' }, [
        el('div', { className: 'spread' }, [
          el('span', { className: 'card-title', text: e.name }),
          el('span', { className: 'points', text: e.cost + ' pts' })
        ]),
        el('p', { className: 'prose small', text: e.description }),
        el('button', {
          className: 'ghost small',
          text: 'Ajouter à Ma liste',
          attrs: { type: 'button' },
          on: {
            click: function () {
              if (state.detachmentId !== d.id) {
                state.detachmentId = d.id;
                state.enhancements = [];
              }
              if (!state.enhancements.some(function (x) { return x.id === e.id; })) {
                state.enhancements.push({ id: e.id, detachmentId: d.id, name: e.name, cost: e.cost });
              }
              scheduleSave();
              showToast('Amélioration ajoutée : ' + e.name);
            }
          }
        })
      ]);
      main.appendChild(card);
    });

    main.appendChild(el('div', { className: 'section-title', text: 'Stratagèmes (' + d.stratagems.length + ')' }));
    if (!d.stratagems.length) main.appendChild(el('p', { className: 'muted', text: 'Aucun stratagème.' }));
    d.stratagems.forEach(function (s) {

  function refreshSheetResults() {
    var box = document.getElementById('results');
    if (!box) return;
    var input = document.getElementById('sheet-search');
    state.search = input ? input.value : '';
    var q = norm(state.search);
    clear(box);
    var matches = rules.datasheets.filter(function (s) {
      var hay = norm(s.name + ' ' + s.role + ' ' + s.factionId + ' ' +
        (s.keywords || []).map(function (k) { return k.name; }).join(' '));
      return !q || hay.indexOf(q) !== -1;
    });
    if (!matches.length) {
      box.appendChild(el('div', { className: 'empty', text: 'Aucune fiche trouvée.' }));
      return;
    }
    matches.forEach(function (s) {
      var badge = s.factionId === 'QI' ? 'badge ki' : (s.isSupport ? 'badge support' : 'badge');
      var card = el('div', {
        className: 'card tappable',
        attrs: { role: 'button', tabindex: '0', 'data-id': s.id }
      }, [
        el('div', { className: 'row' }, [
          el('span', { className: 'card-title grow', text: s.name }),
          el('span', { className: badge, text: s.isSupport ? 'Support' : (s.factionId === 'QI' ? 'Imperial Knights' : s.role.split(' ')[0]) })
        ]),
        el('div', { className: 'card-sub', text: s.role }),
        el('div', { className: 'tiny muted', text: 'dès ' + baseCost(s, availableSizes(s)[0]) + ' pts · ' + groupList(s.id).length + ' groupe(s) d’options' })
      ]);
      var open = function () { go('datasheets', s.id); };
      card.addEventListener('click', open);
      card.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); open(); }
      });
      box.appendChild(card);
    });

  function renderOptions(sheetId, cfg, container) {
    clear(container);
    var groups = groupList(sheetId);
    if (!groups.length) {
      container.appendChild(el('p', { className: 'muted small', text: 'Aucune option d’armement pour cette fiche.' }));
      return;
    }
    groups.forEach(function (g) {
      var box = el('div', { className: 'option-group' });
      box.appendChild(el('div', { className: 'section-title', text: g.label }));
      var max = effectiveMax(g, cfg.size);
      if (g.maxTakesPerModels) {
        box.appendChild(el('div', { className: 'small muted', text: 'Maximum ' + max + ' pour ' + cfg.size + ' modèles.' }));
      }
      g.choices.forEach(function (c) {
        var chosen = cfg.options[g.id] || [];
        var selected = chosen.indexOf(c.id) !== -1;
        var requiresMissing = (c.requires || []).some(function (req) { return chosen.indexOf(req) === -1; });
        var disabled = !selected && ((g.mode === 'multi' && chosen.length >= max) || requiresMissing);
        var input = el('input', {
          attrs: {
            type: g.mode === 'single' ? 'radio' : 'checkbox',
            name: g.id,
            value: c.id
          },
          on: {
            change: function () { setChoice(sheetId, g.id, c.id, input.checked); }
          }
        });
        if (selected) input.checked = true;
        if (disabled) input.disabled = true;
        box.appendChild(el('label', { className: 'choice' + (disabled ? ' disabled' : '') }, [
          input,
          el('div', { className: 'grow' }, [
            el('div', { text: c.label }),
            c.note ? el('div', { className: 'tiny muted', text: c.note }) : null
          ]),
          c.cost ? el('div', { className: 'cost', text: '+' + c.cost } ) : null
        ]));
      });
      container.appendChild(box);
    });
  }

  function setChoice(sheetId, groupId, choiceId, checked) {
    var cfg = currentConfig();
    var g = groupList(sheetId).find(function (x) { return x.id === groupId; });
    if (!g) return;
    var arr = (cfg.options[groupId] || []).slice();
    if (g.mode === 'single') {
      arr = checked ? [choiceId] : [];
      if (!arr.length && g.choices[0] && g.choices[0].id === 'default') arr = ['default'];
    } else if (checked) {
      var picked = g.choices.find(function (c) { return c.id === choiceId; });
      if (picked && (picked.requires || []).some(function (req) { return arr.indexOf(req) === -1; })) return;
      if (arr.indexOf(choiceId) === -1) arr.push(choiceId);
      arr = limitChoices(g, cfg.size, arr);
    } else {
      // Unchecking a prerequisite must also drop choices that depend on it.
      arr = limitChoices(g, cfg.size, arr.filter(function (id) { return id !== choiceId; }));
    }
    cfg.options[groupId] = arr;
    renderOptions(sheetId, cfg, document.getElementById('options-box'));
    paintPreview();
    scheduleSave();
  }

  function currentConfig() {
    var id = route().id;
    if (!state.configs[id]) state.configs[id] = defaultConfig(id);

      var candidates = leaderCandidates(sheetId, spec[0]);

            scheduleSave();

        select.appendChild(el('option', { value: l.id, text: l.name }));
      });

      container.appendChild(el('label', { className: 'small muted', text: spec[1] }));

  function addToSheetList(sheetId) {
    var cfg = sanitizeConfig(currentConfig()) || defaultConfig(sheetId);
    if (state.editingIndex >= 0 && state.entries[state.editingIndex]) {
      state.entries[state.editingIndex].config = cfg;
      showToast('Unité mise à jour');
    } else {
      state.entries.push({ key: makeKey(), sheetId: sheetId, qty: 1, config: cfg });
      showToast('Ajouté à Ma liste : ' + sheetById(sheetId).name);
    }
    state.editingIndex = -1;
    scheduleSave();
    go('liste');

  function entryPoints(entry) {
    var result = computeSheet(entry.sheetId, entry.config);
    return result ? { unit: result.unitPoints * entry.qty, total: result.total * entry.qty, result: result } : { unit: 0, total: 0, result: null };
  }

  function factionIssues() {
    var det = detachmentById(state.detachmentId);
    var issues = [];
    if (!det) return issues;
    var chapterKeywords = /^(DARK ANGELS|BLOOD ANGELS|SPACE WOLVES|BLACK TEMPLARS|DEATHWATCH|IMPERIAL FISTS|IRON HANDS|RAVEN GUARDS|SALAMANDERS|ULTRAMARINES|WHITE SCARS)$/i;
    state.entries.forEach(function (e) {
      var sheet = sheetById(e.sheetId);
      if (!sheet) return;
      if (det.faction === 'DA') {
        var da = (sheet.keywords || []).some(function (k) { return k.name === 'DARK ANGELS'; });
        if (!da) issues.push(sheet.name + ' : mot-clé DARK ANGELS absent');
      } else {
        var second = (sheet.keywords || []).some(function (k) { return k.factionKeyword && chapterKeywords.test(k.name); });
        if (second) issues.push(sheet.name + ' : second mot-clé de chapitre');
      }
    });
    return issues;
  }

          }),
          el('button', {
            text: 'Retirer',
            className: 'danger',
            attrs: { type: 'button' },
            on: { click: function () { removeEntry(index); } }
          })
        ])
      ]);
      main.appendChild(card);
    });

    if (state.entries.length) {
      var warlordSelect = el('select', {
        attrs: { id: 'warlord-select', 'aria-label': 'Warlord' },
        on: {
          change: function () {
            state.warlordKey = warlordSelect.value;
            scheduleSave();
          }
        }
      }, [el('option', { value: '', text: 'Aucun warlord' })]);
      state.entries.forEach(function (e) {
        warlordSelect.appendChild(el('option', { value: e.key, text: sheetById(e.sheetId).name }));
      });
      warlordSelect.value = state.warlordKey;
      main.appendChild(el('div', { className: 'section-title', text: 'Warlord' }));
      main.appendChild(warlordSelect);
    }

    var total = state.entries.reduce(function (sum, e) { return sum + entryPoints(e).total; }, 0);
    var enhTotal = state.enhancements.reduce(function (sum, e) { return sum + (e.cost || 0); }, 0);
    main.appendChild(el('div', { className: 'total-bar' }, [
      el('span', { className: 'small', text: 'Total indicatif' }),
      el('b', { text: (total + enhTotal) + ' pts' })
    ]));
    main.appendChild(el('p', { className: 'tiny muted center', text: overrides.points.label + ' · ' + overrides.points.rounding }));

    var issues = factionIssues();
    if (issues.length) {
      main.appendChild(el('div', { className: 'section-title', text: 'Points de vigilance' }));
      issues.forEach(function (issue) { main.appendChild(el('p', { className: 'small', text: '• ' + issue })); });
    }

    main.appendChild(el('div', { className: 'section-title', text: 'Export / import' }));
    var exportArea = el('textarea', { attrs: { id: 'export-area', readonly: 'readonly', 'aria-label': 'Export de la liste' } });
    exportArea.value = exportText();
    var importArea = el('textarea', { attrs: { id: 'import-area', placeholder: 'Coller un export AP40K-LIST v1', 'aria-label': 'Import de la liste' } });
    main.appendChild(exportArea);
    main.appendChild(el('div', { className: 'row export-actions' }, [
      el('button', {
        text: 'Copier',
        attrs: { type: 'button' },
        on: {
          click: function () {
            if (!navigator.clipboard) { showToast('Copie indisponible sur cet appareil'); return; }
            navigator.clipboard.writeText(exportArea.value)
              .then(function () { showToast('Liste copiée'); })
              .catch(function () { showToast('Copie refusée par le navigateur'); });
          }
        }
      }),
      el('button', {
        text: 'Actualiser l’export',
        className: 'ghost',
        attrs: { type: 'button' },
        on: { click: function () { exportArea.value = exportText(); } }
      })
    ]));
    main.appendChild(importArea);
    main.appendChild(el('button', {
      className: 'primary',
      text: 'Importer cette liste',
      attrs: { type: 'button' },
      on: {
        click: function () { importText(importArea.value); }
      }
    }));
  }

  function changeQty(index, delta) {
    var entry = state.entries[index];
    if (!entry) return;
    entry.qty = Math.min(20, Math.max(1, entry.qty + delta));
    scheduleSave();
    render();
  }

  function removeEntry(index) {
    var removed = state.entries.splice(index, 1)[0];
    if (removed && state.warlordKey === removed.key) state.warlordKey = '';
    if (state.editingIndex === index) state.editingIndex = -1;
    scheduleSave();
    render();
  }

  function exportText() {
    var lines = ['AP40K-LIST v1'];
    lines.push('# Ap40k — liste locale (total indicatif)');
    lines.push('# ' + overrides.points.label);
    lines.push('DETACHMENT: ' + (state.detachmentId || ''));
    // Export an index: imported entries get fresh keys, so a raw key would
    // always be orphaned on the way back in.
    var warlordIndex = state.entries.findIndex(function (e) { return e.key === state.warlordKey; });
    lines.push('WARLORD: ' + (warlordIndex >= 0 ? String(warlordIndex) : ''));
    lines.push('ENHANCEMENTS: ' + state.enhancements.map(function (e) { return e.id; }).join(','));
    state.entries.forEach(function (e) {
      var opt = Object.keys(e.config.options || {}).map(function (gid) {
        return gid + '=' + (e.config.options[gid] || []).join(',');
      }).join(';');
      lines.push(['UNIT', e.sheetId, e.qty, e.config.size, opt, (e.config.leaders || []).join(',')].join('|'));
    });
    lines.push('END');
    lines.push('');
    lines.push('# Lecture humaine');
    var det = detachmentById(state.detachmentId);
    lines.push('Détachement : ' + (det ? det.name : '—'));
    state.entries.forEach(function (e) {
      var sheet = sheetById(e.sheetId);
      if (!sheet) return;
      var pts = entryPoints(e);
      lines.push('- ' + e.qty + '× ' + sheet.name + ' (' + e.config.size + ') — ' + pts.total + ' pts');
    });
    var total = state.entries.reduce(function (sum, e) { return sum + entryPoints(e).total; }, 0);
    var enhTotal = state.enhancements.reduce(function (sum, e) { return sum + (e.cost || 0); }, 0);
    lines.push('TOTAL : ' + (total + enhTotal) + ' pts (indicatif)');
    return lines.join('\n');
  }

  function importText(text) {
    var lines = String(text || '').split(/\r?\n/);
    var parsed = { detachmentId: '', warlordKey: '', enhancements: [], entries: [] };
    lines.forEach(function (line) {
      if (line.indexOf('DETACHMENT: ') === 0) parsed.detachmentId = line.slice(12).trim();
      else if (line.indexOf('WARLORD: ') === 0) parsed.warlordKey = line.slice(9).trim();
      else if (line.indexOf('ENHANCEMENTS: ') === 0) {
        parsed.enhancements = line.slice(14).split(',').map(function (x) { return x.trim(); }).filter(Boolean);
      } else if (line.indexOf('UNIT|') === 0) {
        var p = line.split('|');
        if (p.length < 4) return;
        var options = {};
        (p[4] || '').split(';').forEach(function (pair) {
          if (!pair) return;
          var kv = pair.split('=');
          if (kv.length === 2) options[kv[0]] = kv[1].split(',').filter(Boolean);
        });
        var cfg = sanitizeConfig({
          sheetId: p[1],
          size: Number(p[3]),
          options: options,
          leaders: (p[5] || '').split(',').filter(Boolean)
        });
        if (!cfg) return;
        parsed.entries.push({
          key: makeKey(),
          sheetId: cfg.sheetId,
          qty: Math.min(20, Math.max(1, Number(p[2]) || 1)),
          config: cfg
        });
      }
    });
    parsed.entries = parsed.entries.filter(function (e) { return e.config; });
    if (!parsed.entries.length && lines.indexOf('AP40K-LIST v1') === -1) {
      showToast('Format non reconnu');
      return;
    }
    state.detachmentId = detachmentById(parsed.detachmentId) ? parsed.detachmentId : null;
    state.entries = parsed.entries;
    state.enhancements = parsed.enhancements.map(function (id) { return findEnhancement(id); })
      .filter(function (e) { return e && e.detachmentId === state.detachmentId; })
      .map(function (e) { return { id: e.id, detachmentId: e.detachmentId, name: e.name, cost: e.cost }; });
    var warlordRef = /^\d+$/.test(parsed.warlordKey)
      ? (parsed.entries[Number(parsed.warlordKey)] || {}).key
      : parsed.warlordKey;
    state.warlordKey = parsed.entries.some(function (e) { return e.key === warlordRef; }) ? warlordRef : '';
    state.configs = {};
    scheduleSave();
    showToast('Liste importée : ' + state.entries.length + ' unité(s)');
    render();
  }

  /* ---------------------------------------------------------------- *
   * Update + service worker
   * ---------------------------------------------------------------- */

  function canonical(value) {
    if (Array.isArray(value)) return value.map(canonical);
    if (value && typeof value === 'object') {
      var out = {};
      Object.keys(value).sort().forEach(function (k) { out[k] = canonical(value[k]); });
      return out;
    }
    return value;
  }

  async function canonicalHash(value) {
    var bytes = new TextEncoder().encode(JSON.stringify(canonical(value)));
    var digest = await crypto.subtle.digest('SHA-256', bytes);
    return Array.from(new Uint8Array(digest)).map(function (b) {
      return b.toString(16).padStart(2, '0');
    }).join('');
  }

  // A runtime fetch replaces the editor layer globally: validate the shape the
  // renderers actually use before committing, or a later hashchange would crash
  // outside the updater's try/catch.
  function validOverrides(value) {
    if (!value || !Array.isArray(value.leaders) ||
        !value.options || typeof value.options !== 'object' ||
        !value.capLimits || typeof value.capLimits !== 'object' ||
        !value.points || typeof value.points !== 'object' ||
        typeof value.points.label !== 'string' ||
        typeof value.points.rounding !== 'string') return false;
    var leaderIds = {};
    for (var i = 0; i < value.leaders.length; i += 1) {
      var leader = value.leaders[i];
      if (!leader || typeof leader.id !== 'string' || typeof leader.kind !== 'string' ||
          typeof leader.name !== 'string' || leaderIds[leader.id]) return false;
      leaderIds[leader.id] = true;
    }
    var sheets = Object.keys(value.options);
    for (var s = 0; s < sheets.length; s += 1) {
      var entry = value.options[sheets[s]];
      if (!entry || !Array.isArray(entry.groups)) return false;
      for (var g = 0; g < entry.groups.length; g += 1) {
        var group = entry.groups[g];
        if (!group || typeof group.id !== 'string' || !Array.isArray(group.choices)) return false;
        for (var c = 0; c < group.choices.length; c += 1) {
          var choice = group.choices[c];
          if (!choice || typeof choice.id !== 'string') return false;
          if (['requires', 'removes', 'grants'].some(function (field) {
            return choice[field] !== undefined && !Array.isArray(choice[field]);
          })) return false;
        }
      }
    }
    return true;
  }

  async function updateRules() {
    if (localMode) { showToast('Mise à jour indisponible en mode fichier local'); return; }
    try {
      // Both layers must be fetched together: mixing a new rules.json with the
      // editorial layer frozen at build time would mix new costs with old
      // option surcharges, bonuses and point dates.
      var responses = await Promise.all([
        fetch('./data/rules.json', { cache: 'no-store' }),
        fetch('./data/overrides.json', { cache: 'no-store' })
      ]);
      responses.forEach(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
      });
      var next = await responses[0].json();
      var nextOverrides = await responses[1].json();
      if (!next.meta || Number(next.meta.edition) !== 11 ||
          !Array.isArray(next.detachments) || !Array.isArray(next.datasheets)) {
        throw new Error('format de données invalide');
      }
      // Self-contained integrity check: validate the fetched payload against
      // its own metadata, not against the version frozen in the inline boot.
      var hash = await canonicalHash({ detachments: next.detachments, datasheets: next.datasheets });
      if (hash !== next.meta.hashSha256) throw new Error('empreinte invalide');
      if (!validOverrides(nextOverrides) ||
          nextOverrides.sourceVersion !== next.meta.sourceVersion ||
          nextOverrides.sourceHash !== next.meta.hashSha256) {
        throw new Error('couche éditoriale incompatible');
      }

      rules = next;
      overrides = nextOverrides;
      rebuildIndexes();

      // Revalidate local state: a newer snapshot may have dropped ids.
      state.entries = state.entries.map(function (e) {
        var cfg = sanitizeConfig(e.config);
        return cfg ? { key: e.key, sheetId: cfg.sheetId, qty: e.qty, config: cfg } : null;
      }).filter(Boolean);
      var rebuilt = {};
      Object.keys(state.configs).forEach(function (id) {
        var cfg = sanitizeConfig(state.configs[id]);
        if (cfg && cfg.sheetId === id) rebuilt[id] = cfg;
      });
      state.configs = rebuilt;
      state.enhancements = state.enhancements.filter(function (e) {
        return Boolean(findEnhancement(e.id));
      });
      if (state.detachmentId && !detachmentById(state.detachmentId)) state.detachmentId = null;
      if (!state.entries.some(function (e) { return e.key === state.warlordKey; })) state.warlordKey = '';
      state.editingIndex = -1;

      if ('caches' in window) {
        // Write to the cache owned by the active service worker, not to a new
        // name that would be wiped on the next activate.
        var cache = await caches.open(CACHE_NAME);
        await Promise.all([
          ['./data/rules.json', next],
          ['./data/overrides.json', nextOverrides]
        ].map(function (pair) {
          return cache.put(pair[0], new Response(JSON.stringify(pair[1]), {
            headers: { 'content-type': 'application/json' }
          }));
        }));
      }
      render();
      showToast('Données à jour : ' + next.meta.sourceVersion);
    } catch (e) {
      showToast('Mise à jour impossible : ' + (e && e.message ? e.message : 'erreur'));
    }
  }

  loadSaved();
  window.addEventListener('hashchange', render);
  window.addEventListener('pagehide', flushSave);
  if ('serviceWorker' in navigator && !localMode) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () { /* offline first load still works */ });
    });
  }
  render();
}());
</script>
</body>
</html>
